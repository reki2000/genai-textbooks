- id: general-relativity
  category: natural-science
  created: '2026-07-05T10:35:11+09:00'
  question: ニュートン重力の瞬時作用を捨てると、重力は何として記述され、太陽のそばを通る電波はどれだけ曲がるのか。
  plot: 年に一度、太陽の縁をかすめる電波源の観測前日。特殊相対論を学んだばかりのやる夫は、ずれ続ける観測所の時計を合わせ直し、ニュートンで偏向を予言して姪への中継資料を片づけようとする。だが時計のずれも光の曲がりも、瞬時の力では説明できない。やらない夫と、計量・測地線・曲率を一晩で組み立て直し、正午の測定で予言を検算する。
