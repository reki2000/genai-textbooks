  question: 首都圏の道路は、どうすれば丸暗記せずに覚えられるのか、道の形と名前は何を語っているのか。
  plot: 配車ドライバーで一儲けを夢見るやる夫が、ベテランタクシー運転手やらない夫の車内で、日本橋からの放射と環状の骨格、川の上を走る首都高、国道番号、通り名の着替え、地形と鉄道までを再発見していく。
