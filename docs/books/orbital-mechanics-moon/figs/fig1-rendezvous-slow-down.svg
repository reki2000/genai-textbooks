<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
<title id="title">図1　前へ追いつくには、まず後ろ向きに噴射する</title>
<desc id="desc">減速して低い軌道へ入ると、短い周期で内側から先回りできる</desc>
<defs><marker id="arw-e34948" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="arw-1baf7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="400.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図1　前へ追いつくには、まず後ろ向きに噴射する</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">減速して低い軌道へ入ると、短い周期で内側から先回りできる</text>
<circle cx="270.0" cy="230.0" r="58.0" fill="#eaf4ff" stroke="#2a78d6" stroke-width="2"/>
<text x="270.0" y="235.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="middle">地球</text>
<circle cx="270.0" cy="230.0" r="132.0" fill="none" stroke="#7b7a75" stroke-width="1.8" stroke-dasharray="6 5"/>
<path d="M160,214 A110,116 0 1,0 380,214 A110,116 0 1,0 160,214" fill="none" stroke="#1baf7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="300.0" cy="102.0" r="7.0" fill="#eb6834" stroke="#fff" stroke-width="2"/>
<text x="300.0" y="82.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#eb6834" text-anchor="middle">100 m前の仲間</text>
<circle cx="270.0" cy="98.0" r="7.0" fill="#2a78d6" stroke="#fff" stroke-width="2"/>
<line x1="260.0" y1="98.0" x2="218.0" y2="98.0" stroke="#e34948" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arw-e34948)"/>
<text x="208.0" y="90.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#e34948" text-anchor="end">減速</text>
<path d="M277,99 C368,128 363,258 296,326" fill="none" stroke="#1baf7a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arw-1baf7a)"/>
<text x="438.0" y="174.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#52514e" text-anchor="start">低い軌道</text>
<text x="438.0" y="195.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#52514e" text-anchor="start">半長軸が小さい</text>
<text x="438.0" y="216.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#52514e" text-anchor="start">→ 周期が短い</text>
<text x="438.0" y="237.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#52514e" text-anchor="start">→ 内側から先回り</text>
<rect x="430.0" y="270.0" width="270.0" height="66.0" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/>
<text x="565.0" y="301.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">その場の速度ではなく</text>
<text x="565.0" y="318.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">噴射後の軌道全体で考える</text>
<text x="380.0" y="378.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#7b7a75" text-anchor="middle">軌道は模式表示（高度差は強調）</text>
</svg>
