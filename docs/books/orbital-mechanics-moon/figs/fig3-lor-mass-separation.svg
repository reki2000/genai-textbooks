<line x1="590.0" y1="291.0" x2="638.0" y2="266.0" stroke="#1baf7a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arw-1baf7a)"/>
<text x="562.0" y="347.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#1baf7a" text-anchor="middle">月面往復は着陸機だけ</text>
<line x1="354.0" y1="225.0" x2="390.0" y2="225.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arw-52514e)"/>
<text x="380.0" y="397.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">指数で増える燃料連鎖を、月周回で機体を分けて断ち切る</text>
