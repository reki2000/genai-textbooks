  question: 5万人が同時に集まる夜、たった12秒の声を携帯電話網の端から端まで確実に届けるには何が必要か。
  plot: 新設キャリアの実証会場である星見ヶ丘音楽祭で、やる夫の「アンテナ一本で全員つなぐ」網が開場直後に沈黙する。金色の試験端末と12秒の合図を追い、音声符号化、変調、誤り訂正、都市の反射、多元接続、セル、ハンドオーバ、コア網、規格、衛星を一つの呼の旅として組み直す。
