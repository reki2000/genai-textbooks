  question: 基地局も回線も失った半島で、声やデータはどうやって電波に載り、限られた周波数と機材で数百人を外とつなぎ直すのか。
  plot: 地震で通信が全滅した汐見半島へ、新設キャリアのCTOやる夫が可搬型基地局を担いで乗り込む。「高い所から大出力で叫べば半島全部」から出発し、衛星の最初の一本、化ける伝言、尾根と瓦礫、800台が一斉に鳴る体育館、他社の船と海外救援の箱を経て、雨の夜に上ノ谷の避難指示を届ける。
