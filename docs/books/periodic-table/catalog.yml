documents:
- id: periodic-table
  category: natural-science
  created: '2026-08-01T13:55:48+09:00'
  question: 石と炎しか知らない状態から出発して、物質の種類の一覧をどうやって突き止め、なぜそれが表の形に収まるのか。
  plot: 白い粉を見分けられないやる夫が、混合物と化合物の区別、気体の同定と質量保存、フロギストン説から酸素へ、水の合成と分解、定比例と倍数比例、原子量と分子の分離、電気分解が暴いた新元素と反応の家族を経て、周期性の発見と空欄を残す決断、さらに原子量の逆転と同位体・電子配置まで辿り着く。
