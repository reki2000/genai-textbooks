documents:
- id: standard-model-v2
  category: natural-science
  created: '2026-08-23T20:43:11+09:00'
  question: 検出器に見えない粒子を、標準模型はどうやって「いた」と判定できるのか。
  plot: 素粒子展の公開前夜、衝突事象E-17を見た科学館解説員やる夫は「未知粒子」、検出器保守技師やらない夫は「故障」と予想し、夜明けの公開判定で負けた側が巨大速報字幕を撤去する賭けをする。飛跡、電磁シャワー、ジェット、読出し時刻、横運動量を互いの仮説へぶつけ、両方の早合点を崩しながら、場・対称性・相互作用・真空から標準模型の推理経路を再構成する。
