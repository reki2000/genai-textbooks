<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">図3　同じ共動スケールが地平線を出て、後に戻る</title>
<desc id="desc">インフレーション中は c/(aH) が縮み、通常膨張では育つ。固定された波長との交差が地平線退出・再突入になる</desc>
