<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">インフレーション中は c/(aH) が縮み、通常膨張では育つ。固定された波長との交差が地平線退出・再突入になる</text>
