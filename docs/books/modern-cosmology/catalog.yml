documents:
- id: modern-cosmology
  category: natural-science
  created: '2026-07-31T21:40:23+09:00'
  question: 宇宙の膨張史は、光・元素・銀河・重力波の観測から微積分とニュートン力学でどこまで組み立てられ、どこからが模型を通した推定で、何がまだ分からないのか。
  plot: 科学館のプラネタリウムで夏の特別投影を任されたやる夫は、旧友のやらない夫が観測データから作った七つの音を「低い音ほど昔」と並べ、半音上げただけで宇宙を若返らせてしまう。初日までの3週間、ニュートンの球と膨張する箱の熱力学からフリードマン方程式を組み立て、宇宙年齢、赤方偏移と距離、元素合成、宇宙背景放射の音響ピーク、インフレーション、構造形成、加速膨張とハッブル定数の緊張を順にたどり、台本の一文ずつを「測った」と「推した」に書き分けていく。
