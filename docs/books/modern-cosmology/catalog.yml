- id: modern-cosmology
  title: やる夫で学ぶ現代宇宙論――宇宙の履歴を再発明する
  category: natural-science
  created: '2026-07-31T21:40:23+09:00'
  question: 宇宙の膨張史は、一般相対論と光・元素・銀河の観測からどこまで復元でき、何がまだ分からないのか。
  plot: 旧天文台の検収室で正体不明の観測データを渡されたやる夫が、宇宙原理とFLRW計量、フリードマン方程式、熱史、CMB、構造形成、インフレーション、暗黒物質と暗黒エネルギーを順に組み立て、標準宇宙論の成功と未解決問題を再発見する。
