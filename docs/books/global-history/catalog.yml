documents:
- id: global-history
  category: society
  created: '2026-08-02T17:20:00+09:00'
  question: 世界史に中心を置かない公平な語り方はあるのか、それとも中心を持つことと、中心を隠さないことは別の話なのか。
  plot: 文化祭で「人類5000年を30分で」という完全な世界史展示を作ろうとしたやる夫が、ファミレスの隣席の男に空白地帯を突かれる。各地域3分の平等、人口比、面積比と物差しを変えるたびに公平が壊れ、朝鮮半島、東南アジア、インド、中東、アフリカ、アメリカ大陸、太平洋へカメラの中心を移すたびに、同じ中国も同じ日本も役柄を変える。1492年と1945年を同時に眺め、冷戦を二色で塗ろうとして数十か国を塗り残し、最後は航海日誌の過剰解釈で自分が転ぶ。完全中立を捨てた先で、展示の壁に結論ではなく8つの問いを貼るまで。
