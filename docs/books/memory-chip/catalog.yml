documents:
- id: memory-chip
  category: engineering
  created: '2026-08-09T11:09:00+09:00'
  question: 0と1を「作る」より「残す」ほうが、なぜこれほど難しいのか。
  plot: メモリ価格の高騰に腹を立てたやる夫が、電球とスイッチで1bitメモリを作ろうとして失敗する。電信のリレー、真空管、磁気コアから半導体へ、STATE・WRITE・READ・SELECT・量産・規格という6つの問いを携えて150年をたどり、セルの微細化、3D積層、歩留まり、そして工場と市況の壁に順に殴られる。最後に、最高のメモリを作る夢を捨てて「仕事を分ける」という答えへ着地する。
