<text x="40.0" y="154.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Aに電流が流れる</text>
<text x="40.0" y="170.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#0b0b0b" text-anchor="start">→ Aの陽極電圧が下がる</text>
<text x="40.0" y="186.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#0b0b0b" text-anchor="start">→ Bの格子が下げられる</text>
<text x="40.0" y="202.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#0b0b0b" text-anchor="start">→ Bがますます止まる</text>
<text x="40.0" y="218.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#0b0b0b" text-anchor="start">→ Bの陽極は高いまま</text>
<text x="40.0" y="234.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#0b0b0b" text-anchor="start">→ Aの格子を高く保つ</text>
