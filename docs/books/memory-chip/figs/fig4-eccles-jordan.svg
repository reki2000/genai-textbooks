<text x="430.0" y="252.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#7b7a75" text-anchor="middle">Bの陽極 → Aの格子</text>
