<text x="117.0" y="294.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">2つの安定状態</text>
<text x="117.0" y="316.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">A入 / B切　と　A切 / B入</text>
<text x="117.0" y="332.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">中間は不安定で、どちらかへ倒れる</text>
<text x="380.0" y="400.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">セット側を一瞬押して勝敗をひっくり返せば、入力を戻しても状態が残る。これが1ビット。</text>
<text x="380.0" y="420.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">この交差帰還は、真空管からCMOS、6T SRAM、DRAMの検出増幅器まで生き残る。</text>
