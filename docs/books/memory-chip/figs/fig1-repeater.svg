<text x="380.0" y="362.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">入ってきた波形は捨てている。先へ運ばれるのは「入だったか、切だったか」という判定だけ。</text>
<text x="380.0" y="382.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">この構造が、コアの検出増幅器、DRAMの再生、NANDの誤り訂正まで繰り返し現れる。</text>
