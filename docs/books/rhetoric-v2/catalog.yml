  created: '2026-08-23T20:43:11+09:00'
  question: 事実を曲げず相手を道具にせず、それでも人が判断し行動できる言葉をどう設計するのか。
  plot: 老朽化した虹見橋をめぐり、客足を失いたくない橋詰めの店主やる夫と、迂回で利用者を待たせる送迎運転手やらない夫が衝突する。「橋を守れ」という配信が安全問題を隠す扇動として炎上し、利害の異なる二人は90秒の発言を互いの最強の反論へ何度も通し、聴衆、争点、証拠、交渉、謝罪を一つの公共判断へ結び直す。
