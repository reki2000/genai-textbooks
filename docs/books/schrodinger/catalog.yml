documents:
- id: schrodinger
  category: natural-science
  created: '2026-07-07T09:17:26+09:00'
  question: 一個の電子を、夜明けまでに狙った井戸へ八割以上の確率で移せるか。
  plot: 科学館の公開実演まで6時間。旧友やる夫とやらない夫が共同制作した電子一個の実演は、初回100回で右へ移ったのが37回。映像のせいか回路のせいか言い争う二人は、半分の電子が出ない記録と位相ダイヤルの謎から確率振幅を、素朴な方程式の候補を一つずつ潰してシュレーディンガー方程式を組み立て、測定とデコヒーレンスで自分たちの失敗を一つずつ引き受けていく。
