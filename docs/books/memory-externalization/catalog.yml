documents:
- id: memory-externalization
  category: math-information
  created: '2026-07-26T14:11:18+09:00'
  question: 頭に入らない知識を外に置くとき、半年後の自分、新しい同僚、機械が必要な場面で取り出して正しく使えるのは、どんな形か。
  plot: 12年勤めた先輩が3月31日に辞める。引き継ぎを任されたやる夫は、一度も開いていないブックマーク3,000件と、先輩の段ボールから出た「ヤマダは3月に触るな」という書いた本人も意味を忘れた付箋を抱え、値引きのルールを書いた1枚のカードを、索引と分類、カードとリンク、検索と順位付け、埋め込みとRAG、時点付きの主張、業務知識の6層へと書き直していく。決算と受注の締めが重なる最終日の午後、試験運用のAIが根拠を並べて「答えません」と返したとき、やる夫は月末の数字を前に送信ボタンから指を離す。
