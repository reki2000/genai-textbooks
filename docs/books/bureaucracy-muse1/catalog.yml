documents:
- id: bureaucracy-muse1
  category: society
  created: '2026-10-28T16:00:00+09:00'
  question: 重複も縦割りもない合理的な政府をゼロから設計できるとして、なぜそれは現実には動かせないのか。
  plot: 一人政党を旗揚げしたやる夫が霞が関を7省へ統廃合し、法律の付け替え、人員シャッフル、採用と天下りの一掃、内閣官房への一極集中と情報集約、県と市町村の整理、大都市の独立、独立委員会100個、財務省廃止による予算膨張、英国式エージェンシー化の輸入までを試すたびに、省庁が抱えていた能力、人事と財政の回路、権力への牽制の意味を思い知り、最後は年金実施庁の試験導入会議の場で、組織を止めずに変える10原則を一つずつ決着させていく。
  draft: true
  ratings:
    knowledge: 4.5
    appeal: 4.5
    structure: 4.5
    overall: 4.50
