documents:
- id: payroll-calculation
  category: society
  created: '2026-07-25T07:46:51+09:00'
  question: 昇給したのに手取りが減ったのはなぜか。給料日の送金締切を前にして、何を払い、どの一行を止め、誰へ渡すのか。
  plot: 入社2年目の給与担当やる夫は、6月、昇給したのに給与の手取りが減ったことに驚く。締切後の自分の残業、海外赴任するできる夫の端末弁償、退職者、やらない夫の兼務と、一年の例外をさばいた末に迎えた12月の給料日。銀行へのデータ送信期限の直前、シンガポールにいるできる夫の賞与だけ、源泉税が決まらない。
