- id: ultimate-detergent_v2
  category: engineering
  created: '2026-08-23T20:43:11+09:00'
  question: 汚れを落とす力と素材・人体を守る力を、限られた処方と現場条件の中でどう両立させるのか。
  plot: 町の百周年祭を翌日に控え、破裂した配管で衣装庫と屋台倉庫を汚したやる夫が、七枚の汚染布と泡だらけのシロクマ着ぐるみを手掛かりに、共同洗濯所を営むやらない夫と利害をすり合わせながら、界面・水質・酵素・漂白・皮膚・保存・容器を一つずつ検証し、万能な一液ではなく失敗を予測できる洗浄設計を作る。
