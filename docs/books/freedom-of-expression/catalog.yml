documents:
- id: freedom-of-expression
  category: thought
  created: '2026-08-03T00:00:00+00:00'
  question: 見たくない表現を消す権利はどこまであるのか。悪い表現まで守るのはなぜか。
  plot: ニュースを読むだけでせり上がる漫画広告に怒ったやる夫が、不快度を点数化する公共表現クリーナーを作る。だが点数制は告発と加害を区別できず、不快を消した世界からは戦争も公害も虐待も消えた。不快と危害、作品と広告、国家と企業、当事者と代表を一つずつ分解しながら、禁止か放置かの二択を捨て、表現の善悪を自動判定する機械を、誰が何を基準に止めたのかを見えるようにする機械へ作り替えていく。
