  question: 一台の車を安全に貸せる状態は、予約表の一行ではなく、どの状態・履歴・人・設備の連鎖で作られるのか。
  plot: 大型連休前夜、青いミニバンCAR-0427に五つの予約と三つの現在地が現れ、駅前店を営むやる夫が鍵束を握る。客との約束を守りたい店主と、三店舗の安全監査を請け負う共同整備工場のやらない夫が利害をぶつけ、返却、清掃、点検、整備、配車、契約、料金、例外、AI判定を一台の24時間へつなぎ直す。
