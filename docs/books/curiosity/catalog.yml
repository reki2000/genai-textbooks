documents:
- id: curiosity
  title: やる夫は明日には忘れる本を買うようです
  path: /books/curiosity
  category: thought
  created: '2026-07-26T03:29:16+00:00'
  question: 内容が何も残らないのに、なぜ人は次の本を買うのか。学びたいという衝動はどこから来て、その学びは誰にとって何の役に立つのか。
  plot: 先月買った3冊を1行も語れないやる夫が、知識の隙間で起動する好奇心、探索の費用、世代をまたぐ蓄積、同時発見と土壌、言葉と命題と知識の区別をたどり、学ぶことを消費から参加へ定義し直す。
