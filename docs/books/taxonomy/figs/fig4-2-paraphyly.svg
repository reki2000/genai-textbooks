<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="title"><title id="title">ワニは鳥とトカゲより近いので、鳥を抜いた爬虫類の棚は祖先の子孫の一部だけの穴あきグループになる</title><rect x="0" y="0" width="560" height="300" fill="#ffffff"/><rect x="300" y="44" width="240" height="234" rx="10" fill="#e6eefb" stroke="#1f6fd0" stroke-width="2"/><text x="530" y="266" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" font-weight="700" fill="#1f6fd0">単系統群</text><rect x="308" y="50" width="150" height="164" rx="8" fill="none" stroke="#cf3b2d" stroke-width="2.4" stroke-dasharray="6 4"/><text x="466" y="134" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#cf3b2d">爬虫類</text><text x="466" y="155" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#cf3b2d">の棚</text><line x1="230" y1="190" x2="230" y2="250" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="230" y1="190" x2="320" y2="190" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="230" y1="250" x2="320" y2="250" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="140" y1="130" x2="140" y2="220" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="140" y1="130" x2="320" y2="130" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="140" y1="220" x2="230" y2="220" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="60" y1="70" x2="60" y2="175" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="60" y1="70" x2="320" y2="70" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="60" y1="175" x2="140" y2="175" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><text x="330" y="75" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" fill="#1c1c1c">トカゲ・ヘビ</text><text x="330" y="135" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" fill="#1c1c1c">カメ</text><text x="330" y="195" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" fill="#1c1c1c">ワニ</text><text x="330" y="255" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">鳥</text><circle cx="60" cy="122.5" r="7" fill="#e07b1f" stroke="#ffffff" stroke-width="2"/><text x="52" y="108.5" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#e07b1f">共通祖先</text><rect x="24" y="15" width="4" height="19.5" fill="#e07b1f" stroke="none" stroke-width="1.2"/><text x="36" y="30" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#1c1c1c">鳥を抜くと、子孫の一部が棚の外に漏れる</text></svg>
