<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 330" role="img" aria-labelledby="title"><title id="title">DNAと化石の両方で、クジラは偶蹄類の内側に入り、カバと姉妹になる</title><rect x="0" y="0" width="580" height="330" fill="#ffffff"/><rect x="310" y="36" width="250" height="276" rx="10" fill="#e6eefb" stroke="#1f6fd0" stroke-width="2"/><text x="552" y="298" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="end" font-weight="700" fill="#1f6fd0">鯨偶蹄目</text><rect x="316" y="42" width="150" height="212" rx="8" fill="none" stroke="#cf3b2d" stroke-width="2.4" stroke-dasharray="6 4"/><text x="474" y="110" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#cf3b2d">クジラを</text><text x="474" y="130" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#cf3b2d">外した</text><text x="474" y="150" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#cf3b2d">偶蹄目</text><line x1="240" y1="230" x2="240" y2="290" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="240" y1="230" x2="320" y2="230" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="240" y1="290" x2="320" y2="290" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="170" x2="150" y2="260" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="170" x2="320" y2="170" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="260" x2="240" y2="260" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="50" y1="60" x2="50" y2="215" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="50" y1="60" x2="320" y2="60" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="50" y1="110" x2="320" y2="110" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="50" y1="215" x2="150" y2="215" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><text x="330" y="65" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" fill="#1c1c1c">ラクダ</text><text x="330" y="115" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" fill="#1c1c1c">ブタ</text><text x="330" y="175" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" fill="#1c1c1c">ウシ・シカ</text><text x="330" y="235" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">カバ</text><text x="330" y="295" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">クジラ</text><line x1="195" y1="250" x2="195" y2="270" stroke="#e07b1f" stroke-width="4" stroke-linecap="round"/><text x="195" y="290" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#e07b1f">共有する挿入</text><line x1="30" y1="175" x2="50" y2="175" stroke="#1c1c1c" stroke-width="2" stroke-linecap="round"/><line x1="38" y1="165" x2="38" y2="185" stroke="#e07b1f" stroke-width="4" stroke-linecap="round"/><text x="24" y="208" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#e07b1f">両端が滑車</text><text x="24" y="228" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#e07b1f">の距骨</text><rect x="24" y="15" width="4" height="19.5" fill="#e07b1f" stroke="none" stroke-width="1.2"/><text x="36" y="30" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#1c1c1c">外に置くと偶蹄目が穴あきになる</text></svg>
