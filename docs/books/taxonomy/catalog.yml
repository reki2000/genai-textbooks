  category: natural-science
  created: '2026-07-20T06:13:15+00:00'
  question: 何と何が「同じ生き物」なのか。姿が当てにならないとき、分類は何を証拠に線を引き、どこまで言い切ってよいのか。
  plot: 開館前夜の自然史館で漏水が標本ラベルを溶かし、壁画を請け負った犬好きの美大生やる夫は、自分にだけ聞こえる正体不明の声に導かれながら、朝9時までに名前の消えた標本を棚へ戻す。姿で並べては崩れる棚を、種の定義、学名、系統樹、最節約法、DNA、三ドメイン、水平伝播、池の水の環境DNAで組み直すうちに、空の試験管が声の正体を明かす。
