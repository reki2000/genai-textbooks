- id: entertainment-craft
  category: thought
  created: '2026-09-08T14:05:59+00:00'
  draft: true
  question: 人はなぜ笑い、なぜ泣くのか。そして「つまらない」と言われる話には、何が欠けているのか。
  plot: 3年で42本を投稿して誰にも最後まで読まれなかったやる夫が、読者がどこで画面を閉じたかの折れ線を突きつけられる。場面の値、因果のつなぎ、意外さと必然、賭け金と情報差、笑いと涙の共通の骨格、読者が手を動かす媒体まで、退屈の原因を一つずつ潰していく。最後に渡されるのは、完読率99%で読者61人という一本の作品。
