documents:
- id: tokyo-roads-v4
  category: engineering
  created: '2026-09-23T12:00:00+09:00'
  question: 東京の道を丸暗記せずに、中心・放射・環状・川・地形・時刻の重なりとして読むには、何をどの順で掴めばよいのか。
  plot: 研修最終日のタクシー新人やる夫は、ナビがあれば道など覚えなくていいと信じている。助手席の指導係やらない夫が課した決まりは二つ、客の行き先を自分の言葉で言い直すことと、ナビより先に自分の道を言うこと。朝の京葉道路で書き留めた五つの謎を、日本橋の0km、放射と国道番号、明治通りの環、川の上の首都高、谷底の渋谷、まっすぐな荒川、夕方の潮と雨の渋滞で一つずつ解き、午後は東の碁盤・北の束・西の梯子・南の櫛という形で生活の通り名を覚えながら、やる夫は「名前に飛びつく」失敗を四度くり返し、霞が関では客の8分を失う。深夜、赤坂見附で「目白まで」と言われたとき、やる夫は最初の一言を言い直し、やらない夫が決まりに込めた理由を知る。
