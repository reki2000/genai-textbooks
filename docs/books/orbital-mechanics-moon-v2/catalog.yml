  question: 月から戻った測距鏡と、限られた推進剤・不確かな位置情報のもとでどう会い、安全な最終軌道へ導くか。
  plot: 月フライバイを終えた測距実証機TSUKI-17が地球の長楕円軌道で姿勢制御を失い、最後の測距光まで36時間。追加観測を諦めたくない月面光学者やる夫と、落下域の安全を譲れない軌道タグ船設計者やらない夫が、状態ベクトル、保存量、軌道要素、位相、遷移、摂動、観測誤差、再突入回廊を一つの共同軌道案へ組む。
