  question: 100人中62人が「買いたい」と答えたとき、新商品は売れると判断してよいのか。そして同じ数字を、分野の違う相手はどう問うのか。
  plot: おもちゃ会社の企画担当やる夫が、素朴なアンケート判定の失敗から出発する。I部では標本、確率、分布、推定、検定、相関と因果、無作為割付をたどり、II部では多変量・時系列・欠測・模型選択・予測と、ベイズや因果ダイアグラムまで含む「全部入りの鞄」を組み立てて閉じる。III部では人文・社会・理工・医薬の四部署が同じ400件へ別の問いを立てる場に立ち、手法の数ではなく問い・生成・前提・出力から分析を組み直す。
