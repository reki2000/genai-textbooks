<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-labelledby="title desc"><title id="title">揺れの大きい証言を軽く、安定した証言を重くして更新する</title><desc id="desc">揺れの大きい証言を軽く、安定した証言を重くして更新する</desc><rect x="0" y="0" width="760" height="352" fill="#ffffff"/><text x="52" y="32" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700">五度を真実とせず、全部ノイズともせず、途中の像を更新する</text><text x="52" y="54" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">横棒は校正試験で分かった相対的な揺れ（数値区間ではない）</text><line x1="204.19" y1="96" x2="204.19" y2="300" stroke="#8d8d8d" stroke-width="1.4" stroke-linecap="round" opacity="1" stroke-dasharray="5 3"/><text x="150" y="114" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1c1c1c" text-anchor="end" font-weight="400">直前までの予測</text><line x1="172.31" y1="110" x2="236.06" y2="110" stroke="#8d8d8d" stroke-width="2.0" stroke-linecap="round" opacity="1"/><line x1="172.31" y1="105" x2="172.31" y2="115" stroke="#8d8d8d" stroke-width="1.6" stroke-linecap="round" opacity="1"/><line x1="236.06" y1="105" x2="236.06" y2="115" stroke="#8d8d8d" stroke-width="1.6" stroke-linecap="round" opacity="1"/><circle cx="204.19" cy="110" r="6" fill="#8d8d8d" stroke="#8d8d8d" stroke-width="1.0" opacity="1"/><text x="204.19" y="96" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#8d8d8d" text-anchor="middle" font-weight="700">0.1 度</text><text x="150" y="156" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1c1c1c" text-anchor="end" font-weight="400">第一センサー</text><line x1="398.62" y1="152" x2="640.88" y2="152" stroke="#1f6fd0" stroke-width="2.0" stroke-linecap="round" opacity="1"/><line x1="398.62" y1="147" x2="398.62" y2="157" stroke="#1f6fd0" stroke-width="1.6" stroke-linecap="round" opacity="1"/><line x1="640.88" y1="147" x2="640.88" y2="157" stroke="#1f6fd0" stroke-width="1.6" stroke-linecap="round" opacity="1"/><circle cx="519.75" cy="152" r="6" fill="#1f6fd0" stroke="#1f6fd0" stroke-width="1.0" opacity="1"/><text x="519.75" y="138" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#1f6fd0" text-anchor="middle" font-weight="700">5.0 度</text><text x="150" y="198" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1c1c1c" text-anchor="end" font-weight="400">第二センサー</text><line x1="181.88" y1="194" x2="271.12" y2="194" stroke="#1f6fd0" stroke-width="2.0" stroke-linecap="round" opacity="1"/><line x1="181.88" y1="189" x2="181.88" y2="199" stroke="#1f6fd0" stroke-width="1.6" stroke-linecap="round" opacity="1"/><line x1="271.12" y1="189" x2="271.12" y2="199" stroke="#1f6fd0" stroke-width="1.6" stroke-linecap="round" opacity="1"/><circle cx="226.5" cy="194" r="6" fill="#1f6fd0" stroke="#1f6fd0" stroke-width="1.0" opacity="1"/><text x="226.5" y="180" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#1f6fd0" text-anchor="middle" font-weight="700">0.4 度</text><text x="150" y="240" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1c1c1c" text-anchor="end" font-weight="400">手持ち計</text><line x1="210.56" y1="236" x2="255.19" y2="236" stroke="#1f6fd0" stroke-width="2.0" stroke-linecap="round" opacity="1"/><line x1="210.56" y1="231" x2="210.56" y2="241" stroke="#1f6fd0" stroke-width="1.6" stroke-linecap="round" opacity="1"/><line x1="255.19" y1="231" x2="255.19" y2="241" stroke="#1f6fd0" stroke-width="1.6" stroke-linecap="round" opacity="1"/><circle cx="232.88" cy="236" r="6" fill="#1f6fd0" stroke="#1f6fd0" stroke-width="1.0" opacity="1"/><text x="232.88" y="222" font-family="Noto Sans