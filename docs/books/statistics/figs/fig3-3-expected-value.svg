<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" role="img" aria-labelledby="title desc"><title id="title">重りの置き方が違っても、期待値という支点は同じ800円に来る</title><desc id="desc">重りの置き方が違っても、期待値という支点は同じ800円に来る</desc><rect x="0" y="0" width="760" height="356" fill="#ffffff"/><text x="60" y="32" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700">期待値800円は、一度も起こらない値。重りを支える点として決まる</text><text x="60" y="50" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">丸の面積が確率、支点が期待値</text><text x="60" y="78" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start" font-weight="700">品質部の見積もり　0円80% ／ 2,000円15% ／ 10,000円5%</text><line x1="76.0" y1="152" x2="710.0" y2="152" stroke="#1c1c1c" stroke-width="2.2" stroke-linecap="butt" opacity="1"/><circle cx="96.0" cy="126.74000000000001" r="23.26" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" opacity="1"/><text x="96.0" y="95.47999999999999" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1f6fd0" text-anchor="middle" font-weight="700">80%</text><circle cx="214.8" cy="139.93" r="10.07" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" opacity="1"/><text x="214.8" y="121.86000000000001" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1f6fd0" text-anchor="middle" font-weight="700">15%</text><circle cx="690.0" cy="144.19" r="5.81" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" opacity="1"/><text x="690.0" y="130.38" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1f6fd0" text-anchor="middle" font-weight="700">5%</text><path d="M 143.52 155 L 151.62 170.3 L 135.42 170.3 Z" fill="#e07b1f" stroke="#e07b