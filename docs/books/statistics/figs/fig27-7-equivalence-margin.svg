<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" role="img" aria-labelledby="title desc"><title id="title">有意でないことと、害の上限が十分小さいと示すことは別</title><desc id="desc">有意でないことと、害の上限が十分小さいと示すことは別</desc><rect x="0" y="0" width="760" height="336" fill="#ffffff"/><text x="52" y="32" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700">許容できる害の上限を先に置かないと、安心へ変換できない</text><text x="52" y="54" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">上の二つはどちらも「有意差なし」だが、言えることが違う</text><line x1="393.68" y1="96" x2="393.68" y2="262" stroke="#8d8d8d" stroke-width="1.6" stroke-linecap="round" opacity="1" stroke-dasharray="6 4"/><text x="393.68" y="90" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">差なし</text><line x1="490.53" y1="96" x2="490.53" y2="262" stroke="#cf3b2d" stroke-width="2.2" stroke-linecap="round" opacity="1"/><text x="498.53" y="90" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#cf3b2d" text-anchor="start" font-weight="700">許容できる害の上限（margin）</text><text x="190" y="130" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1c1c1c" text-anchor="end" font-weight="400">更新群2/100・比較群0/100</text><line x1="345.91" y1="126" x2="563.19" y2="126" stroke="#e07b1f" stroke-width="2.6" stroke-linecap="round" opacity="1"/><line x1="345.91" y1="120" x2="345.91" y2="132" stroke="#e07b1f" stroke-width="1.8" stroke-linecap="round" opacity="1"/><line x1="563.19" y1="120" x2="563.19" y2="132" stroke="#e07b1f" stroke-width="1.8" stroke-linecap="round" opacity="1"/><circle cx="442.11" cy="126" r="6.5" fill="#e07b1f" stroke="#e07b1f" stroke-width="1.0" opacity="1"/><text x="345.91" y="112" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#e07b1f" text-anchor="start" font-weight="700">上限をまたぐ＝まだ示せていない</text><text x="190" y="186" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1c1c1c" text-anchor="end" font-weight="400">追跡を増やして幅が狭まった場合</text><line x1="359.79" y1="182" x2="476.0" y2="182" stroke="#1f6fd0" stroke-width="2.6" stroke-linecap="round" opacity="1"/><line x1="359.79" y1="176" x2="359.79" y2="188" stroke="#1f6fd0" stroke-width="1.8" stroke-linecap="round" opacity="1"/><line x1="476.0" y1="176" x2="476.0" y2="188" stroke="#1f6fd0" stroke-width="1.8" stroke-linecap="round" opacity="1"/><circle cx="417.89" cy="182" r="6.5" fill="#1f6fd0" stroke="#1f6fd0" stroke-width="1.0" opacity="1"/><text x="359.79" y="168" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#1f6fd0" text-anchor="start" font-weight="700">上限未満を示せた</text><text x="190" y="242" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1c1c1c" text-anchor="end" font-weight="400">害が実際に大きかった場合</text><line x1="468.74" y1="238" x2="609.16" y2="238" stroke="#cf3b2d" stroke-width="2.6" stroke-linecap="round" opacity="1"/><line x1="468.74" y1="232" x2="468.74" y2="244" stroke="#cf3b2d" stroke-width="1.8" stroke-linecap="round" opacity="1"/><line x1="609.16" y1="232" x2="609.16" y2="244" stroke="#cf3b2d" stroke-width="1.8" stroke-linecap="round" opacity="1"/><circle cx="538.95" cy="238" r="6.5" fill="#cf3b2d" stroke="#cf3b2d" stroke-width="1.0" opacity="1"/><text x="468.74" y="224" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#cf3b2d" text-anchor="start" font-weight="700">害が増えている</text><line x1="190" y1="262" x2="672" y2="262" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><line x1="272.63" y1="262" x2="272.63" y2="267" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="272.63" y="280" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">−5</text><line x1="393.68" y1="262" x2="393.68" y2="267" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="393.68" y="280" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">0</text><line x1="514.74" y1="262" x2="514.74" y2="267" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="514.74" y="280" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">+5</text><line x1="635.79" y1="262" x2="635.79" y2="267" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="635.79" y="280" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">+10</text><text x="440" y="294" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">害の増加（ポイント、右ほど悪い）</text><text x="52" y="326" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400">margin は結果を見た後でなく、設計のときに置く</text></svg>
