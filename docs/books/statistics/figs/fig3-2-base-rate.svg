<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-labelledby="title"><title id="title">故障率1%の工場では警報のうち故障は15%、故障率50%の修理工場では95%</title><defs><pattern id="hcf3b2d" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#cf3b2d" stroke-width="1.2"/></pattern></defs><rect x="0" y="0" width="620" height="330" fill="#ffffff"/><text x="24" y="42" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">故障率 1% の場所</text><text x="170" y="80" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="end" fill="#6b6b6b">入口</text><rect x="180" y="60" width="4" height="28" fill="#1f6fd0" stroke="none" stroke-width="1.2"/><rect x="184" y="60" width="396" height="28" fill="#f2f2f2" stroke="#8d8d8d" stroke-width="1.2"/><text x="170" y="120" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="end" font-weight="700" fill="#1c1c1c">警報箱</text><rect x="180" y="100" width="61.5" height="32" fill="#1f6fd0" stroke="none" stroke-width="1.2"/><rect x="241.5" y="100" width="338.5" height="32" fill="url(#hcf3b2d)" stroke="#cf3b2d" stroke-width="1.2"/><text x="249.5" y="122" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1f6fd0">故障 15%</text><text x="428" y="122" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">正常品の誤警報</text><text x="428" y="122" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#cf3b2d">正常品の誤警報</text><text x="24" y="182" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">故障率 50% の場所</text><text x="170" y="220" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="end" fill="#6b6b6b">入口</text><rect x="180" y="200" width="200" height="28" fill="#1f6fd0" stroke="none" stroke-width="1.2"/><rect x="380" y="200" width="200" height="28" fill="#f2f2f2" stroke="#8d8d8d" stroke-width="1.2"/><text x="170" y="260" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="end" font-weight="700" fill="#1c1c1c">警報箱</text><rect x="180" y="240" width="378.9" height="32" fill="#1f6fd0" stroke="none" stroke-width="1.2"/><rect x="558.9" y="240" width="21.1" height="32" fill="url(#hcf3b2d)" stroke="#cf3b2d" stroke-width="1.2"/><text x="369.5" y="262" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#ffffff">故障 95%</text><text x="580" y="318" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="13" text-anchor="end" fill="#6b6b6b">青：故障品　灰：正常品　斜線：正常品への誤警報</text></svg>
