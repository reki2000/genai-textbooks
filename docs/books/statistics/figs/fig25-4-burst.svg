<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" role="img" aria-labelledby="title desc"><title id="title">合計400件・平均4%が同じでも、時間の形はまったく違う</title><desc id="desc">合計400件・平均4%が同じでも、時間の形はまったく違う</desc><rect x="0" y="0" width="760" height="348" fill="#ffffff"/><text x="52" y="32" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700">年平均の雨量で堤防を設計すると、集中豪雨の山が消える</text><text x="52" y="54" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">どちらも一日で400件、10,000台に対して率4%</text><text x="52" y="110" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start" font-weight="700">全期間へならした形</text><text x="52" y="126" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">一時間あたり約17件</text><rect x="141.0" y="162.90740740740742" width="18" height="5.0925925925925934" rx="0" fill="#f2f2f2" stroke="#8d8d8d" stroke-width="1.2" opacity="1"/><rect x="164.48" y="162.90740740740742" width="18" height="5.0925925925925934" rx="0" fill="#f2f2f2" stroke="#8d8d8d" stroke-width="1.2" opacity="1"/><rect x="187.96" y="162.90740740740742" width="18" height="5.0925925925925934" rx="0" fill="#f2f2f2" stroke="#8d8d8d" stroke-width="1.2" opacity="1"/><rect x="211.43" y="162.90740740740742" width="18" height="5.0925925925925934" rx="0" fill="#f2f2f2" stroke="#8d8d8d" stroke-width="1.2" opacity="1"/><rect x="234.91" y="162.90740740740742" width="18" height="5.0925925925925934" rx="0" fill="#f2f2f2" stroke="#8d8d8d" stroke-width="1.2" opacity="1"/><rect x="258.39" y="162.90740740740742" width="18" height="5.0925925925925934" rx="0" fill="#f2f2f2" stroke="#8d8d8d" stroke-width="1.2" opacity="1"/><rect x="281.87" y="162.90740740740742" width="18"