<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">座標を伸ばした分だけ密度を薄めないと、確率が6倍に増える</title><desc id="desc">座標を伸ばした分だけ密度を薄めないと、確率が6倍に増える</desc><defs><marker id="ahf1c1c1c9_0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9.0" markerHeight="9.0" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1c1c1c"/></marker></defs><rect x="0" y="0" width="760" height="330" fill="#ffffff"/><text x="52" y="32" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700">ゴム方眼の一マスが何倍になったかが、掛けるべき領収書</text><text x="52" y="54" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400">U = 2X, V = 3Y</text><rect x="150" y="202" width="56" height="56" rx="0" fill="#ffffff" stroke="#1c1c1c" stroke-width="1.8" opacity="1"/><rect x="150" y="202" width="28.0" height="56" rx="0" fill="#e6eefb" stroke="none" stroke-width="0" opacity="1"/><line x1="164.0" y1="202" x2="164.0" y2="258" stroke="#8d8d8d" stroke-width="0.9" stroke-linecap="round" opacity="1"/><line x1="150" y1="244.0" x2="206" y2="244.0" stroke="#8d8d8d" stroke-width="0.9" stroke-linecap="round" opacity="1"/><line x1="178.0" y1="202" x2="178.0" y2="258" stroke="#8d8d8d" stroke-width="0.9" stroke-linecap="round" opacity="1"/><line x1="150" y1="230.0" x2="206" y2="230.0" stroke="#8d8d8d" stroke-width="0.9" stroke-linecap="round" opacity="1"/><line x1="192.0" y1="202" x2="192.0" y2="258" stroke="#8d8d8d" stroke-width="0.9" stroke-linecap="round" opacity="1"/><line x1="150" y1="216.0" x2="206" y2="216.0" stroke="#8d8d8d" stroke-width="0.9" stroke-linecap="round" opacity="1"/><rect x="150" y="244.0" width="14.0" height="14.0" rx="0" fill="#f6e6b8" stroke="#e07b1f" stroke-width="2.0" opacity="1"/><text x="150" y="280" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start" font-weight="700">もとの正方形</text><text x="150" y="298" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">面積1・密度1・総量1</text><text x="164.0" y="192" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#1f6fd0" text-anchor="middle" font-weight="700">左半分 1/2</text><rect x="430" y="90" width="112" height="168" rx="0" fill="#ffffff" stroke="#1c1c1c" stroke-width="1.8" opacity="1"/><rect x="430" y="90" width="56.0" height="168" rx="0" fill="#e6eefb" stroke="none" stroke-width="0" opacity="1"/><line x1="458.0" y1="90" x2="458.0" y2="258" stroke="#8d8d8d" stroke-width="0.9" stroke-linecap="round" opacity="1"/><line x1="430" y1="216.0" x2="542" y2="216.0" stroke="#8d8d8d" stroke-width="0.9" stroke-linecap="round" opacity="1"/><line x1="486.0" y1="90" x2="486.0" y2="258" stroke="#8d8d8d" stroke-width="0.9" stroke-linecap="round" opacity="1"/><line x1="430" y1="174.0" x2="542" y2="174.0" stroke="#8d8d8d" stroke-width="0.9" stroke-linecap="round" opacity="1"/><line x1="514.0" y1="90" x2="514.0" y2="258" stroke="#8d8d8d" stroke-width="0.9" stroke-linecap="round" opacity="1"/><line x1="430" y1="132.0" x2="542" y2="132.0" stroke="#8d8d8d" stroke-width="0.9" stroke-linecap="round" opacity="1"/><rect x="430" y="216.0" width="28.0" height="42.0" rx="0" fill="#f6e6b8" stroke="#e07b1f" stroke-width="2.0" opacity="1"/><text x="430" y="280" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start" font-weight="700">変換後の長方形</text><text x="430" y="298" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">面積6・密度1/6・総量1</text><text x="458.0" y="80" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#1f6fd0" text-anchor="middle" font-weight="700">左半分 1/2</text><line x1="236" y1="226" x2="406" y2="226" stroke="#1c1c1c" stroke-width="2.0" stroke-linecap="round" marker-end="url(#ahf1c1c1c9_0)"/><text x="321" y="218" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1c1c1c" text-anchor="middle" font-weight="700">横2倍・縦3倍</text><text x="321" y="244" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#e07b1f" text-anchor="middle" font-weight="700">一マスの面積が6倍</text><text x="52" y="322" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#cf3b2d" text-anchor="start" font-weight="700">密度1のまま塗ると総量が 2×3×1 ＝ 6 になる（確率にならない）</text></svg>
