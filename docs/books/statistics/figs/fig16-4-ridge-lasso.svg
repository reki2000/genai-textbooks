" text-anchor="middle" font-weight="400">b2</text><text x="52" y="340" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400">lambda=1 の一例。解が一意でも、片方だけ動かす観測は増えていない</text></svg>
