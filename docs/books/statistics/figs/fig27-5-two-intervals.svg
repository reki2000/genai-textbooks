<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-labelledby="title desc"><title id="title">同じ推定値でも幅が違うだけで、片方だけが有意になる</title><desc id="desc">同じ推定値でも幅が違うだけで、片方だけが有意になる</desc><rect x="0" y="0" width="760" height="352" fill="#ffffff"/><text x="52" y="32" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700">「片方だけ有意」は「二つが有意に違う」ではない</text><text x="52" y="54" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">推定した効果はどちらも −6 ポイント。違うのは標本数だけ</text><line x1="520.0" y1="96" x2="520.0" y2="286" stroke="#8d8d8d" stroke-width="1.8" stroke-linecap="round" opacity="1" stroke-dasharray="6 4"/><text x="520.0" y="90" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">効果なし（0）</text><text x="190" y="132" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="end" font-weight="400">大都市</text><line x1="309.84" y1="128" x2="490.16" y2="128" stroke="#1f6fd0" stroke-width="2.6" stroke-linecap="round" opacity="1"/><line x1="309.84" y1="122" x2="309.84" y2="134" stroke="#1f6fd0" stroke-width="1.8" stroke-linecap="round" opacity="1"/><line x1="490.16" y1="122" x2="490.16" y2="134" stroke="#1f6fd0" stroke-width="1.8" stroke-linecap="round" opacity="1"/><circle cx="400.0" cy="128" r="6.5" fill="#1f6fd0" stroke="#1f6fd0" stroke-width="1.0" opacity="1"/><text x="500.16" y="132" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1f6fd0" text-anchor="start" font-weight="700">有意</text><text x="190" y="188" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="end" font-weight="400">小地域</text><line x1="215.76" y1="184" x2="584.24" y2="184" stroke="#8d8d8d" stroke-width="2.6" stroke-linecap="round" opacity="1"/><line x1="215.76" y1="178" x2="215.76" y2="190" stroke="#8d8d8d" stroke-width="1.8" stroke-linecap="round" opacity="1"/><line x1="584.24" y1="178" x2="584.24" y2="190" stroke="#8d8d8d" stroke-width="1.8" stroke-linecap="round" opacity="1"/><circle cx="400.0" cy="184" r="6.5" fill="#8d8d8d" stroke="#8d8d8d" stroke-width="1.0" opacity="1"/><text x="594.24" y="188" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#8d8d8d" text-anchor="start" font-weight="700">有意でない</text><text x="190" y="254" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#e07b1f" text-anchor="end" font-weight="700">二つの差</text><line x1="314.88" y1="250" x2="725.12" y2="250" stroke="#e07b1f" stroke-width="2.6" stroke-linecap="round" opacity="1"/><line x1="314.88" y1="244" x2="314.88" y2="256" stroke="#e07b1f" stroke-width="1.8" stroke-linecap="round" opacity="1"/><line x1="725.12" y1="244" x2="725.12" y2="256" stroke="#e07b1f" stroke-width="1.8" stroke-linecap="round" opacity="1"/><circle cx="520.0" cy="250" r="6.5" fill="#e07b1f" stroke="#e07b1f" stroke-width="1.0" opacity="1"/><text x="735.12" y="254" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#e07b1f" text-anchor="start" font-weight="700">0 を含む</text><line x1="190" y1="286" x2="692" y2="286" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><line x1="220.0" y1="286" x2="220.0" y2="291" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="220.0" y="304" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">−15</text><line x1="320.0" y1="286" x2="320.0" y2="291" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="320.0" y="304" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">−10</text><line x1="420.0" y1="286" x2="420.0" y2="291" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="420.0" y="304" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">−5</text><line x1="520.0" y1="286" x2="520.0" y2="291" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="520.0" y="304" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">0</text><line x1="620.0" y1="286" x2="620.0" y2="291" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="620.0" y="304" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">+5</text><text x="440" y="316" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">返品率の変化（ポイント）</text><text x="52" y="344" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400">比べるべきは二本のハードルの越え方でなく、二人の距離の差</text></svg>
