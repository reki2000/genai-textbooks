<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" role="img" aria-labelledby="title"><title id="title">会員10%・希望率70%と一般90%・希望率30%を人口比で重み付けすると、市場全体は34%</title><rect x="0" y="0" width="460" height="400" fill="#ffffff"/><rect x="70" y="93.8" width="36" height="236.2" fill="#f6e6b8" stroke="#e07b1f" stroke-width="2"/><rect x="106" y="228.8" width="324" height="101.2" fill="#e6eefb" stroke="#1f6fd0" stroke-width="2"/><line x1="70" y1="215.2" x2="430" y2="215.2" stroke="#1f6fd0" stroke-width="3" stroke-dasharray="8 5" stroke-linecap="round"/><text x="426" y="205.2" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="end" font-weight="700" fill="#1f6fd0">市場全体 34%</text><text x="268" y="279.4" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" fill="#1c1c1c">一般家庭 30%</text><text x="70" y="83.8" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#1c1c1c">会員 70%</text><text x="62" y="335" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" fill="#6b6b6b">0%</text><text x="62" y="200" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" fill="#6b6b6b">40%</text><text x="62" y="65" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" fill="#6b6b6b">80%</text><line x1="70" y1="330" x2="430" y2="330" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><text x="88" y="352" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">10%</text><text x="268" y="352" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">90%</text><text x="250" y="382" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">幅：人口に占める割合　高さ：購入希望率</text><rect x="126" y="104.8" width="4" height="42.8" fill="#e07b1f" stroke="none" stroke-width="1.2"/><text x="138" y="120.8" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">会員を1万人集めても</text><text x="138" y="142.8" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">左の細い柱が精密になるだけ</text></svg>
