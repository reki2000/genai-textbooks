<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="title desc"><title id="title">残差の大きさと、傾きを回す力は別の診断</title><desc id="desc">残差の大きさと、傾きを回す力は別の診断</desc><rect x="0" y="0" width="760" height="320" fill="#ffffff"/><text x="52" y="32" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700">線から遠い点と、線に近いのに傾きを回す点を分けて探す</text><text x="52" y="52" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">破線＝もとの5点だけで引いた線　／　実線＝一点を足した後の線</text><text x="72" y="76" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start" font-weight="700">線から遠い点（3, 8）</text><rect x="76" y="84" width="300" height="172" rx="0" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.0" opacity="1"/><line x1="96.0" y1="240.29" x2="368.0" y2="88.0" stroke="#1f6fd0" stroke-width="1.8" stroke-linecap="round" opacity="1" stroke-dasharray="6 4"/><line x1="96.0" y1="232.48" x2="368.0" y2="80.19" stroke="#e07b1f" stroke-width="2.4" stroke-linecap="round" opacity="1"/><circle cx="116.92" cy="228.57" r="5.5" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" opacity="1"/><circle cx="137.85" cy="216.86" r="5.5" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" opacity="1"/><circle cx="158.77" cy="205.14" r="5.5" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" opacity="1"/><circle cx="179.69" cy="193.43" r="5.5" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" opacity="1"/><circle cx="200.62" cy="181.71" r="5.5" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" opacity="1"/><line x1="158.77" y1="158.29" x2="158.77" y2="197.33" stroke="#e07b1f" stroke-width="1.4" stroke-linecap="round" opacity="1" stroke-dasharray="3 3"/><circle cx="158.77" cy="158.29" r="7" fill="#e07b1f" stroke="#e07b1f" stroke-width="1.8" opacity="1"/><text x="222" y="274" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1c1c1c" text-anchor="middle" font-weight="400">足した点の残差 3.33　傾き 1.00</text><text x="222" y="296" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#e07b1f" text-anchor="middle" font-weight="700">傾きは 1 のまま動かない</text><text x="404" y="76" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start" font-weight="700">端にある点（12, 9）</text><rect x="408" y="84" width="300" height="172" rx="0" fill="#ffffff" stroke="#8d8d8d" stroke-width="1.0" opacity="1"/><line x1="428.0" y1="240.29" x2="700.0" y2="88.0" stroke="#1f6fd0" stroke-width="1.8" stroke-linecap="round" opacity="1" stroke-dasharray="6 4"/><line x1="428.0" y1="227.69" x2="700.0" y2="134.35" stroke="#e07b1f" stroke-width="2.4" stroke-linecap="round" opacity="1"/><circle cx="448.92" cy="228.57" r="5.5" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" opacity="1"/><circle cx="469.85" cy="216.86" r="5.5" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" opacity="1"/><circle cx="490.77" cy="205.14" r="5.5" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" opacity="1"/><circle cx="511.69" cy="193.43" r="5.5" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" opacity="1"/><circle cx="532.62" cy="181.71" r="5.5" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" opacity="1"/><line x1="679.08" y1="146.57" x2="679.08" y2="141.53" stroke="#e07b1f" stroke-width="1.4" stroke-linecap="round" opacity="1" stroke-dasharray="3 3"/><circle cx="679.08" cy="146.57" r="7" fill="#e07b1f" stroke="#e07b1f" stroke-width="1.8" opacity="1"/><text x="554" y="274" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1c1c1c" text-anchor="middle" font-weight="400">足した点の残差 -0.43　傾き 0.61</text><text x="554" y="296" font-family="Noto Sans CJK JP,