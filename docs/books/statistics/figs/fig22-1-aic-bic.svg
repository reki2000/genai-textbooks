<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" role="img" aria-labelledby="title desc"><title id="title">適合の改善へ部品代を足すと、二模型の順位が入れ替わる</title><desc id="desc">適合の改善へ部品代を足すと、二模型の順位が入れ替わる</desc><rect x="0" y="0" width="760" height="348" fill="#ffffff"/><text x="52" y="32" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700">尤度だけなら大模型。部品代を足すと小模型が勝つ</text><text x="52" y="54" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">線が左下にあるほど良い。傾きの絶対値が罰の重さ</text><path d="M 455 292 L 180 138.15" fill="none" stroke="#1f6fd0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 4"/><text x="188.0" y="130.15" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1f6fd0" text-anchor="start" font-weight="700">等AIC線（罰 2k）</text><path d="M 526.64 292 L 180 207.78" fill="none" stroke="#e07b1f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 4"/><text x="188.0" y="199.78" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#e07b1f" text-anchor="start" font-weight="700">等BIC線（n=100、罰 4.61k）</text><circle cx="400.0" cy="261.23" r="8" fill="#1f6fd0" stroke="#1f6fd0" stroke-width="1.0" opacity="1"/><text x="414.0" y="283.23" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1f6fd0" text-anchor="start" font-weight="700">小模型 k=2</text><circle cx="262.5" cy="138.15" r="8" fill="#cf3b2d" stroke="#cf3b2d" stroke-width="1.0" opacity="1"/><text x="276.5" y="122.15" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#cf3b2d" text-anchor="start" font-weight="700">大模型 k=10</text><text x="414.0" y="299.23" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">AIC 104 ／ BIC 109.2</text><text x="276.5" y="140.15" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">AIC 110 ／ BIC 136.1</text><line x1="170" y1="292" x2="632" y2="292" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><line x1="262.5" y1="292" x2="262.5" y2="297" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="262.5" y="310" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">90</text><line x1="400.0" y1="292" x2="400.0" y2="297" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="400.0" y="310" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">100</text><line x1="537.5" y1="292" x2="537.5" y2="297" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="537.5" y="310" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">110</text><text x="400" y="336" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">−2 log L（小さいほど当てはまりが良い）</text><line x1="180" y1="292" x2="180" y2="92" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><line x1="175" y1="292.0" x2="180" y2="292.0" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="171" y="296.0" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="end" font-weight="400">0</text><line x1="175" y1="215.08" x2="180" y2="215.08" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="171" y="219.08" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="end" font-weight="400">5</text><line x1="175" y1="138.15" x2="180" y2="138.15" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="171" y="142.15" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="end" font-weight="400">10</text><text x="140" y="84" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">部品数 k</text></svg>
