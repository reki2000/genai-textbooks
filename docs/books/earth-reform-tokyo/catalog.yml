documents:
- id: earth-reform-tokyo
  category: natural-science
  draft: true
  created: '2026-08-30T08:38:20+09:00'
  question: 陸3海7の地球を陸7海3へ作り直そうとすると、どの欄で物理法則に止められるのか。
  plot: 家賃相場に負けたやる夫が「東京が狭いのが悪い」と結論し、不動産屋の窓口で地球改造申込書を書かされる。海面を下げる、海底を持ち上げる、大陸をぶつける、山を削る、海岸を直線に引く──どの案も材料と行き先の欄で詰まり、そのたびに陸高海深曲線の二峰性、アイソスタシー、和達―ベニオフ帯、磁気縞、スラブプル、隆起と侵食のつり合い、堆積空間へ手を伸ばすことになる。最後に残るのは、広げることではなく、広げた形を固定できないという問題だった。
