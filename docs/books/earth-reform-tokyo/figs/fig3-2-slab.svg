nt-size="15" text-anchor="start" fill="#6b6b6b">海洋側</text><text x="740" y="50" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="end" fill="#6b6b6b">陸側</text><circle cx="157.5" cy="88.5" r="7" fill="#e07b1f" stroke="#ffffff" stroke-width="2"/><circle cx="252.5" cy="112.2" r="7" fill="#e07b1f" stroke="#ffffff" stroke-width="2"/><circle cx="347.5" cy="150.2" r="7" fill="#e07b1f" stroke="#ffffff" stroke-width="2"/><circle cx="490" cy="221.5" r="7" fill="#e07b1f" stroke="#ffffff" stroke-width="2"/><circle cx="680" cy="345" r="7" fill="#e07b1f" stroke="#ffffff" stroke-width="2"/><text x="169.5" y="78.5" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#e07b1f">震源</text><text x="224" y="145.5" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">浅い所は 14°</text><text x="556.5" y="335.5" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">深い所は 33°</text><text x="53" y="114.4" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">冷たい板</text><text x="53" y="114.4" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#1f6fd0">冷たい板</text><text x="433" y="202.5" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">温まるのは両面 13 km</text><text x="433" y="202.5" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#1f6fd0">温まるのは両面 13 km</text><line x1="24" y1="250" x2="36" y2="250" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><text x="42" y="255" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" fill="#6b6b6b">深さ 200 km</text><line x1="24" y1="345" x2="36" y2="345" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><text x="42" y="350" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" fill="#6b6b6b">深さ 300 km</text><text x="24" y="460" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" fill="#6b6b6b">縦横同じ縮尺</text><rect x="440" y="94" width="4" height="42.8" fill="#e07b1f" stroke="none" stroke-width="1.2"/><text x="452" y="110" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">深い地震は、冷たいまま</text><text x="452" y="132" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">刺さった板の中で起きる</text></svg>
