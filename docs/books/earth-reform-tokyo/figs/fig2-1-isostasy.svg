<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" role="img" aria-labelledby="title"><title id="title">同じ深さで上の重さが等しいとき、厚く軽い大陸の柱は薄く重い海の柱より4.45 km高い</title><defs><pattern id="h8d8d8d" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#8d8d8d" stroke-width="1.2"/></pattern></defs><rect x="0" y="0" width="520" height="560" fill="#ffffff"/><rect x="40" y="60" width="120" height="420" fill="#f6e6b8" stroke="#1c1c1c" stroke-width="1.2"/><text x="100" y="264" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" fill="#1c1c1c">大陸地殻</text><text x="100" y="285" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" fill="#1c1c1c">2.8</text><text x="100" y="306" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" fill="#1c1c1c">35 km</text><rect x="220" y="60" width="120" height="53.5" fill="#ffffff" stroke="#1c1c1c" stroke-width="1.2" stroke-dasharray="5 4"/><rect x="220" y="113.5" width="120" height="84" fill="url(#h8d8d8d)" stroke="#1c1c1c" stroke-width="1.2"/><rect x="220" y="197.5" width="120" height="282.5" fill="#f2f2f2" stroke="#1c1c1c" stroke-width="1.2"/><text x="280" y="161.5" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">海洋地殻 2.9</text><text x="280" y="161.5" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" fill="#1c1c1c">海洋地殻 2.9</text><text x="280" y="344.7" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" fill="#1c1c1c">マントル</text><text x="280" y="365.7" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" fill="#1c1c1c">3.3</text><line x1="24" y1="480" x2="496" y2="480" stroke="#1f6fd0" stroke-width="2.4" stroke-dasharray="7 5" stroke-linecap="round"/><text x="260" y="506" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#1f6fd0">基準面：上に載る重さが等しい</text><text x="100" y="532" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" fill="#1c1c1c">2.8×35 = 98</text><text x="280" y="532" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" fill="#1c1c1c">2.9×7 + 3.3×23.55 = 98</text><line x1="350" y1="60" x2="350" y2="113.5" stroke="#e07b1f" stroke-width="3" stroke-linecap="round"/><line x1="344" y1="60" x2="356" y2="60" stroke="#e07b1f" stroke-width="3" stroke-linecap="round"/><line x1="344" y1="113.5" x2="356" y2="113.5" stroke="#e07b1f" stroke-width="3" stroke-linecap="round"/><text x="362" y="92.7" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="18" text-anchor="start" font-weight="700" fill="#e07b1f">H</text><line x1="24" y1="60" x2="220" y2="60" stroke="#8d8d8d" stroke-width="1.2" stroke-dasharray="3 3" stroke-linecap="round"/><rect x="366" y="134" width="4" height="64.8" fill="#e07b1f" stroke="none" stroke-width="1.2"/><text x="378" y="150" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">H = 4.45 km</text><text x="378" y="172" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">水を入れない</text><text x="378" y="194" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">計算</text></svg>
