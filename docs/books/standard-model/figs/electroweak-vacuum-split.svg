<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">真空が4方向を「重い3本＋光子1本」に分ける</title>
<desc id="desc">SU(2)×U(1) の生成子のうち、真空を動かさない Q=T³+Y/2 だけが残る</desc>
<defs><marker id="arw-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="arw-e34948" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker><marker id="arw-1baf7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="430.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">真空が4方向を「重い3本＋光子1本」に分ける</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">SU(2)×U(1) の生成子のうち、真空を動かさない Q=T³+Y/2 だけが残る</text>
<rect x="25.0" y="88.0" width="160.0" height="74.0" rx="8" fill="#ffffff" stroke="#4a3aa7" stroke-width="1.6"/>
<text x="105.0" y="123.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">SU(2) × U(1)</text>
<text x="105.0" y="140.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">生成子は4方向</text>
<line x1="194.0" y1="125.0" x2="254.0" y2="125.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw-52514e)"/>
<rect x="265.0" y="82.0" width="214.0" height="86.0" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/>
<text x="372.0" y="123.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">〈φ〉 = (0, v)/√2</text>
<text x="372.0" y="140.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">真空に作用させる</text>
<line x1="490.0" y1="125.0" x2="550.0" y2="125.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw-52514e)"/>
<rect x="560.0" y="88.0" width="175.0" height="74.0" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
<text x="647.5" y="123.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">動かす？</text>
<text x="647.5" y="140.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">T〈φ〉 = 0 か</text>
<path d="M648 172 C648 205 505 202 505 238" fill="none" stroke="#e34948" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw-e34948)"/>
<path d="M648 172 C648 210 666 211 666 238" fill="none" stroke="#1baf7a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw-1baf7a)"/>
<text x="496.0" y="218.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#e34948" text-anchor="middle">動かす：3方向</text>
<text x="666.0" y="218.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#1baf7a" text-anchor="middle">動かさない：1方向</text>
<rect x="255.0" y="242.0" width="250.0" height="92.0" rx="8" fill="#ffffff" stroke="#e34948" stroke-width="1.6"/>
<text x="380.0" y="286.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">T¹, T², T³−Y/2 側</text>
<text x="380.0" y="303.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">対称性が破れ、3自由度を食う</text>
<rect x="548.0" y="242.0" width="187.0" height="92.0" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/>
<text x="641.5" y="286.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Q = T³ + Y/2</text>
<text x="641.5" y="303.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">真空を不変に保つ</text>
<line x1="380.0" y1="343.0" x2="380.0" y2="376.0" stroke="#e34948" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw-e34948)"/>
<line x1="642.0" y1="343.0" x2="642.0" y2="376.0" stroke="#1baf7a" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw-1baf7a)"/>
<rect x="255.0" y="377.0" width="250.0" height="40.0" rx="8" fill="#ffffff" stroke="#e34948" stroke-width="1.6"/>
<text x="380.0" y="401.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">W+・W−・Z：質量あり</text>
<rect x="548.0" y="377.0" width="187.0" height="40.0" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/>
<text x="641.5" y="401.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">光子 A：質量ゼロ</text>
<text x="25.0" y="268.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="18" font-weight="700" fill="#0b0b0b" text-anchor="start">4 → 3 + 1</text>
<text x="25.0" y="296.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">破れた方向だけが</text>
<text x="25.0" y="314.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">ゴールドストーンを受け取り</text>
<text x="25.0" y="332.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">縦偏極を増やす</text>
</svg>
