<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">局所位相変換：壊れる微分を接続で直す</title>
<desc id="desc">同じ余計な項が、ゲージ場 Aμ の変換から逆符号で現れて相殺する</desc>
<defs><marker id="arw-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="390.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">局所位相変換：壊れる微分を接続で直す</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">同じ余計な項が、ゲージ場 Aμ の変換から逆符号で現れて相殺する</text>
<text x="190.0" y="88.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#e34948" text-anchor="middle">素の微分 ∂μ</text>
<rect x="35.0" y="112.0" width="145.0" height="64.0" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
<text x="107.5" y="142.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">φ</text>
<text x="107.5" y="159.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">局所位相変換</text>
<line x1="190.0" y1="144.0" x2="246.0" y2="144.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw-52514e)"/>
<rect x="256.0" y="105.0" width="210.0" height="78.0" rx="8" fill="#ffffff" stroke="#e34948" stroke-width="1.6"/>
<text x="361.0" y="142.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">e^(iα)(∂μφ + i(∂μα)φ)</text>
<text x="361.0" y="159.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">余計な項が混ざる</text>
<text x="480.0" y="149.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#e34948" text-anchor="start">× 同じ顔で変換しない</text>
<line x1="25.0" y1="205.0" x2="735.0" y2="205.0" stroke="#dcdedd" stroke-width="1.2" stroke-linecap="round"/>
<text x="190.0" y="240.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="middle">共変微分 Dμ = ∂μ − ieAμ</text>
<rect x="35.0" y="266.0" width="145.0" height="68.0" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
<text x="107.5" y="298.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Dμφ</text>
<text x="107.5" y="315.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">局所位相変換</text>
<line x1="190.0" y1="300.0" x2="246.0" y2="300.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw-52514e)"/>
<rect x="256.0" y="253.0" width="250.0" height="94.0" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/>
<text x="381.0" y="298.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">e^(iα) Dμφ</text>
<text x="381.0" y="315.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">余計な項は残らない</text>
<text x="520.0" y="278.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#eb6834" text-anchor="start">+ i(∂μα)φ</text>
<text x="520.0" y="302.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#2a78d6" text-anchor="start">− i(∂μα)φ</text>
<line x1="515.0" y1="309.0" x2="635.0" y2="309.0" stroke="#52514e" stroke-width="1" stroke-linecap="round"/>
<text x="646.0" y="303.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#1baf7a" text-anchor="start">= 0</text>
<text x="520.0" y="331.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">Aμ の補正が打ち消す</text>
<text x="25.0" y="374.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">結論：場所ごとの位相基準を許すと、比較の換算規則 Aμ（接続）が必要になる。</text>
</svg>
