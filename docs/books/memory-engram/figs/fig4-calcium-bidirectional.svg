<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">図4　同じカルシウムが、濃度だけで逆を向く</title>
<desc id="desc">低い濃度ではカルシニューリンだけが動き、高い濃度で CaMKII が加わる</desc>
