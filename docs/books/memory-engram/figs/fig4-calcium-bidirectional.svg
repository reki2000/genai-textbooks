<text x="402.0" y="372.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="start">→ リン酸を付ける → AMPA受容体を追加 → EPSP 100 → 170</text>
<text x="380.0" y="414.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">判定装置は要らない。動き出す濃度をずらした部品を二つ置くだけで、向きが分かれる。</text>
