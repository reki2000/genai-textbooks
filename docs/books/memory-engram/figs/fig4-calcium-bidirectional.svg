<text x="38.0" y="372.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="start">→ リン酸を外す → AMPA受容体を回収 → EPSP 100 → 60</text>
