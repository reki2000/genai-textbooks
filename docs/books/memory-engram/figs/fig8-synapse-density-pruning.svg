<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">図8　シナプス密度のピークは、何も知らない生後8か月</title>
<desc id="desc">ヒト一次視覚野の目安（成人＝100）。そこから3〜4割を削って成人の値に落ち着く</desc>
<defs><marker id="arw-eb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="430.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図8　シナプス密度のピークは、何も知らない生後8か月</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">ヒト一次視覚野の目安（成人＝100）。そこから3〜4割を削って成人の値に落ち着く</text>
<line x1="138.0" y1="310.0" x2="706.0" y2="310.0" stroke="#dcdedd" stroke-width="1" stroke-linecap="round"/>
<text x="130.0" y="314.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#7b7a75" text-anchor="end">50</text>
<line x1="138.0" y1="240.0" x2="706.0" y2="240.0" stroke="#dcdedd" stroke-width="1" stroke-linecap="round"/>
<text x="130.0" y="244.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#7b7a75" text-anchor="end">100</text>
<line x1="138.0" y1="170.0" x2="706.0" y2="170.0" stroke="#dcdedd" stroke-width="1" stroke-linecap="round"/>
<text x="130.0" y="174.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#7b7a75" text-anchor="end">150</text>
<line x1="138.0" y1="240.0" x2="706.0" y2="240.0" stroke="#7b7a75" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="52.0" y="116.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#52514e" text-anchor="start">シナプス密度</text>
<path d="M150.0,296.0 L285.0,156.0 L420.0,198.0 L555.0,226.0 L690.0,240.0" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="150.0" cy="296.0" r="6.0" fill="#ffffff" stroke="#2a78d6" stroke-width="2.6"/>
<text x="150.0" y="282.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#2a78d6" text-anchor="middle">60</text>
<text x="150.0" y="346.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">出生時</text>
<circle cx="285.0" cy="156.0" r="6.0" fill="#ffffff" stroke="#2a78d6" stroke-width="2.6"/>
<text x="285.0" y="142.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#2a78d6" text-anchor="middle">160</text>
<text x="285.0" y="346.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">生後8か月</text>
<circle cx="420.0" cy="198.0" r="6.0" fill="#ffffff" stroke="#2a78d6" stroke-width="2.6"/>
<text x="420.0" y="184.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#2a78d6" text-anchor="middle">130</text>
<text x="420.0" y="346.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">4歳</text>
<circle cx="555.0" cy="226.0" r="6.0" fill="#ffffff" stroke="#2a78d6" stroke-width="2.6"/>
<text x="555.0" y="212.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#2a78d6" text-anchor="middle">110</text>
<text x="555.0" y="346.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">11歳</text>
<circle cx="690.0" cy="240.0" r="6.0" fill="#ffffff" stroke="#2a78d6" stroke-width="2.6"/>
<text x="690.0" y="226.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#2a78d6" text-anchor="middle">100</text>
<text x="690.0" y="346.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">成人</text>
<line x1="138.0" y1="324.0" x2="706.0" y2="324.0" stroke="#7b7a75" stroke-width="1.4" stroke-linecap="round"/>
<text x="285.0" y="124.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#eb6834" text-anchor="middle">ピーク：成人の1.6倍</text>
<line x1="295.0" y1="156.0" x2="632.0" y2="156.0" stroke="#eb6834" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="632.0" y1="160.0" x2="632.0" y2="236.0" stroke="#eb6834" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arw-eb6834)"/>
<text x="632.0" y="144.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#eb6834" text-anchor="end">ここから3〜4割を削る（刈り込み）</text>
<text x="138.0" y="372.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#7b7a75" text-anchor="start">横軸は等間隔で、年齢の実尺ではない。ピークの時期は場所による（前頭前野はもっと遅い）。</text>
<text x="380.0" y="402.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">知ることが増えていく時期に、シナプスの数は減っている。育つことは、減ることでもある。</text>
</svg>
