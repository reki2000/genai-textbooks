<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">固定化の終わった記憶も、想起でいったんほどけ、固め直しにタンパク質合成が要る</text>
