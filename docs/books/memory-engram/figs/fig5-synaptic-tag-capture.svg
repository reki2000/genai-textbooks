<path d="M400,227 L422,233 L400,239 Z" fill="#1baf7a" stroke="#1baf7a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="428.0" y="246.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#1baf7a" text-anchor="start">タグ</text>
<text x="474.0" y="246.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#eb6834" text-anchor="start">初期LTP＋タグ</text>
<path d="M132,266.1 L212,336 L300,336" fill="none" stroke="#7b7a75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="300.0" y="318.0" width="84.0" height="36.0" rx="7" fill="#ffffff" stroke="#7b7a75" stroke-width="1.8"/>
<text x="342.0" y="340.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#7b7a75" text-anchor="middle">線C</text>
<text x="212.0" y="324.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#7b7a75" text-anchor="start">刺激なし</text>
<circle cx="228.0" cy="350.0" r="4.0" fill="#4a3aa7" stroke="none" stroke-width="1" opacity="0.75"/>
<circle cx="256.0" cy="350.0" r="4.0" fill="#4a3aa7" stroke="none" stroke-width="1" opacity="0.75"/>
<circle cx="284.0" cy="350.0" r="4.0" fill="#4a3aa7" stroke="none" stroke-width="1" opacity="0.75"/>
<text x="400.0" y="338.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#7b7a75" text-anchor="start">タグなし</text>
<text x="474.0" y="338.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#7b7a75" text-anchor="start">素通り</text>
<text x="276.0" y="106.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#4a3aa7" text-anchor="middle">強い刺激が核を動かし、タンパク質は細胞じゅうへ配られる（●）</text>
<text x="654.0" y="132.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">6時間後の EPSP</text>
<text x="654.0" y="150.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#e34948" text-anchor="middle">破線＝刺激前の 100</text>
<line x1="580.0" y1="316.5" x2="736.0" y2="316.5" stroke="#e34948" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/>
<rect x="588.0" y="228.8" width="34.0" height="101.2" rx="4" fill="#2a78d6" stroke="#2a78d6" stroke-width="1" opacity="0.75"/>
<text x="605.0" y="220.8" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#2a78d6" text-anchor="middle">165</text>
<text x="605.0" y="350.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10" font-weight="400" fill="#52514e" text-anchor="middle">線A</text>
<rect x="638.0" y="249.0" width="34.0" height="81.0" rx="4" fill="#eb6834" stroke="#eb6834" stroke-width="1" opacity="0.75"/>
<text x="655.0" y="241.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#eb6834" text-anchor="middle">150</text>
<text x="655.0" y="350.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10" font-weight="400" fill="#52514e" text-anchor="middle">線B</text>
<rect x="688.0" y="316.5" width="34.0" height="13.5" rx="4" fill="#7b7a75" stroke="#7b7a75" stroke-width="1" opacity="0.75"/>
<text x="705.0" y="308.5" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#7b7a75" text-anchor="middle">100</text>
<text x="705.0" y="350.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10" font-weight="400" fill="#52514e" text-anchor="middle">線B</text>
<text x="705.0" y="363.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10" font-weight="400" fill="#52514e" text-anchor="middle">対照</text>
<line x1="580.0" y1="330.0" x2="736.0" y2="330.0" stroke="#7b7a75" stroke-width="1.2" stroke-linecap="round"/>
<text x="380.0" y="392.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">線Bは同じ弱い刺激しか受けていない。隣の線Aが強かったかどうかで、6時間後が 150 と 100 に分かれる。</text>
<text x="380.0" y="414.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">旗の寿命は1〜2時間ほど。時間が空きすぎると捕まえられない。</text>
</svg>
