<path d="M400,135 L422,141 L400,147 Z" fill="#1baf7a" stroke="#1baf7a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="428.0" y="154.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#1baf7a" text-anchor="start">タグ</text>
<text x="474.0" y="154.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#2a78d6" text-anchor="start">後期LTP</text>
<path d="M132,244.0 L212,244 L300,244" fill="none" stroke="#7b7a75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="300.0" y="226.0" width="84.0" height="36.0" rx="7" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/>
<text x="342.0" y="248.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#eb6834" text-anchor="middle">線B</text>
<text x="212.0" y="232.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#eb6834" text-anchor="start">弱いテタヌス1回</text>
<circle cx="228.0" cy="258.0" r="4.0" fill="#4a3aa7" stroke="none" stroke-width="1" opacity="0.75"/>
