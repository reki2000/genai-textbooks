<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">図5　宛先は荷物ではなく、受け取る側の旗で決まる</title>
<desc id="desc">強い刺激が作ったタンパク質は全体へ配られ、弱く叩かれてタグの立った線Bだけが捕獲する</desc>

<rect x="0.0" y="0.0" width="760.0" height="430.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図5　宛先は荷物ではなく、受け取る側の旗で決まる</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">強い刺激が作ったタンパク質は全体へ配られ、弱く叩かれてタグの立った線Bだけが捕獲する</text>
<circle cx="96.0" cy="244.0" r="40.0" fill="#ffffff" stroke="#7b7a75" stroke-width="1.8"/>
<circle cx="96.0" cy="244.0" r="19.0" fill="#4a3aa7" stroke="#4a3aa7" stroke-width="1.5" opacity="0.22"/>
<text x="96.0" y="248.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#4a3aa7" text-anchor="middle">核</text>
<text x="96.0" y="304.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#4a3aa7" text-anchor="middle">転写・翻訳</text>
<path d="M132,221.9 L212,152 L300,152" fill="none" stroke="#7b7a75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="300.0" y="134.0" width="84.0" height="36.0" rx="7" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/>
<text x="342.0" y="156.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="middle">線A</text>
<text x="212.0" y="140.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#2a78d6" text-anchor="start">強いテタヌス3回</text>
<circle cx="228.0" cy="166.0" r="4.0" fill="#4a3aa7" stroke="none" stroke-width="1" opacity="0.75"/>
<circle cx="256.0" cy="166.0" r="4.0" fill="#4a3aa7" stroke="none" stroke-width="1" opacity="0.75"/>
<circle cx="284.0" cy="166.0" r="4.0" fill="#4a3aa7" stroke="none" stroke-width="1" opacity="0.75"/>
