<title id="title">図3　NMDA受容体は、二つの鍵が同時に回ったときだけ開く</title>
<desc id="desc">グルタミン酸だけでも脱分極だけでも Ca²⁺ は入らない。両方そろった入力だけが選ばれる</desc>
