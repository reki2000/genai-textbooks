<text x="380.0" y="398.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">細胞内の Ca²⁺ 濃度は外の約1万分の1。少し入るだけで跳ね上がり、電気の話が化学の話に切り替わる。</text>
