<circle cx="540.0" cy="156.0" r="8.0" fill="#eb6834" stroke="#eb6834" stroke-width="1.4" opacity="0.25"/>
<circle cx="568.0" cy="150.0" r="8.0" fill="#eb6834" stroke="#eb6834" stroke-width="1.4" opacity="0.25"/>
