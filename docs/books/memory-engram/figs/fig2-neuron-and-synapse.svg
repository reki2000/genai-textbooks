<text x="38.0" y="338.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">1個が持つシナプス：平均で数千個</text>
