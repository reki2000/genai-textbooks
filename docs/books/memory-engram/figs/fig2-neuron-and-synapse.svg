<text x="596.0" y="284.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#2a78d6" text-anchor="middle">受け手に並ぶ受容体</text>
<text x="596.0" y="308.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="middle">この数と効きが「重み」</text>
<text x="596.0" y="330.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">増やせば増強、減らせば抑圧</text>
<text x="380.0" y="382.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">大人の脳で配線を新設していたら、映画をその日のうちに覚えて帰ることはできない。</text>
<text x="380.0" y="406.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">速いのは工事ではなく、既にある接点の効きを変えること。これをシナプス可塑性という。</text>
