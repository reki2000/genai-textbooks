<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">図1　H.M. が失ったのは、宣言的記憶の「新しい分」だけ</title>
<desc id="desc">同じ手術で、古い宣言的記憶と手続き記憶は残った。失われた範囲は時期と種類で決まる</desc>

<rect x="0.0" y="0.0" width="760.0" height="430.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図1　H.M. が失ったのは、宣言的記憶の「新しい分」だけ</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">同じ手術で、古い宣言的記憶と手続き記憶は残った。失われた範囲は時期と種類で決まる</text>
<text x="24.0" y="118.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">宣言的記憶</text>
<text x="24.0" y="136.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">言葉で言える</text>
<rect x="122.0" y="125.0" width="136.0" height="90.0" rx="4" fill="#2a78d6" stroke="#2a78d6" stroke-width="1" opacity="0.3"/>
<text x="190.0" y="116.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#2a78d6" text-anchor="middle">保たれる</text>
<rect x="266.0" y="170.0" width="102.0" height="45.0" rx="4" fill="#2a78d6" stroke="#2a78d6" stroke-width="1" opacity="0.3"/>
<text x="317.0" y="161.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#2a78d6" text-anchor="middle">あいまい</text>
<rect x="376.0" y="207.0" width="90.0" height="8.0" rx="4" fill="#e34948" stroke="#e34948" stroke-width="1" opacity="0.45"/>
<text x="421.0" y="198.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#e34948" text-anchor="middle">ほぼ失われる</text>
<rect x="474.0" y="115.0" width="238.0" height="100.0" rx="4" fill="#e34948" stroke="#e34948" stroke-width="1.6" opacity="0.1" stroke-dasharray="5 4"/>
<text x="593.0" y="150.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#e34948" text-anchor="middle">新しくは作れない</text>
<text x="593.0" y="170.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#e34948" text-anchor="middle">前向性健忘</text>
<line x1="118.0" y1="215.0" x2="716.0" y2="215.0" stroke="#7b7a75" stroke-width="1.4" stroke-linecap="round"/>
<text x="24.0" y="268.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">手続き記憶</text>
<text x="24.0" y="286.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10" font-weight="400" fill="#52514e" text-anchor="start">体が覚える</text>
<rect x="118.0" y="250.0" width="598.0" height="50.0" rx="8" fill="#1baf7a" stroke="#1baf7a" stroke-width="1.6" opacity="0.16"/>
<text x="300.0" y="282.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">手術の前後を通じて保たれる</text>
<rect x="524.0" y="234.0" width="192.0" height="82.0" rx="6" fill="#ffffff" stroke="#e2e4e3" stroke-width="1"/>
<text x="620.0" y="250.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">手術後の鏡映描写：はみ出し回数</text>
<rect x="552.0" y="268.0" width="26.0" height="24.0" rx="3" fill="#1baf7a" stroke="#1baf7a" stroke-width="1" opacity="0.85"/>
<text x="565.0" y="264.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10" font-weight="700" fill="#1baf7a" text-anchor="middle">30</text>
<text x="565.0" y="307.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">1日目</text>
<rect x="598.0" y="276.0" width="26.0" height="16.0" rx="3" fill="#1baf7a" stroke="#1baf7a" stroke-width="1" opacity="0.85"/>
<text x="611.0" y="272.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10" font-weight="700" fill="#1baf7a" text-anchor="middle">20</text>
<text x="611.0" y="307.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">2日目</text>
<rect x="644.0" y="284.0" width="26.0" height="8.0" rx="3" fill="#1baf7a" stroke="#1baf7a" stroke-width="1" opacity="0.85"/>
<text x="657.0" y="280.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10" font-weight="700" fill="#1baf7a" text-anchor="middle">10</text>
<text x="657.0" y="307.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="middle">3日目</text>
<line x1="470.0" y1="96.0" x2="470.0" y2="322.0" stroke="#0b0b0b" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="470.0" y="88.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">手術（両側の海馬を含む切除）</text>
<line x1="118.0" y1="336.0" x2="716.0" y2="336.0" stroke="#7b7a75" stroke-width="1.2" stroke-linecap="round"/>
<text x="190.0" y="353.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">10年以上前</text>
<text x="317.0" y="353.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">数年前</text>
<text x="421.0" y="353.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">手術の直前</text>
<text x="593.0" y="353.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">手術より後</text>
<text x="24.0" y="353.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#7b7a75" text-anchor="start">出来事の時期</text>
<text x="380.0" y="390.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">海馬は倉庫ではない。倉庫なら、古い記憶も手続き記憶も一緒に消えていたはずだ。</text>
<text x="380.0" y="412.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">本人は3日目にも「こんなことをするのは初めてだ」と言った。</text>
</svg>
