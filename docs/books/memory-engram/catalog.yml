documents:
- id: memory-engram
  category: natural-science
  created: '2026-08-07T13:20:11+00:00'
  question: 記憶は分子と細胞のレベルで何が変わることなのか。種類によって仕組みは違うのか。生化学的に操作・増強することはできるのか。
  plot: トータルリコールを観たやる夫が、記憶を買おうと怪しい記憶研究所に押しかける。所長のやらない夫のもと、シナプス可塑性、一致検出、転写と局所翻訳、エングラムの標識と光操作、睡眠中の再生と再固定化、発達期の刈り込みをたどり、9マス脳を8回書き換えながら、記憶を強くするとは何をすることなのかへ行き着く。
