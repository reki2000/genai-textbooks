<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">図1　冷凍機は熱を消さず、仕事を足して外へ運ぶ</title>
<desc id="desc">倉庫から 92 kW を吸収し、電力 38 kW を加えるため、屋外側の放熱は 130 kW になる</desc>
<defs><marker id="arw-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arw-eb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="arw-1baf7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="350.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図1　冷凍機は熱を消さず、仕事を足して外へ運ぶ</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">倉庫から 92 kW を吸収し、電力 38 kW を加えるため、屋外側の放熱は 130 kW になる</text>
<rect x="34.0" y="116.0" width="170.0" height="92.0" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
<text x="119.0" y="160.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">冷凍倉庫 −20℃</text>
<text x="119.0" y="177.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">吸収される熱 92 kW</text>
<rect x="292.0" y="100.0" width="176.0" height="124.0" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/>
<text x="380.0" y="160.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">冷凍機</text>
<text x="380.0" y="177.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">熱を低温側→高温側へ</text>
<rect x="556.0" y="116.0" width="170.0" height="92.0" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/>
<text x="641.0" y="160.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">屋外側 35℃</text>
<text x="641.0" y="177.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">放熱 130 kW</text>
<line x1="208.0" y1="162.0" x2="284.0" y2="162.0" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" marker-end="url(#arw-2a78d6)"/>
<text x="246.0" y="149.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#2a78d6" text-anchor="middle">Q_C</text>
<line x1="472.0" y1="162.0" x2="548.0" y2="162.0" stroke="#eb6834" stroke-width="3" stroke-linecap="round" marker-end="url(#arw-eb6834)"/>
<text x="510.0" y="149.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#eb6834" text-anchor="middle">Q_H</text>
<rect x="306.0" y="258.0" width="148.0" height="50.0" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/>
<text x="380.0" y="281.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">電力 38 kW</text>
<text x="380.0" y="298.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">仕事 W</text>
<line x1="380.0" y1="252.0" x2="380.0" y2="230.0" stroke="#1baf7a" stroke-width="3" stroke-linecap="round" marker-end="url(#arw-1baf7a)"/>
<text x="380.0" y="81.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="middle">92 + 38 = 130 kW</text>
<text x="380.0" y="332.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">屋外側の熱風には、倉庫から運んだ熱と圧縮機へ入れた電力の両方が含まれる</text>
</svg>
