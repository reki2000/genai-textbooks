<line x1="84.0" y1="142.0" x2="708.0" y2="142.0" stroke="#dcdedd" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="74.0" y="146.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#7b7a75" text-anchor="end">100℃</text>
