<line x1="526.0" y1="90.0" x2="526.0" y2="136.0" stroke="#eb6834" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arw-eb6834)"/>
<text x="380.0" y="394.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">水平でもエネルギー入力は継続：温度計では見えない分を、融けた／蒸発した質量が記録する</text>
