<text x="618.5" y="268.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#7b7a75" text-anchor="middle">運転時間は1個の約6倍</text>
