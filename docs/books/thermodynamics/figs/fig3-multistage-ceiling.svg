<title id="title">図3　段を細かくしても、上がる高さは天井へ張りつく</title>
<desc id="desc">中間温度槽 0個で22段、1個で27段、3個で29段、7個で30段。1個で+5段だから増やすほど伸びる、という予想から離れていく</desc>

