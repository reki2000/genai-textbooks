<text x="380.0" y="418.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">別方式の熱電素子は4段相当。第1法則が禁じるのははるか上なのに、実測は30段あたりで止まる。</text>
<text x="380.0" y="440.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">止まる理由を、この時点の会計帳（エネルギーの列だけ）では書けない。</text>
