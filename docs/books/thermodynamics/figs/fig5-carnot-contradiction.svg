<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" role="img" aria-labelledby="title desc">
<title id="title">図5　可逆機関より高効率な機関があると仮定すると、低温源だけで動く機関になる</title>
<desc id="desc">仮の数値。高効率機関 X は Q_H=100 から W=40 を出し、可逆機関 R の逆運転は W=30 で Q_H=100 を戻す</desc>
<defs><marker id="arw-eb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="arw-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arw-0b0b0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/></marker><marker id="arw-e34948" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="476.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図5　可逆機関より高効率な機関があると仮定すると、低温源だけで動く機関になる</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">仮の数値。高効率機関 X は Q_H=100 から W=40 を出し、可逆機関 R の逆運転は W=30 で Q_H=100 を戻す</text>
<rect x="24.0" y="76.0" width="226.0" height="336.0" rx="9" fill="#ffffff" stroke="#e2e4e3" stroke-width="1"/>
<text x="137.0" y="100.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">(1) 仮定：可逆機関より高効率な X</text>
<rect x="40.0" y="116.0" width="194.0" height="30.0" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1.4" opacity="0.18"/>
<text x="137.0" y="136.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">高温側 T_H</text>
<rect x="40.0" y="344.0" width="194.0" height="30.0" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4" opacity="0.18"/>
<text x="137.0" y="364.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">低温側 T_C</text>
<rect x="91.0" y="214.0" width="92.0" height="74.0" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/>
<text x="137.0" y="255.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">X</text>
<rect x="267.0" y="76.0" width="226.0" height="336.0" rx="9" fill="#ffffff" stroke="#e2e4e3" stroke-width="1"/>
<text x="380.0" y="100.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">(2) 可逆機関 R を逆運転</text>
<rect x="283.0" y="116.0" width="194.0" height="30.0" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1.4" opacity="0.18"/>
<text x="380.0" y="136.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">高温側 T_H</text>
<rect x="283.0" y="344.0" width="194.0" height="30.0" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4" opacity="0.18"/>
<text x="380.0" y="364.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">低温側 T_C</text>
<rect x="334.0" y="214.0" width="92.0" height="74.0" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
<text x="380.0" y="255.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">R 逆転</text>
<rect x="510.0" y="76.0" width="226.0" height="336.0" rx="9" fill="#ffffff" stroke="#e2e4e3" stroke-width="1"/>
<text x="623.0" y="100.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">(3) 2台を1台として外から見る</text>
<rect x="526.0" y="116.0" width="194.0" height="30.0" rx="6" fill="#eb6834" stroke="#eb6834" stroke-width="1.4" opacity="0.18"/>
<text x="623.0" y="136.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">高温側 T_H</text>
<rect x="526.0" y="344.0" width="194.0" height="30.0" rx="6" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4" opacity="0.18"/>
<text x="623.0" y="364.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">低温側 T_C</text>
<rect x="577.0" y="214.0" width="92.0" height="74.0" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/>
<text x="623.0" y="255.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">X + R</text>
<line x1="111.0" y1="148.0" x2="111.0" y2="210.0" stroke="#eb6834" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arw-eb6834)"/>
<text x="103.0" y="182.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#eb6834" text-anchor="end">Q_H = 100</text>
<line x1="111.0" y1="292.0" x2="111.0" y2="340.0" stroke="#2a78d6" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arw-2a78d6)"/>
<text x="103.0" y="320.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#2a78d6" text-anchor="end">Q_C = 60</text>
<line x1="185.0" y1="251.0" x2="241.0" y2="251.0" stroke="#0b0b0b" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arw-0b0b0b)"/>
<text x="213.0" y="240.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">W = 40</text>
<line x1="354.0" y1="210.0" x2="354.0" y2="148.0" stroke="#eb6834" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arw-eb6834)"/>
<text x="346.0" y="182.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#eb6834" text-anchor="end">Q_H = 100</text>
<line x1="354.0" y1="340.0" x2="354.0" y2="292.0" stroke="#2a78d6" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arw-2a78d6)"/>
<text x="346.0" y="320.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#2a78d6" text-anchor="end">Q_C = 70</text>
<line x1="492.0" y1="251.0" x2="440.0" y2="251.0" stroke="#0b0b0b" stroke-width="2.6" stroke-linecap="round" marker-end="url(#arw-0b0b0b)"/>
<text x="456.0" y="240.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">W = 30</text>
<line x1="597.0" y1="152.0" x2="597.0" y2="208.0" stroke="#7b7a75" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="589.0" y="176.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#7b7a75" text-anchor="end">100 − 100</text>
<text x="589.0" y="192.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#7b7a75" text-anchor="end">= 0</text>
<line x1="597.0" y1="340.0" x2="597.0" y2="292.0" stroke="#e34948" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arw-e34948)"/>
<text x="589.0" y="314.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#e34948" text-anchor="end">70 − 60</text>
<text x="589.0" y="330.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#e34948" text-anchor="end">= 10</text>
<line x1="671.0" y1="251.0" x2="727.0" y2="251.0" stroke="#e34948" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arw-e34948)"/>
<text x="699.0" y="240.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#e34948" text-anchor="middle">W = 10</text>
<text x="623.0" y="396.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">高温側は元通り、低温側だけが減る</text>
<text x="380.0" y="440.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#e34948" text-anchor="middle">一つの熱源から熱を奪い、ほかに変化を残さず全部を仕事にする機関ができてしまう。</text>
<text x="380.0" y="462.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">これが認められないなら、「可逆機関より高効率」という最初の仮定が誤り。作動流体にはよらない。</text>
</svg>
