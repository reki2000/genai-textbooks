<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
<title id="title">図3　膨張だけでは機関にならない ── 元へ戻る経路が正味仕事を決める</title>
<desc id="desc">P–V 図では膨張の下の面積から圧縮の下の面積を引いた、閉路の内側が一周の正味仕事</desc>
<defs><marker id="arw-eb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="arw-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arw-1baf7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="420.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図3　膨張だけでは機関にならない ── 元へ戻る経路が正味仕事を決める</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">P–V 図では膨張の下の面積から圧縮の下の面積を引いた、閉路の内側が一周の正味仕事</text>
<line x1="96.0" y1="90.0" x2="96.0" y2="326.0" stroke="#7b7a75" stroke-width="1.5" stroke-linecap="round"/>
<line x1="96.0" y1="326.0" x2="678.0" y2="326.0" stroke="#7b7a75" stroke-width="1.5" stroke-linecap="round"/>
<text x="45.0" y="92.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start">圧力 P</text>
<text x="387.0" y="362.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">体積 V →</text>
<path d="M170,136 C300,106 490,126 610,190 C500,248 316,270 170,226 Z" fill="#eb6834" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.16"/>
<path d="M170,136 C300,106 490,126 610,190" fill="none" stroke="#eb6834" stroke-width="3" stroke-linecap="round" marker-end="url(#arw-eb6834)"/>
<path d="M610,190 C500,248 316,270 170,226" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" marker-end="url(#arw-2a78d6)"/>
<line x1="170.0" y1="226.0" x2="170.0" y2="142.0" stroke="#1baf7a" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arw-1baf7a)"/>
<circle cx="170.0" cy="136.0" r="5.0" fill="#ffffff" stroke="#1baf7a" stroke-width="2"/>
<text x="356.0" y="119.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#eb6834" text-anchor="middle">膨張：気体が仕事を出す</text>
<text x="380.0" y="274.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#2a78d6" text-anchor="middle">圧縮：外から仕事を戻す</text>
<text x="390.0" y="196.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">囲んだ面積</text>
<text x="390.0" y="217.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="400" fill="#0b0b0b" text-anchor="middle">＝ W_net</text>
<text x="170.0" y="120.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#1baf7a" text-anchor="middle">同じ状態へ戻る</text>
<text x="380.0" y="388.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">一周すれば ΔU=0 なので Q_net=W_net。冷却・凝縮は、安い圧縮経路を作って閉路を成立させる。</text>
</svg>
