<line x1="173.1" y1="339.6" x2="173.1" y2="176.1" stroke="#e34948" stroke-width="2.8" stroke-linecap="round" marker-end="url(#arw-e34948)"/>
<circle cx="173.1" cy="176.1" r="4.5" fill="#e34948" stroke="none" stroke-width="1"/>
<text x="196.0" y="140.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#e34948" text-anchor="start">−3℃で融け始めるのは約40 MPa</text>
<text x="196.0" y="158.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#e34948" text-anchor="start">加圧すると、氷ではなく液体が有利になる</text>
<text x="183.1" y="331.6" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#7b7a75" text-anchor="start">常圧 0.1 MPa</text>
<rect x="470.0" y="118.0" width="262.0" height="222.0" rx="9" fill="#ffffff" stroke="#e2e4e3" stroke-width="1"/>
