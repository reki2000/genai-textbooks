<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 462" role="img" aria-labelledby="title desc">
<title id="title">図7　水の融解線は左へ傾く ── 加圧は氷を融かす向き</title>
<desc id="desc">0℃付近で dP/dT ≈ −13.5 MPa/K。−3℃の水を圧力だけで凍らせようとしても、向きが逆で桁も違う</desc>
