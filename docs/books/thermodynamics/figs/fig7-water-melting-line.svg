<text x="263.0" y="382.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">温度 →</text>
<text x="140.0" y="300.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="17" font-weight="700" fill="#2a78d6" text-anchor="middle">氷</text>
<text x="368.0" y="262.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">液体（水）</text>
<line x1="244.0" y1="208.0" x2="224.0" y2="214.0" stroke="#52514e" stroke-width="1.2" stroke-linecap="round"/>
