<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">0℃付近で dP/dT ≈ −13.5 MPa/K。−3℃の水を圧力だけで凍らせようとしても、向きが逆で桁も違う</text>
