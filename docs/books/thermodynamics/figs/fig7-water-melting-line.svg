<line x1="500.0" y1="152.0" x2="500.0" y2="300.0" stroke="#7b7a75" stroke-width="1.3" stroke-linecap="round"/>
<line x1="500.0" y1="300.0" x2="706.0" y2="300.0" stroke="#7b7a75" stroke-width="1.3" stroke-linecap="round"/>
<path d="M516,292 L690,166" fill="none" stroke="#0b0b0b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="542.0" y="188.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#52514e" text-anchor="middle">固体</text>
<text x="666.0" y="274.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#52514e" text-anchor="middle">液体</text>
<text x="601.0" y="322.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">ΔV &gt; 0 なので dP/dT &gt; 0。加圧で固体側が有利。</text>
<text x="380.0" y="406.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">氷は液体より体積が大きく ΔV &lt; 0。だから水の融解線だけが左へ傾き、加圧は融点を下げる。</text>
<text x="380.0" y="428.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle">1 K 動かすのに約13.5 MPa。減圧して凍らせても、潜熱 334 kJ/kg を捨てる先は消えない。</text>
</svg>
