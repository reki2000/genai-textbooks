- id: thermodynamics
  category: natural-science
  created: '2026-08-04T19:21:00+09:00'
  question: 冷凍機が捨てている130kWの排熱で発電すれば、氷を作る電気はまかなえるのか。
  plot: 夏の製氷工場を手伝うやる夫が、冷凍機の屋外側に出る130kWの排熱で発電する「無限氷業株式会社」を思いつき、できる夫に完成前から宣伝されて夏祭りという期限を背負う。ワッシャーを棚へ上げる「仕事の階段」と、融けた質量で熱を量る「氷の秤」だけを頼りに、第1法則、取り逃した重り、カルノー効率3.1%という天井、エントロピー、相転移、エクセルギーへと降りていく。永久機関は撤回するが、工場のどこで仕事を取り逃しているかを数える手を手に入れる。
