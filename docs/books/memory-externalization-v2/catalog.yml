  question: 覚えきれない知識を外へ置いたとき、未来の自分・同僚・機械が必要な瞬間に正しく使える形とは何か。
  plot: 引退した観測員の知識が途切れた市民天文台で、公開観望会を共同主催する移動プラネタリウムの科学解説者やる夫と、望遠鏡を守る共同工房の技術者やらない夫が、写真1万枚と「赤い星を追うな」とだけ書かれたカードに立ち尽くす。彗星が昇る時刻までに、検索、索引、手順、出典、版、例外、技能、責任を組み合わせ、人と機械が動ける外部記憶へ作り直す。
