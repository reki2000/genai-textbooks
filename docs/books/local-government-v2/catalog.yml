- id: local-government-v2
  category: society
  draft: true
  created: '2026-08-23T20:43:11+09:00'
  question: 九つの行政区を持つ政令指定都市で、市長の公約を権限・財源・議会・住民の検算可能な予算へどう変えるか。
  plot: 当選初日、市長印を押せば100億円を動かせると思ったやる夫に、対立会派の市議やらない夫が「百灯の予算回路」を公開討論へ持ち込む。児童相談所、道路、学校、区役所、防災の責任が県・市・区をまたぎ、税・交付税・国庫支出金・地方債で灯る条件が違う中、二人は三つの公約を議会と住民が再計算できる段階案へ作り直す。
