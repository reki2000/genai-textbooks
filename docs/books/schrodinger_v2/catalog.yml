  question: 一個の電子を二つの量子井戸のあいだで、夜明けまでに狙った側へ80%以上の確率で移せるか。
  plot: 学生時代の旧友やる夫とやらない夫が共同制作した量子実演は、初回リハーサルで右移動37%に終わる。映像を作ったやる夫も制御回路を作ったやらない夫も相手の仕事を原因だと言い張るが、七本のスペクトル線と点滅する電荷センサーは両方の素朴モデルを裏切る。二人は失敗を共同で引き受け、確率振幅、演算子、固有状態、時間発展、トンネル効果を80%超の反復可能な手順へ組み上げる。
