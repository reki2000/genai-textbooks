<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc">
<title id="title">点と辺が同じでも、面の有無で穴は変わる</title>
<desc id="desc">1次元骨格だけでは「輪」と「埋まった面」を区別できない</desc>
<defs><marker id="arw-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="340.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">点と辺が同じでも、面の有無で穴は変わる</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">1次元骨格だけでは「輪」と「埋まった面」を区別できない</text>
<text x="190.0" y="84.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">グラフ（1次元骨格）</text>
<path d="M 190,105 L 118,230 L 262,230 Z" fill="#ffffff" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="190.0" cy="105.0" r="12.0" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="190.0" y="109.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">1</text>
<circle cx="118.0" cy="230.0" r="12.0" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="118.0" y="234.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">2</text>
<circle cx="262.0" cy="230.0" r="12.0" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="262.0" y="234.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">3</text>
<text x="190.0" y="267.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">辺の閉路はある</text>
<text x="190.0" y="292.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#e34948" text-anchor="middle">面がない → H₁ ≅ F₂</text>
<line x1="345.0" y1="168.0" x2="415.0" y2="168.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arw-52514e)"/>
<text x="380.0" y="148.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">2単体 [1,2,3]</text>
<text x="570.0" y="84.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">単体複体（面を追加）</text>
<path d="M 570,105 L 498,230 L 642,230 Z" fill="#dff3ea" stroke="#1baf7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="570.0" cy="105.0" r="12.0" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="570.0" y="109.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">1</text>
<circle cx="498.0" cy="230.0" r="12.0" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="498.0" y="234.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">2</text>
<circle cx="642.0" cy="230.0" r="12.0" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="642.0" y="234.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#0b0b0b" text-anchor="middle">3</text>
<text x="570.0" y="267.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="middle">同じ閉路が面の境界になる</text>
<text x="570.0" y="292.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#1baf7a" text-anchor="middle">面で埋まる → H₁ = 0</text>
</svg>
