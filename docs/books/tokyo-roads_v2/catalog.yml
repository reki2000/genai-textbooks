- id: tokyo-roads_v2
  category: engineering
  created: '2026-08-23T20:43:11+09:00'
  question: 東京の道路を固有名詞の暗記でなく、中心・放射・環状・川・地形・鉄道・時間の重なりとしてどう読めるか。
  plot: 日の出までに東京七地点の音を生中継する競争で、背の高い放送車を走らせる配信者やる夫と、自転車で走るメッセンジャーやらない夫が別々の「最短」に失敗する。七回の時報を合図に、日本橋の原点、街道の指、環状の輪、川と坂、首都高、鉄道、渋滞と規制を重ね、最後は車と自転車の音声をリレーして塞がれた東京をつなぐ。
