documents:
- id: fluid-mechanics
  title: やる夫で学ぶ流体力学 ── 水と空気の法則を再発見する
  category: natural-science
  created: '2026-08-01T05:41:33+09:00'
  question: 水や空気の複雑な運動を、質量・運動量・エネルギーの保存と粘性からどう記述し、装置の挙動へ結びつけるのか。
  plot: 科学館の噴水、水車、風洞、人工竜巻、超音速ノズルを任されたやる夫が、連続体、静水圧、連続の式、ベルヌーイの式、ナビエ–ストークス方程式、境界層、乱流、圧縮性流れを実験と失敗から再発見する。
