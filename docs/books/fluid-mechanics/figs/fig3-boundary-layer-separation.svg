<text x="198.0" y="110.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">順圧力勾配：付着</text>
<line x1="53.0" y1="308.0" x2="343.0" y2="308.0" stroke="#0b0b0b" stroke-width="3" stroke-linecap="round"/>
<text x="56.0" y="337.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="start">壁：u = 0</text>
