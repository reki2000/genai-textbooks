<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">図2　ポンプ水頭18.0 mの行き先</title>
<desc id="desc">実測値で会計すると、速度へ残るのは2.5 mだけ：出口速度は14.7 m/sではなく7.0 m/s</desc>
<defs><marker id="arw-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="390.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図2　ポンプ水頭18.0 mの行き先</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">実測値で会計すると、速度へ残るのは2.5 mだけ：出口速度は14.7 m/sではなく7.0 m/s</text>
<rect x="70.0" y="130.0" width="241.1" height="70.0" rx="0" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2" opacity="0.78"/>
<text x="190.6" y="160.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">7.0 m</text>
<text x="190.6" y="182.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">静水頭</text>
<rect x="311.1" y="130.0" width="186.0" height="70.0" rx="0" fill="#eb6834" stroke="#fcfcfb" stroke-width="2" opacity="0.78"/>
<text x="404.1" y="160.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5.4 m</text>
<text x="404.1" y="182.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">直管損失</text>
<rect x="497.1" y="130.0" width="106.8" height="70.0" rx="0" fill="#eb6834" stroke="#fcfcfb" stroke-width="2" opacity="0.78"/>
<text x="550.5" y="160.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3.1 m</text>
<text x="550.5" y="182.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">局所損失</text>
<rect x="603.9" y="130.0" width="86.1" height="70.0" rx="0" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2" opacity="0.78"/>
<text x="646.9" y="160.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2.5 m</text>
<text x="646.9" y="182.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">速度水頭</text>
<text x="70.0" y="112.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start">ポンプが加える 18.0 m</text>
<text x="380.0" y="230.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">18.0 = 7.0 + 5.4 + 3.1 + 2.5 m</text>
<rect x="74.0" y="270.0" width="260.0" height="70.0" rx="8" fill="#ffffff" stroke="#e34948" stroke-width="1.6"/>
<text x="204.0" y="303.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">損失を無視した誤算</text>
<text x="204.0" y="320.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">√[2g(18−7)] = 14.7 m/s</text>
<line x1="350.0" y1="305.0" x2="410.0" y2="305.0" stroke="#52514e" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arw-52514e)"/>
<rect x="426.0" y="270.0" width="260.0" height="70.0" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
<text x="556.0" y="303.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">収支を閉じた実測</text>
<text x="556.0" y="320.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">√(2g×2.5) = 7.0 m/s</text>
</svg>
