<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">図1　連続体近似を支える中間尺度</title>
<desc id="desc">平均化箱は、分子を十分含みながら装置内の変化を潰さない：d ≪ ℓ ≪ L</desc>
<defs><marker id="arw-7b7a75" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b7a75"/></marker><marker id="arw-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="350.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図1　連続体近似を支える中間尺度</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">平均化箱は、分子を十分含みながら装置内の変化を潰さない：d ≪ ℓ ≪ L</text>
<line x1="72.0" y1="158.0" x2="690.0" y2="158.0" stroke="#7b7a75" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arw-7b7a75)"/>
<circle cx="112.0" cy="158.0" r="8.0" fill="#ffffff" stroke="#eb6834" stroke-width="2.5"/>
<text x="112.0" y="130.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#eb6834" text-anchor="middle">分子間隔 d</text>
<text x="112.0" y="193.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">数個では平均が揺れる</text>
<circle cx="370.0" cy="158.0" r="8.0" fill="#ffffff" stroke="#2a78d6" stroke-width="2.5"/>
<text x="370.0" y="130.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">平均化箱 ℓ</text>
<text x="370.0" y="193.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">ρ・u・p を安定して測る</text>
<circle cx="646.0" cy="158.0" r="8.0" fill="#ffffff" stroke="#1baf7a" stroke-width="2.5"/>
<text x="646.0" y="130.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#1baf7a" text-anchor="middle">装置長さ L</text>
<text x="646.0" y="193.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">場所による変化を残す</text>
<line x1="145.0" y1="238.0" x2="337.0" y2="238.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" marker-end="url(#arw-2a78d6)"/>
<line x1="403.0" y1="238.0" x2="612.0" y2="238.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" marker-end="url(#arw-2a78d6)"/>
<text x="241.0" y="226.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#2a78d6" text-anchor="middle">十分多くの分子</text>
<text x="508.0" y="226.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#2a78d6" text-anchor="middle">装置より十分小さい</text>
<rect x="238.0" y="274.0" width="284.0" height="48.0" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
<text x="380.0" y="304.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">中間尺度がなければ連続体近似は使えない</text>
</svg>
