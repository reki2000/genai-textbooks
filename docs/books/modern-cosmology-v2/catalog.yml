- id: modern-cosmology-v2
  category: natural-science
  created: '2026-08-23T20:43:11+09:00'
  question: 宇宙の異なる時代を示す七つの光・比率・揺らぎ・チャープを、何を時計にして一つの膨張史へ結ぶか。
  plot: プラネタリウム生放送の直前、旧友二人が共同制作した「宇宙の七つの残響」は再生順を失い、低い音ほど古いという演出も物理的に誤りだと判明する。解説を作ったやる夫と観測データを可聴化したやらない夫が、赤方偏移、軽元素、宇宙背景放射、銀河分布、超新星、重力レンズ、重力波を、それぞれ別の時計と系統誤差を持つ観測として照合し、未解決を示す八拍目の休符を残して宇宙史を演奏し直す。
