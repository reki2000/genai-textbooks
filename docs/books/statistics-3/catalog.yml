- id: statistics-3
  category: math-information
  created: '2026-07-29T00:12:20+09:00'
  follows: statistics-2
  question: 同じ400件の停止報告を、人文・社会・理工・医薬の四つの学問はそれぞれどう問うのか。
  plot: 全国10,000台の出荷後、返品80件・負傷報告12件・音声応答停止400件が四つの部署へ配られる。損失、不偏性、検定、頑健性、逐次判断の理論を共通の骨格に、四つの窓口が別々の問いを立てる場に立ち、手法の数ではなく問い・生成・前提・出力から分析を組み直す。
