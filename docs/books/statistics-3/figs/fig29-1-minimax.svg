<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" role="img" aria-labelledby="title"><title id="title">RはQに支配されて落ち、残るPとQは、重みを置けば平均、置けなければ最悪で勝者が入れ替わる</title><defs><pattern id="hcf3b2d" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#cf3b2d" stroke-width="1.2"/></pattern></defs><rect x="0" y="0" width="500" height="480" fill="#ffffff"/><rect x="216" y="60" width="204" height="204" fill="url(#hcf3b2d)" stroke="none" stroke-width="1.2"/><text x="318" y="80.4" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">Qに支配される範囲</text><text x="318" y="80.4" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#cf3b2d">Qに支配される範囲</text><line x1="80" y1="128" x2="352" y2="400" stroke="#1f6fd0" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/><text x="344.4" y="372.8" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="13" text-anchor="start" fill="#1f6fd0">同確率：平均が等しい線</text><path d="M 80 264 L 216 264 L 216 400" fill="none" stroke="#e07b1f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="86.8" y="256" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="13" text-anchor="start" fill="#e07b1f">最悪 4 の角</text><circle cx="114" cy="94" r="9" fill="#1c1c1c" stroke="#ffffff" stroke-width="2"/><text x="128" y="100" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">P (1, 9)</text><circle cx="216" cy="264" r="9" fill="#1c1c1c" stroke="#ffffff" stroke-width="2"/><text x="230" y="270" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">Q (4, 4)</text><circle cx="250" cy="162" r="9" fill="#cf3b2d" stroke="#ffffff" stroke-width="2"/><text x="264" y="168" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#cf3b2d">R (5, 7)</text><line x1="80" y1="400" x2="420" y2="400" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><line x1="80" y1="400" x2="80" y2="60" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><text x="80" y="422" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">0</text><text x="72" y="405" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" fill="#6b6b6b">0</text><text x="250" y="422" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">5</text><text x="72" y="235" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" fill="#6b6b6b">5</text><text x="420" y="422" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">10</text><text x="72" y="65" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" fill="#6b6b6b">10</text><text x="250" y="452" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">状態1での損失</text><text x="24" y="40" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" fill="#6b6b6b">状態2での損失</text><text x="24" y="474" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="13" text-anchor="start" fill="#6b6b6b">同確率なら Q（平均4）、状態1が90%なら P（平均1.8）、最悪を守るなら Q</text></svg>
