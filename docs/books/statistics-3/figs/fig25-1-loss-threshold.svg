<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img" aria-labelledby="title desc"><title id="title">閾値は50%ではなく、二つの期待損失が交差する4.85%</title><desc id="desc">閾値は50%ではなく、二つの期待損失が交差する4.85%</desc><rect x="0" y="0" width="760" height="344" fill="#ffffff"/><text x="52" y="32" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700">確率を出した後に、間違え方の重さを置いて初めて行動が決まる</text><text x="52" y="54" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">危険なのに継続すると100、安全なのに停止すると5、危険時の停止は2</text><path d="M 150 276 L 660 92" fill="none" stroke="#cf3b2d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M 150 199.33 L 660 204.85" fill="none" stroke="#1f6fd0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="592.0" y="108.53" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#cf3b2d" text-anchor="end" font-weight="700">継続の期待損失 100p</text><text x="592.0" y="223.93" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1f6fd0" text-anchor="end" font-weight="700">停止の期待損失 5 − 3p</text><line x1="356.31" y1="92" x2="356.31" y2="286" stroke="#e07b1f" stroke-width="2.4" stroke-linecap="round" opacity="1"/><circle cx="356.31" cy="201.57" r="7" fill="#e07b1f" stroke="#e07b1f" stroke-width="1.0" opacity="1"/><text x="366.31" y="108" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#e07b1f" text-anchor="start" font-weight="700">閾値 4.85%</text><text x="366.31" y="126" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">ここより左は継続、右は停止</text><line x1="320.0" y1="214.67" x2="320.0" y2="201.17" stroke="#8d8d8d" stroke-width="1.4" stroke-linecap="round" opacity="1" stroke-dasharray="4 3"/><circle cx="320.0" cy="214.67" r="4.5" fill="#cf3b2d" stroke="#cf3b2d" stroke-width="1.0" opacity="1"/><circle cx="320.0" cy="201.17" r="4.5" fill="#1f6fd0" stroke="#1f6fd0" stroke-width="1.0" opacity="1"/><text x="226.5" y="316" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1c1c1c" text-anchor="middle" font-weight="700">危険4% → 継続</text><line x1="405.0" y1="184.0" x2="405.0" y2="202.09" stroke="#8d8d8d" stroke-width="1.4" stroke-linecap="round" opacity="1" stroke-dasharray="4 3"/><circle cx="405.0" cy="184.0" r="4.5" fill="#cf3b2d" stroke="#cf3b2d" stroke-width="1.0" opacity="1"/><circle cx="405.0" cy="202.09" r="4.5" fill="#1f6fd0" stroke="#1f6fd0" stroke-width="1.0" opacity="1"/><text x="524.0" y="316" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#1c1c1c" text-anchor="middle" font-weight="700">危険6% → 停止</text><line x1="140" y1="276" x2="670" y2="276" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><line x1="150.0" y1="276" x2="150.0" y2="281" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="150.0" y="294" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">0</text><line x1="235.0" y1="276" x2="235.0" y2="281" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="235.0" y="294" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">2%</text><line x1="320.0" y1="276" x2="320.0" y2="281" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="320.0" y="294" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">4%</text><line x1="405.0" y1="276" x2="405.0" y2="281" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="405.0" y="294" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">6%</text><line x1="490.0" y1="276" x2="490.0" y2="281" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="490.0" y="294" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">8%</text><line x1="575.0" y1="276" x2="575.0" y2="281" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="575.0" y="294" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">10%</text><line x1="660.0" y1="276" x2="660.0" y2="281" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="660.0" y="294" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">12%</text><text x="405" y="336" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">危険状態である確率</text><line x1="150" y1="276" x2="150" y2="92" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><line x1="145" y1="276.0" x2="150" y2="276.0" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="141" y="280.0" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="end" font-weight="400">0</text><line x1="145" y1="199.33" x2="150" y2="199.33" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="141" y="203.33" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="end" font-weight="400">5</text><line x1="145" y1="122.67" x2="150" y2="122.67" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="141" y="126.67" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="end" font-weight="400">10</text><text x="112" y="84" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">期待損失</text></svg>
