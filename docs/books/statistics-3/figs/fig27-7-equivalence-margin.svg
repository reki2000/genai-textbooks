<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="title"><title id="title">0を含む区間でも、上端が害の上限4ポイントをまたげば安全とは言えず、上限未満に収まって初めて示せる</title><defs><pattern id="hcf3b2d" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#cf3b2d" stroke-width="1.2"/></pattern></defs><rect x="0" y="0" width="600" height="340" fill="#ffffff"/><line x1="368.9" y1="56" x2="368.9" y2="250" stroke="#1c1c1c" stroke-width="1.4" stroke-dasharray="4 4" stroke-linecap="round"/><text x="368.9" y="46" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">差 0</text><rect x="453.3" y="56" width="126.7" height="194" fill="url(#hcf3b2d)" stroke="none" stroke-width="1.2"/><line x1="453.3" y1="56" x2="453.3" y2="250" stroke="#cf3b2d" stroke-width="2.4" stroke-linecap="round"/><text x="459.3" y="46" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#cf3b2d">害の許容上限 4</text><line x1="326.7" y1="90" x2="516.7" y2="90" stroke="#e07b1f" stroke-width="4" stroke-linecap="round"/><circle cx="411.1" cy="90" r="7" fill="#e07b1f" stroke="#ffffff" stroke-width="1.5"/><text x="24" y="95" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#1c1c1c">2/100 対 0/100</text><text x="24" y="115" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="13" text-anchor="start" fill="#6b6b6b">上限をまたぐ：まだ示せない</text><line x1="339.3" y1="150" x2="440.7" y2="150" stroke="#1f6fd0" stroke-width="4" stroke-linecap="round"/><circle cx="390" cy="150" r="7" fill="#1f6fd0" stroke="#ffffff" stroke-width="1.5"/><text x="24" y="155" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#1c1c1c">追跡を増やした場合</text><text x="24" y="175" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="13" text-anchor="start" fill="#6b6b6b">上限未満を示せた</text><line x1="434.3" y1="210" x2="556.8" y2="210" stroke="#cf3b2d" stroke-width="4" stroke-linecap="round"/><circle cx="495.6" cy="210" r="7" fill="#cf3b2d" stroke="#ffffff" stroke-width="1.5"/><text x="24" y="215" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#1c1c1c">害が大きかった場合</text><text x="24" y="235" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="13" text-anchor="start" fill="#6b6b6b">害が増えている</text><line x1="263.3" y1="260" x2="580" y2="260" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><line x1="263.3" y1="260" x2="263.3" y2="265" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><text x="263.3" y="282" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">-5</text><line x1="368.9" y1="260" x2="368.9" y2="265" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><text x="368.9" y="282" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">0</text><line x1="474.4" y1="260" x2="474.4" y2="265" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><text x="474.4" y="282" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">+5</text><line x1="580" y1="260" x2="580" y2="265" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><text x="580" y="282" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">+10</text><text x="421.7" y="306" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" fill="#6b6b6b">負傷率の差（ポイント、正が害）</text></svg>
