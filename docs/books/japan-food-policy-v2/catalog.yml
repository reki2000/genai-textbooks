- id: japan-food-policy-v2
  category: society
  draft: true
  created: '2026-08-23T20:43:11+09:00'
  question: 100人を7日間食べさせる具体策から、日本の食料安全保障をどのように組み立て直せるか。
  plot: 台風接近中の公民館で、大衆食堂を営むやる夫が「100人を7日食べさせる」と宣言する。住民一人一日を示す700の食卓灯は、量・アクセス・利用・安定の四色がそろうまで消えたまま。共同配送組合のやらない夫と利害をぶつけ、模擬速報と実際の通行止めに案を壊されながら、平時にも有事にも動く政策ポートフォリオへ組み直す。
