- id: standard-model-v3
  category: natural-science
  draft: true
  created: '2026-09-08T12:00:00+09:00'
  question: 検出器に何も写らなかった向きについて、標準模型はどこまで言ってよいのか。
  plot: 開館9時間前、科学館の解説員やる夫は衝突事象の大判に「未知粒子、発見！」の札を貼る。その一枚を選んだ検出器技師のやらない夫は正体を明かさず、計算だけをやらせる。欠損横運動量、局在と対生成、量子場、ネーター電流、パートン分率、共変微分と場の強さ、色とSU(3)、閉じ込めとジェット、カイラリティと電弱、横質量80 GeV、真空期待値と自由度の会計、断面積と系統誤差を通って、やる夫は測っていないものを描き足す癖を五度繰り返しながら、朝までに札を書き直していく。
