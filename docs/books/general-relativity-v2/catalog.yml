  question: 地下、屋上、列車、衛星の時計を、同じ時刻に合わせることは本当に正しいのか。
  plot: 日食電波観測の前夜、電波画像アルゴリズムを作ったやる夫と、測位衛星の時刻モデルを提供したやらない夫が、四つの原子時計のずれを巡って互いの系を故障だと主張する。別組織・別分野の二人は時計を同じ表示へ直す案を捨て、それぞれが時空をどう進んだかを計量、測地線、曲率、アインシュタイン方程式で予測し、ずれを含めて同期する。
