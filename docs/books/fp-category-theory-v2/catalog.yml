- id: fp-category-theory-v2
  category: math-information
  created: '2026-08-23T20:43:11+09:00'
  question: 五つの配送システムが全部成功を返したのに、路上予約枠R-17だけが時刻表から消えたのはなぜか。
  plot: 共同配送の本番切替夜、20時17分の路上予約枠R-17が、地図・配車・道路・通知・課金の全画面で成功しながら現地表示だけ点灯しない。地図アプリを作ったやる夫と、二重予約を見つけて切替を止めた市の形式監査人やらない夫が、対象、射、合成、可換図式、関手、自然変換、普遍性を使い、内部値でなく変換が守る法則から三分間の空白を追う。
