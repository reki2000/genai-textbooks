  created: '2026-09-03T12:00:00+09:00'
  question: 子どもの数を目標にするだけでなく、人口が縮む途中の暮らしと選択をどう守るのか。
  plot: 園児3人しか乗らない黄色いバス「たんぽぽ号」に年900万円。園主のやる夫は3で割って廃止を宣言するが、20年この路線を走らせてきた訪問看護師のやらない夫は答えを言わず、計算だけをやらせる。一人当たり費用、出生率と出生数、拘束的制約、従属人口比率、固定費、労働移動、転入と転出、シナリオと可逆性を通って、やる夫は同じ人を二度数える癖を五度繰り返しながら、判定に使う五つの窓を自分で組み立てていく。
