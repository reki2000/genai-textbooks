documents:
- id: decarbonization-v2
  category: society
  created: '2026-08-23T20:43:11+09:00'
  question: 一つのパンにつく炭素の値札を、宣伝ではなく設備・原料・物流の意思決定へどう変えるか。
  plot: 取引先から48時間で商品カーボンフットプリントを求められたパン屋やる夫と、数字次第で契約を失う小麦農家やらない夫が、一回の仕込みを畑の施肥、製粉、窯の炎、冷却、包装、配送、売れ残りまで逆向きに歩く。互いへ排出を押し付ける近道を捨て、帳簿上のゼロと物理的削減、平均と限界、排出と除去を見分け、停電の夜にも焼ける移行計画を作る。
