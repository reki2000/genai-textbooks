documents:
- id: decarbonization
  title: やる夫が脱炭素でブランディングするようです
  category: society
  created: '2026-07-24T22:23:06+00:00'
  question: 脱炭素は意識が高いだけの話なのか、それとも経済的・政治的な要請なのか、中小企業にとって何が本当に効くのか。
  plot: 新卒採用が埋まらず脱炭素でブランディングしようと思いついた4代目社長やる夫が、創業者である曾祖父の霊とともに、カーボンバジェットの物理から共有地の悲劇、パリ協定、Scope 3と削減費用曲線までをたどり、自社の排出7,600トンの正体と「効く順番」を再発見していく。
