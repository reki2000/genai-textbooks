documents:
- id: decarbonization
  category: society
  created: '2026-07-24T22:23:06+00:00'
  question: 脱炭素は意識が高いだけの話なのか、経済的・政治的な要請なのか。中小企業は取引先の要請に、どんな根拠と順番で応えるのか。
  plot: 新卒採用が埋まらず脱炭素でブランディングしようと思いついた4代目社長やる夫が、総務の引き出しで回答期限まで7日の調査票を見つける。創業者である曾祖父の霊とともに、カーボンバジェットの物理から共有地の悲劇、パリ協定、Scope 3までをたどって自社の排出7,600トンの正体を数え、納入部品1個の値札を配分と幅つきで出し、削減の効く順番と、下請へ負担を押し付けない頼み方を再発見していく。
