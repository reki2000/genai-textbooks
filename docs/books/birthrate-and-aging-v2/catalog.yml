  question: 子どもの数を目標にするだけでなく、人口が縮む途中の暮らしと選択をどう守るのか。
  plot: 園児3人の黄色いバスY-17をめぐり、送迎を失えば園が続かない保育園主やる夫と、通院便へ回さなければ訪問先が孤立する看護師やらない夫が、交通協同組合の一票ずつをぶつける。一台を奪い合ううちに30年間の人口変化へ踏み込み、出生数、選択の自由、現在の生活、財政、将来適応の五つの窓で路線と政策を組み替える。
