- id: weather-forecasting-muse1
  category: natural-science
  created: '2026-10-28T09:10:00+09:00'
  question: 天気予報はなぜ難しく、「現在の天気」は観測と予報の折り合いでどう作られ、AI予報は何を変えたのか。
  plot: 物理と機械学習をかじった学生やる夫が、カオスの2週間の壁と「晴れ22℃か前線通過で12℃か五分五分」の例から出発し、物理法則を積分する数値予報を経て、気象台の観測担当みはると一緒に観測網とデータ同化を再発見する。予報と観測を誤差で重み付けする手計算で解析値を作り、球面GNNと拡散モデルによる確率予報、検証指標とML予報の留保まで確かめ、最後は分布を渡されたうえでの決行判断に戻る。
  revision_of: weather-forecasting
