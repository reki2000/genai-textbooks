documents:
- id: birthrate-and-aging
  category: society
  created: '2026-08-01T13:54:58+09:00'
  question: 高齢者を減らしても子どもを増やしても解けないなら、人口が縮む国を壊さずに動かし続けるには何を設計すればよいのか。
  plot: 高齢者を一括削除すれば財政は治ると言い出したやる夫が、平均像ではない個々の高齢者、人口ボーナスの正体、出産給付と「産ませる政策」の限界、介護人材、コンパクトシティ、移民、生産性2倍の技術、出生率予測と医療の打ち切りまでを順に試し、最後は人口を増やす国ではなく縮んでも壊れない国の設計へ辿り着く。
