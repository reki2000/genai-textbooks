documents:
- id: life-meaning
  category: thought
  created: '2026-07-25T16:57:29+00:00'
  question: 金、家族、称賛、名声、歴史に残る仕事、誰にも知られない満足をどう比べ、他人との差も使いながら、自分は何をどこまで求めるのか。
  plot: 著名人の習慣を真似ても何も起きない18歳のやる夫が、公園で出会った謎の老人と、生存者バイアス、才能、妬みを解剖する。やがて経済的自由の価格帯、家族に対する努力と運、称賛の量、名声と遺産、後悔を別々の帳簿に分け、生活の床、主戦場、払う代償、証拠、見直し日から、自分に合う人生の仮契約を組み立てる。
