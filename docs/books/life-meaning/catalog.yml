documents:
- id: life-meaning
  title: やる夫は凡人で終わりたくないようです
  path: /books/life-meaning
  category: thought
  created: '2026-07-25T16:57:29+00:00'
  question: 才能とは何で、金儲けや人望や博識は何でできているのか、そして「平凡な人生を愛せ」は詭弁なのか真実なのか。
  plot: 著名人の習慣を真似ても何も起きない18歳のやる夫が、公園で出会った謎の老人とともに、生存者バイアス、才能の分解、地位財、妬みの構造をたどり、順位では手に入らない「ここに居ていい理由」を再発見する。
