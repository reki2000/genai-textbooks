- id: rental-car-operations
  category: engineering
  created: '2026-07-23T22:15:51+09:00'
  draft: true
  question: 一番速い人が何でも片づけている会社で、業務改善と自動化を担う組織（CoE）を立ち上げても、なぜ現場は良くならないのか。仕事を代わりに引き受けずに、会社の業務を変え続けるにはどうするのか。
  plot: ホライゾンレンタカーで一番速い事務担当のやる夫が、新設の業務改善室の室長に抜擢される。猶予は半年、1月の取締役会で成果がなければ室は解散し、基幹の一括更改と事務の委託へ切り替わる。最大の法人顧客の離反、整備保留車の貸出未遂、室に殺到する240件の依頼、忙しすぎるエンジニア、AI全社導入の号令を越えて、大晦日の大雪と連携障害の日に、室が現場から手を引けるかが試される。
