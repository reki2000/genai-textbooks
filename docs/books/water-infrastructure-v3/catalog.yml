documents:
- id: water-infrastructure-v3
  category: engineering
  draft: true
  created: '2026-09-08T12:00:00+09:00'
  question: 雨の一滴が蛇口、下水、川へ巡るまで、都市はどこで水量、水質、時間、責任をつなぐのか。
  plot: 水都祭まで24時間。低地の冠水、北区の濁水、駅前の陥没、下流の魚。四件の通報を「全部、昨日の雨のせい」で片付けようとした設営者のやる夫に、水道の当直を30年つとめて退職したやらない夫は答えを言わず、計算だけをやらせる。降雨体積と流出係数、ピークと貯留、残圧と逆流防止、多重防御、水齢と汚濁負荷、物質収支、内水と外水、圧密、リスクと更新費、縮退運転を通って、やる夫は「一番大きいのを一台入れれば解決する」を七度くり返しながら、追跡盤の白板を一行ずつ育てていく。
