<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">図1　皇帝の命令は、何段もの読み替えを経て村へ届く</title>
<desc id="desc">共通文書は広域をつなぐが、各段階で言語・行政慣行・地域の利害が命令の実施を変える</desc>
<defs><marker id="arw-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="390.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図1　皇帝の命令は、何段もの読み替えを経て村へ届く</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">共通文書は広域をつなぐが、各段階で言語・行政慣行・地域の利害が命令の実施を変える</text>
<rect x="24.0" y="126.0" width="120.0" height="76.0" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
