<rect x="172.0" y="126.0" width="120.0" height="76.0" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/>
<text x="232.0" y="162.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">地方官</text>
<text x="232.0" y="179.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">解釈・配分</text>
