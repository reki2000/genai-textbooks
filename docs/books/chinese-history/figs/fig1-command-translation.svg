<line x1="592.0" y1="164.0" x2="612.0" y2="164.0" stroke="#52514e" stroke-width="2" stroke-linecap="round" marker-end="url(#arw-52514e)"/>
<text x="380.0" y="91.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">同じ一文が、そのまま全員へ届くわけではない</text>
