<text x="386.0" y="275.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#eb6834" text-anchor="middle">言語</text>
<line x1="534.0" y1="216.0" x2="534.0" y2="254.0" stroke="#eb6834" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="534.0" y="275.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#eb6834" text-anchor="middle">地域の利害</text>
