<text x="380.0" y="326.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="middle">広域をつなぐ共通文書</text>
<text x="380.0" y="344.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="middle">＋　段階ごとの翻訳と交渉　＝　実際の統治</text>
</svg>
