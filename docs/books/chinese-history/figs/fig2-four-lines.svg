<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">図2　民族名の前後は、一本の系譜でなく4本の線で検査する</title>
<desc id="desc">女真→満洲は複数の線が重なるが、匈奴→モンゴルは同じ太さで直結できない</desc>

<rect x="0.0" y="0.0" width="760.0" height="430.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図2　民族名の前後は、一本の系譜でなく4本の線で検査する</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">女真→満洲は複数の線が重なるが、匈奴→モンゴルは同じ太さで直結できない</text>
<text x="226.0" y="86.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">女真 → 満洲</text>
<text x="566.0" y="86.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle">匈奴 → モンゴル</text>
<rect x="24.0" y="118.0" width="132.0" height="46.0" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/>
<text x="90.0" y="139.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">人</text>
<text x="90.0" y="156.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">子孫・移住集団</text>
<line x1="178.0" y1="141.0" x2="274.0" y2="141.0" stroke="#1baf7a" stroke-width="5" stroke-linecap="round"/>
<text x="294.0" y="145.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#1baf7a" text-anchor="start">確認しやすい</text>
<line x1="518.0" y1="141.0" x2="614.0" y2="141.0" stroke="#1baf7a" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" opacity="0.55"/>
<text x="634.0" y="145.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">直結不可</text>
<rect x="24.0" y="180.0" width="132.0" height="46.0" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
<text x="90.0" y="201.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">言語</text>
<text x="90.0" y="218.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">同語族・近縁・別・不明</text>
<line x1="178.0" y1="203.0" x2="274.0" y2="203.0" stroke="#2a78d6" stroke-width="5" stroke-linecap="round"/>
<text x="294.0" y="207.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#2a78d6" text-anchor="start">確認しやすい</text>
<line x1="518.0" y1="203.0" x2="614.0" y2="203.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" opacity="0.55"/>
<text x="634.0" y="207.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">直結不可</text>
<rect x="24.0" y="242.0" width="132.0" height="46.0" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.6"/>
<text x="90.0" y="263.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">政治</text>
<text x="90.0" y="280.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">制度・称号・組織の再編</text>
<line x1="178.0" y1="265.0" x2="274.0" y2="265.0" stroke="#eb6834" stroke-width="5" stroke-linecap="round"/>
<text x="294.0" y="269.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#eb6834" text-anchor="start">確認しやすい</text>
<line x1="518.0" y1="265.0" x2="614.0" y2="265.0" stroke="#eb6834" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" opacity="0.55"/>
<text x="634.0" y="269.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">一部不明</text>
<rect x="24.0" y="304.0" width="132.0" height="46.0" rx="8" fill="#ffffff" stroke="#7b7a75" stroke-width="1.6"/>
<text x="90.0" y="325.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">名前</text>
<text x="90.0" y="342.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="middle">自称・他称・名称変更</text>
<line x1="178.0" y1="327.0" x2="274.0" y2="327.0" stroke="#7b7a75" stroke-width="5" stroke-linecap="round"/>
<text x="294.0" y="331.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#7b7a75" text-anchor="start">確認しやすい</text>
<line x1="518.0" y1="327.0" x2="614.0" y2="327.0" stroke="#7b7a75" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" opacity="0.55"/>
<text x="634.0" y="331.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start">直結不可</text>
<line x1="380.0" y1="102.0" x2="380.0" y2="364.0" stroke="#dcdedd" stroke-width="1.2" stroke-linecap="round"/>
<rect x="54.0" y="382.0" width="652.0" height="30.0" rx="7" fill="#ffffff" stroke="#e2e4e3" stroke-width="1"/>
<text x="380.0" y="402.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">名前が消えても他の線は残りうる／名前が似ても4本は自動でつながらない</text>
</svg>
