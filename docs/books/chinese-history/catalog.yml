documents:
- id: chinese-history
  category: society
  created: '2026-08-01T13:52:40+09:00'
  question: 中国の王朝は本当に興亡を繰り返しただけなのか、それとも前王朝の何を捨て何を受け継ぐかを選び続けてきたのか。
  plot: 現代の地図と民族名をそのまま過去へ当てはめようとするやる夫が、殷周の王権、秦漢の戸籍と統治技術、五胡と北魏の混成、唐の世界帝国、宋遼西夏金の国際社会、モンゴル・元、明、清の複数の顔、そして清朝崩壊後の共和国までを辿り、最後に永久に滅びない王朝を設計しようとして王朝循環の正体に気づく。
