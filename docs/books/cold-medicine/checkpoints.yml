schema: checkpoints/v1
book: cold-medicine
checkpoints:
  - id: cp-01
    concept: かぜの自己限定性と標的の不在
    statement: "かぜそのものを治す特効薬が無い理由を、免疫と標的の二面から説明できる"
    depends_on: []
    evidence: "かぜは **自然に治る（自己限定性、self-limiting、の）病気** だ"
    probes:
      - when: 直後
        kind: 説明
        prompt: "薬局にかぜを根治する薬が置かれていないのはなぜか。二つの理由を挙げて説明せよ。"
        expected: "治すのは免疫で、数日で自然に治る（自己限定性）。原因ウイルスが二百種以上あり構造がばらばらで、共通して叩ける標的が無い。"
      - when: 数日後
        kind: 転移
        prompt: "ある感染症について「特効薬を作る価値があるか」を判断したい。何を調べれば見当がつくか。"
        expected: "放置したときの経過（自然治癒するか、重症化するか）と、原因体が単一で共通標的を持つか。インフルエンザのように標的が定まれば薬になる。"

  - id: cp-02
    concept: 対症療法と原因療法
    statement: "棚のかぜ薬が原因ではなく症状に手を出していることを説明できる"
    depends_on: [cp-01]
    evidence: "棚の薬は原因を治していない。**症状を抑えている**"
    probes:
      - when: 直後
        kind: 説明
        prompt: "かぜ薬を飲んで熱が下がり楽になった。このとき体の中でウイルスはどうなっているか。"
        expected: "減っていない。ウイルスを倒しているのは免疫で、薬は症状（体の反応）を浅くしているだけ。回復までの時間を楽にする道具。"

  - id: cp-03
    concept: 一機構一成分と配合薬の必然
    statement: "総合感冒薬が単一成分ではなく配合薬になる必然を、機構の分岐から説明できる"
    depends_on: [cp-02]
    evidence: "**一つの薬は、一つの機構にしか手を出せない**"
    probes:
      - when: 直後
        kind: 説明
        prompt: "原因のウイルスは一つなのに、なぜ一つの成分で全症状を止められないのか。"
        expected: "大元は一つでも下流の機構が枝分かれしている（発熱は視床下部の設定温度、鼻水はヒスタミン、咳は反射、詰まりは血管の充血）。薬は機構ごとにしか手を出せないので、症状の機構の数だけ成分が要る。"
      - when: 翌日
        kind: 予測
        prompt: "「一成分で全症状に効く」とうたう製品があったとする。何を疑い、何を確かめるか。"
        expected: "複数の機構を一つの分子が同時に抑えているか、あるいは効いていない症状があるかを疑う。症状ごとの機構が別であることが出発点。"

  - id: cp-04
    concept: 設定温度（セットポイント）
    statement: "氷枕で体を冷やしても熱が下がらない理由を、設定温度で説明できる"
    depends_on: [cp-03]
    evidence: "攻めるべきは体表じゃない。**設定温度そのもの** だ"
    probes:
      - when: 直後
        kind: 予測
        prompt: "38.5℃の発熱時に氷水へ体を沈めると、体温はその後どう動くか。理由も述べよ。"
        expected: "皮膚温は一時的に下がるが、設定温度が38.5℃のままなので体は「足りない」と判断して震え、熱を作り直す。下がらないか、かえって苦しくなる。"
      - when: 数日後
        kind: 転移
        prompt: "エアコンの効いた部屋が寒すぎるとき、窓を開けて外気を入れるのは有効な手か。設定温度の話と対応づけて答えよ。"
        expected: "サーモスタットの設定が変わらない限り、冷気の投入は装置の運転を増やすだけで釣り合いは戻らない。手を出す先は出力ではなく設定値。"

  - id: cp-05
    concept: 安全性の墓場
    statement: "よく効いて安い解熱剤が次々退場した理由を、具体的な害の型で説明できる"
    depends_on: [cp-04]
    evidence: "安直な候補が一個ずつ、具体的な死に方で潰れて、最後の一個が残ったんだお"
    probes:
      - when: 翌日
        kind: 説明
        prompt: "ピラゾロン系、アセトアニリド、フェナセチンは、それぞれ何によって棚から消えたか。"
        expected: "ピラゾロン系は無顆粒球症（感染と戦う白血球が作れなくなる）、アセトアニリドはメトヘモグロビン血症（酸素を運べなくなる）、フェナセチンは長期使用による腎障害。効き目ではなく害の型で落ちた。"
      - when: 数日後
        kind: 転移
        prompt: "新しい成分が「よく効いて安く大量生産できる」と分かった。この時点で残っている最大の未知は何か。"
        expected: "まれで予測できない重篤な害と、何十年か経って現れる慢性毒性。効き目と安さは短期に分かるが、安全性の判定には時間と規模が要る。"

  - id: cp-06
    concept: 効果が先、機序が後
    statement: "薬の効果の確立と機序の解明が別の時計で進むことを、実例で説明できる"
    depends_on: [cp-05]
    evidence: "順番を間違えるな。効く薬が先、理解が後だ"
    probes:
      - when: 翌日
        kind: 説明
        prompt: "「機序が分かっていない薬は使うべきでない」という主張に、教材の事実で反論せよ。"
        expected: "アスピリンは1899年発売で機序の解明は1971年（プロスタグランジン合成酵素の阻害）。アセトアミノフェンやデキストロメトルファンは現在も機序が完全には決着していないが、効果は確立している。"

  - id: cp-07
    concept: 血液脳関門と受容体の分布
    statement: "旧世代の抗ヒスタミン薬が眠気を起こす理由を、受容体の分布と脳への到達で説明できる"
    depends_on: [cp-03]
    evidence: "脳を守る関門（血液脳関門、blood-brain barrier）をやすやすと越え、脳の覚醒の鍵穴まで塞ぐ"
    probes:
      - when: 直後
        kind: 説明
        prompt: "鼻に効かせたいだけの薬が、なぜ眠気を起こすのか。"
        expected: "同じ受容体が脳にもあり、そこでは覚醒の維持に使われている。小さく脂に溶けやすい分子は血液脳関門を越えて脳の受容体まで塞ぐため、覚醒の号令が止まる。"
      - when: 数日後
        kind: 転移
        prompt: "「効かせたい臓器にだけ効く薬」を設計したい。分子のどんな性質を操作するか。"
        expected: "関門を越えにくくする（大きく、脂に溶けにくくする）など、到達する場所を制御する。受容体の選択性だけでなく分布が副作用を決める。"

  - id: cp-08
    concept: 受容体サブタイプ
    statement: "同じ伝達物質でも受容体の型が違えば効く症状が変わることを説明できる"
    depends_on: [cp-07]
    evidence: "『ヒスタミンをブロック』とひとことで言っても、どの鍵穴かで効く症状が全然違うんだお"
    probes:
      - when: 翌日
        kind: 予測
        prompt: "かぜ薬の抗ヒスタミン薬を飲んでも胃酸の分泌が止まらないのはなぜか。"
        expected: "鼻や血管の受容体（H1）と胃酸の受容体（H2）は別の型で、かぜ薬が塞ぐのは H1 だけ。胃酸を抑えるには H2 に効く別の薬が要る。"

  - id: cp-09
    concept: 鏡像異性体による作用の仕分け
    statement: "鏡像異性体を選び分けると、効果を残して副作用だけ切れる場合があることを説明できる"
    depends_on: [cp-05]
    evidence: "**鏡像を選ぶだけで鉤爪だけ切り落とせた**んだお"
    probes:
      - when: 直後
        kind: 説明
        prompt: "デキストロメトルファンが、コデインと同程度に咳を止めるのに麻薬として扱われないのはなぜか。"
        expected: "モルヒナン骨格の右手型で、麻薬性の受容体には立体的にはまれない。咳を止める別の作用は残るため、依存・呼吸抑制・便秘をほとんど伴わない。"
      - when: 数日後
        kind: 転移
        prompt: "教材にはもう一組、鏡像で作用を仕分けた例が出てくる。それは何で、何を仕分けたか。"
        expected: "エフェドリンとプソイドエフェドリン。鼻の血管を締める力を保ちながら、中枢刺激（動悸・興奮・不眠）の強さを分けている。"

  - id: cp-10
    concept: 湿った咳の機能
    statement: "痰がからむ咳を止めてはいけない理由を、咳の役割から説明できる"
    depends_on: [cp-03]
    evidence: "**咳は痰を運ぶ運送屋**だお"
    probes:
      - when: 直後
        kind: 予測
        prompt: "痰がからんでいる人が強い鎮咳薬を飲み続けると、何が起きるか。"
        expected: "痰が運び出されずに気道へたまり、細菌の温床になってこじらせる。湿った咳は止めず、出しやすくする（去痰薬）方向で扱う。"

  - id: cp-11
    concept: 有効性の証明要求
    statement: "去痰薬がほぼ全滅した理由を、承認制度が要求するものの変化で説明できる"
    depends_on: [cp-06]
    evidence: "以後は **『効く』ことも証明しなければ売れない** ことになった"
    probes:
      - when: 翌日
        kind: 説明
        prompt: "1962年を境に、去痰をうたう成分の多くが棚から消えた。何が変わったのか。"
        expected: "それまでは安全性を示せば売れたが、以後は有効性の証明も求められた。既存成分も遡って審査され、効く証拠を出せなかったものが消えた。「昔から使われている」は根拠にならなくなった。"
      - when: 数日後
        kind: 転移
        prompt: "かぜ薬の効果は、なぜ証明が難しいのか。"
        expected: "かぜは放っておいても治るので「薬のおかげ」と「自然治癒」を分けにくい。痰の量や咳の回数など指標自体も測りにくい。だから対照を置いた比較が要る。"

  - id: cp-12
    concept: 含量均一性と幾何希釈
    statement: "微量成分を均一に配合するために段階的な希釈が要ることを、必要段数の計算とともに説明できる"
    depends_on: [cp-03]
    evidence: "少量成分をまず少しの粉で薄め、それをまた薄めて段階的に広げる"
    probes:
      - when: 翌日
        kind: 予測
        prompt: "2mg の成分を 400mg の錠剤へ配合する。1段で3倍まで薄める操作を繰り返すとき、最低何段必要か。式とともに答えよ。"
        expected: "比は 1:200。n 段で 3 の n 乗倍に広がるので 3^n ≥ 200。3^4=81 では足りず 3^5=243 なので最低5段。"
      - when: 数日後
        kind: 転移
        prompt: "一気に混ぜて均一にしようとすると、なぜ失敗するのか。"
        expected: "粒の重さや大きさの差で混合中に偏析が起き、錠ごとの含量がばらつく。ある錠は二錠分、隣はゼロという事態になる。"

  - id: cp-13
    concept: 成分が製法を縛る
    statement: "配合成分を決めた時点で使える製造工程まで縛られることを、具体例で説明できる"
    depends_on: [cp-12]
    evidence: "固めるには造粒したい、造粒には水を使いたい、でも水はアスピリンを壊す"
    probes:
      - when: 翌日
        kind: 説明
        prompt: "アスピリンを含む錠剤で湿式造粒が使えないのはなぜか。使えないと何で代替するか。"
        expected: "水分でアセチル基の蓋が外れて加水分解し、サリチル酸と酢酸に戻る（古い錠剤の酢の匂い）。乾式造粒や直打で代替し、防湿を徹底する。"
      - when: 数日後
        kind: 転移
        prompt: "反応しあう二つの成分を一錠に入れたい。二錠に分ける以外の手を挙げ、その利点を述べよ。"
        expected: "二層錠・多層錠で層に隔離する。飲む側は一錠のままなので「一箱一回分」という配合薬の要件を壊さない。"

  - id: cp-14
    concept: 初回通過効果
    statement: "点鼻では効く成分が経口では効かないことがある理由を、吸収と代謝の経路で説明できる"
    depends_on: [cp-05]
    evidence: "腸と肝臓で最初に大部分が分解される（初回通過効果）"
    probes:
      - when: 直後
        kind: 説明
        prompt: "経口フェニレフリンが鼻づまりに効かないのは、血管を締める作用が無いからか。"
        expected: "作用は有る。点鼻なら効く。飲むと腸と肝臓で大部分が分解され、鼻の血管に届く前に壊れる（初回通過効果）ため効かない。"
      - when: 数日後
        kind: 転移
        prompt: "ある薬が注射では効くのに飲んでも効かない。考えられる原因を二つ挙げよ。"
        expected: "腸で吸収されない、または吸収されても肝臓で最初に代謝される（初回通過効果）。到達量が足りなければ、作用の有無とは無関係に効かない。"
