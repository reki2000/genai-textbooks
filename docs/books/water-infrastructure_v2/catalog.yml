  category: engineering
  created: '2026-08-23T20:43:11+09:00'
  question: 雨の一滴が蛇口、下水、川へ巡るまで、都市はどこで水量・水質・時間・責任をつなぐのか。
  plot: 水都祭まで24時間、濁水、道路陥没、冠水、魚の浮上が同時発生する。祭りを止めたくない音響設営者やる夫と、下流を守りたい川漁師やらない夫は、音と流れの到着時刻を手掛かりに仮想トレーサーW-17を雨雲から川、浄水、配水、下水へ追う。互いの上流・下流だけを見る癖を壊し、巨大施設一発ではなく壊れても戻せる水の都を設計する。
