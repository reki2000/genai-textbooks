documents:
- id: weather-forecasting
  category: natural-science
  created: '2026-07-06T00:20:08+09:00'
  question: 天気予報はなぜ難しく、観測・物理モデル・データ同化・AIは何を補っているのか。
  plot: 物理と機械学習をかじった学生やる夫が、持続予報やアナログ予報の限界とカオスの2週間の壁から出発し、物理法則を積分する数値予報を経て、学習可能な予報器を組み立てる。最後はGraphCastやGenCastが物理モデルと張り合う現在地と、再解析データやデータ同化に依存するという留保まで確かめる。
