<line x1="504.0" y1="176.0" x2="512.0" y2="176.0" stroke="#7b7a75" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arw-7b7a75)"/>
<line x1="620.0" y1="176.0" x2="628.0" y2="176.0" stroke="#7b7a75" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arw-7b7a75)"/>
<text x="684.0" y="258.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#e34948" text-anchor="middle">半分の深さの低気圧が2つ</text>
<text x="684.0" y="274.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11" font-weight="700" fill="#e34948" text-anchor="middle">＝実在しない場</text>
<text x="24.0" y="362.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">MSE を最小化する予報は「あり得る未来たちの条件付き平均」。未来が多峰なら、平均はどの山にも当たらない谷底になる。</text>
<text x="24.0" y="379.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">鋭い前線を少しズレた位置に出すと有る所と無い所で二度罰せられる（double penalty）ので、モデルはぼかして両張りする。</text>
<text x="24.0" y="396.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">欲しいのは平均という 1 点ではなく、未来の分布そのもの ── これが「予報は決定論的な単一予報であってはいけない」理由。</text>
