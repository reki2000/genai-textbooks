<text x="24.0" y="396.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">誤差は倍加時間ごとに 2 倍という指数関数で育つため、予報期間を線形に延ばすには初期観測を指数的に良くするしかない。</text>
<text x="24.0" y="413.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="start">だからどれだけ測定技術を磨いても、限界は 2 週間前後に貼りついたままになる（ローレンツの予測可能性の限界）。</text>
