<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">静的基礎層と更新差分層のハイブリッド</title>
  <desc id="desc">大きな静的簡潔構造と小さな更新差分を並行して検索し、差分が閾値へ達したときだけ基礎層を再構築して切り替える。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#24313a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; fill: #24313a; dominant-baseline: middle; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #60717d; }
      .label { font-size: 18px; }
      .small { font-size: 14px; fill: #60717d; }
      .tiny { font-size: 12px; fill: #60717d; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans JP", monospace; font-size: 18px; font-weight: 650; }
      .number { font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans JP", monospace; font-size: 22px; font-weight: 700; }
      .result { font-size: 22px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fbfaf7"/>
<text x="50" y="46" class="title" text-anchor="start">更新を隔離し、静的な簡潔構造を守る</text>
<text x="50" y="80" class="subtitle" text-anchor="start">問い合わせは基礎層と更新層を統合し、差分が育った時だけ再構築する</text>
<rect x="55" y="130" width="430" height="260" rx="12" fill="#dcecf7" stroke="#2463a6" stroke-width="2.5"/>
<text x="270" y="164" class="result" text-anchor="middle" fill="#2463a6">大きな静的基礎層</text>
<text x="270" y="205" class="label" text-anchor="middle">LOUDS / Elias–Fano</text>
<text x="270" y="239" class="label" text-anchor="middle">Wavelet Matrix / FM-index</text>
<text x="270" y="273" class="label" text-anchor="middle">圧縮ビットベクトル</text>
<text x="270" y="332" class="small" text-anchor="middle">小容量・高速検索</text>
<text x="270" y="361" class="small" text-anchor="middle">更新のたびには動かさない</text>
<rect x="715" y="130" width="430" height="260" rx="12" fill="#fbe4d6" stroke="#d8612c" stroke-width="2.5"/>
<text x="930" y="164" class="result" text-anchor="middle" fill="#d8612c">小さな更新差分層</text>
<text x="930" y="205" class="label" text-anchor="middle">ハッシュ表 / 平衡木</text>
<text x="930" y="239" class="label" text-anchor="middle">追加文書の小型索引</text>
<text x="930" y="273" class="label" text-anchor="middle">削除を示す墓石集合</text>
<text x="930" y="332" class="small" text-anchor="middle">更新しやすい</text>
<text x="930" y="361" class="small" text-anchor="middle">一定量まで一時保管</text>
<rect x="510" y="220" width="180" height="80" rx="12" fill="#ffffff" stroke="#24313a" stroke-width="2.5"/>
<text x="600" y="247" class="small" text-anchor="middle">問い合わせ</text>
<text x="600" y="276" class="label" text-anchor="middle">結果を統合</text>
<line x1="485" y1="260" x2="504" y2="260" stroke="#24313a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="715" y1="260" x2="696" y2="260" stroke="#24313a" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="930" y1="408" x2="930" y2="494" stroke="#d8612c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="957" y="451" class="small" text-anchor="start">閾値到達</text>
<rect x="300" y="500" width="600" height="88" rx="12" fill="#dcefe9" stroke="#187c68" stroke-width="2.5"/>
<text x="600" y="529" class="result" text-anchor="middle" fill="#187c68">バックグラウンドで再構築</text>
<text x="600" y="562" class="label" text-anchor="middle">完成後に新しい静的版へ切り替える</text>
<line x1="300" y1="544" x2="205" y2="544" stroke="#187c68" stroke-width="3"/>
<line x1="205" y1="544" x2="205" y2="397" stroke="#187c68" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
