<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Elias–Fanoの分解と復元</title>
  <desc id="desc">値列3、8、9、21、37を上位部と3ビットの下位部へ分解し、上位値と添字の和の位置に1を置く。添字3ではselect結果5から値21を復元する。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#24313a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; fill: #24313a; dominant-baseline: middle; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #60717d; }
      .label { font-size: 18px; }
      .small { font-size: 14px; fill: #60717d; }
      .tiny { font-size: 12px; fill: #60717d; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans JP", monospace; font-size: 18px; font-weight: 650; }
      .number { font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans JP", monospace; font-size: 22px; font-weight: 700; }
      .result { font-size: 22px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fbfaf7"/>
<text x="55" y="46" class="title" text-anchor="start">Elias–Fano：整数を上下に切り、上位部を位置へ変える</text>
<text x="55" y="80" class="subtitle" text-anchor="start">x = [3, 8, 9, 21, 37],  U = 64,  m = 5,  L = 3</text>
<rect x="55" y="112" width="1090" height="278" rx="12" fill="#ffffff" stroke="#c9d2d8" stroke-width="2"/>
<text x="105" y="142" class="small" text-anchor="middle">i</text>
<text x="220" y="142" class="small" text-anchor="middle">x_i</text>
<text x="410" y="142" class="small" text-anchor="middle">上位 h_i = x_i &gt;&gt; 3</text>
<text x="655" y="142" class="small" text-anchor="middle">下位 l_i（3 bit）</text>
<text x="930" y="142" class="small" text-anchor="middle">1を置く位置 h_i+i</text>
<line x1="75" y1="166" x2="1125" y2="166" stroke="#c9d2d8" stroke-width="2"/>
<rect x="75" y="181" width="1050" height="34" rx="5" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="105" y="198" class="mono" text-anchor="middle">0</text>
<text x="220" y="198" class="mono" text-anchor="middle">3</text>
<text x="410" y="198" class="mono" text-anchor="middle">0</text>
<text x="655" y="198" class="mono" text-anchor="middle">011</text>
<text x="930" y="198" class="mono" text-anchor="middle">0</text>
<rect x="75" y="219" width="1050" height="34" rx="5" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="105" y="236" class="mono" text-anchor="middle">1</text>
<text x="220" y="236" class="mono" text-anchor="middle">8</text>
<text x="410" y="236" class="mono" text-anchor="middle">1</text>
<text x="655" y="236" class="mono" text-anchor="middle">000</text>
<text x="930" y="236" class="mono" text-anchor="middle">2</text>
<rect x="75" y="257" width="1050" height="34" rx="5" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="105" y="274" class="mono" text-anchor="middle">2</text>
<text x="220" y="274" class="mono" text-anchor="middle">9</text>
<text x="410" y="274" class="mono" text-anchor="middle">1</text>
<text x="655" y="274" class="mono" text-anchor="middle">001</text>
<text x="930" y="274" class="mono" text-anchor="middle">3</text>
<rect x="75" y="295" width="1050" height="34" rx="5" fill="#fbe4d6" stroke="none" stroke-width="0"/>
<text x="105" y="312" class="mono" text-anchor="middle">3</text>
<text x="220" y="312" class="mono" text-anchor="middle">21</text>
<text x="410" y="312" class="mono" text-anchor="middle">2</text>
<text x="655" y="312" class="mono" text-anchor="middle">101</text>
<text x="930" y="312" class="mono" text-anchor="middle">5</text>
<rect x="75" y="333" width="1050" height="34" rx="5" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="105" y="350" class="mono" text-anchor="middle">4</text>
<text x="220" y="350" class="mono" text-anchor="middle">37</text>
<text x="410" y="350" class="mono" text-anchor="middle">4</text>
<text x="655" y="350" class="mono" text-anchor="middle">101</text>
<text x="930" y="350" class="mono" text-anchor="middle">8</text>
<text x="55" y="426" class="label" text-anchor="start">上位ビット列 H</text>
<text x="55" y="458" class="small" text-anchor="start">位置</text>
<rect x="205" y="458" width="55" height="55" rx="3" fill="#dcecf7" stroke="#c9d2d8" stroke-width="1.5"/>
<text x="232.5" y="486.5" class="number" text-anchor="middle">1</text>
<text x="232.5" y="443" class="tiny" text-anchor="middle">0</text>
<rect x="260" y="458" width="55" height="55" rx="3" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
<text x="287.5" y="486.5" class="number" text-anchor="middle">0</text>
<text x="287.5" y="443" class="tiny" text-anchor="middle">1</text>
<rect x="315" y="458" width="55" height="55" rx="3" fill="#dcecf7" stroke="#c9d2d8" stroke-width="1.5"/>
<text x="342.5" y="486.5" class="number" text-anchor="middle">1</text>
<text x="342.5" y="443" class="tiny" text-anchor="middle">2</text>
<rect x="370" y="458" width="55" height="55" rx="3" fill="#dcecf7" stroke="#c9d2d8" stroke-width="1.5"/>
<text x="397.5" y="486.5" class="number" text-anchor="middle">1</text>
<text x="397.5" y="443" class="tiny" text-anchor="middle">3</text>
<rect x="425" y="458" width="55" height="55" rx="3" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
<text x="452.5" y="486.5" class="number" text-anchor="middle">0</text>
<text x="452.5" y="443" class="tiny" text-anchor="middle">4</text>
<rect x="480" y="458" width="55" height="55" rx="3" fill="#dcecf7" stroke="#c9d2d8" stroke-width="1.5"/>
<text x="507.5" y="486.5" class="number" text-anchor="middle">1</text>
<text x="507.5" y="443" class="tiny" text-anchor="middle">5</text>
<rect x="535" y="458" width="55" height="55" rx="3" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
<text x="562.5" y="486.5" class="number" text-anchor="middle">0</text>
<text x="562.5" y="443" class="tiny" text-anchor="middle">6</text>
<rect x="590" y="458" width="55" height="55" rx="3" fill="#ffffff" stroke="#c9d2d8" stroke-width="1.5"/>
<text x="617.5" y="486.5" class="number" text-anchor="middle">0</text>
<text x="617.5" y="443" class="tiny" text-anchor="middle">7</text>
<rect x="645" y="458" width="55" height="55" rx="3" fill="#dcecf7" stroke="#c9d2d8" stroke-width="1.5"/>
<text x="672.5" y="486.5" class="number" text-anchor="middle">1</text>
<text x="672.5" y="443" class="tiny" text-anchor="middle">8</text>
<text x="730" y="486" class="small" text-anchor="start">1 の位置 = [0, 2, 3, 5, 8]</text>
<line x1="55" y1="548" x2="1145" y2="548" stroke="#c9d2d8" stroke-width="2"/>
<text x="55" y="580" class="label" text-anchor="start">i = 3 の値をランダムアクセス</text>
<rect x="55" y="610" width="1090" height="74" rx="12" fill="#fbe4d6" stroke="#d8612c" stroke-width="2"/>
<text x="82" y="647" class="result" text-anchor="start" fill="#d8612c">select_1(3)=5</text>
<text x="315" y="647" class="result" text-anchor="start">→  h_3=5−3=2</text>
<text x="590" y="647" class="result" text-anchor="start">→  l_3=101 (base 2)=5</text>
<text x="865" y="647" class="result" text-anchor="start" fill="#187c68">→  x_3=2×8+5=21</text>
</svg>
