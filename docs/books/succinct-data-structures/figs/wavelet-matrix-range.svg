<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Wavelet Matrixの区間遷移</title>
  <desc id="desc">値3のビット011に沿って区間0から10を各階層で写す。区間は0から7、3から8、6から10へ変化し、最後の幅4がrankの答えになる。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#24313a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; fill: #24313a; dominant-baseline: middle; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #60717d; }
      .label { font-size: 18px; }
      .small { font-size: 14px; fill: #60717d; }
      .tiny { font-size: 12px; fill: #60717d; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans JP", monospace; font-size: 18px; font-weight: 650; }
      .number { font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans JP", monospace; font-size: 22px; font-weight: 700; }
      .result { font-size: 22px; font-weight: 700; }
