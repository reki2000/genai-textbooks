<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">FM-indexによるanaの後方検索</title>
  <desc id="desc">banana$のBWT上で検索語anaを右からa、n、aの順に追加し、区間を0から7、1から4、5から7、2から4へ絞る。最後の幅2が一致件数になる。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#24313a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; fill: #24313a; dominant-baseline: middle; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #60717d; }
      .label { font-size: 18px; }
      .small { font-size: 14px; fill: #60717d; }
      .tiny { font-size: 12px; fill: #60717d; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans JP", monospace; font-size: 18px; font-weight: 650; }
      .number { font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans JP", monospace; font-size: 22px; font-weight: 700; }
      .result { font-size: 22px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="650" fill="#fbfaf7"/>
<text x="50" y="46" class="title" text-anchor="start">FM-index：検索語を右から足して区間を絞る</text>
<text x="50" y="80" class="subtitle" text-anchor="start">T = banana$,  BWT L = annb$aa,  検索語 = ana</text>
<rect x="50" y="112" width="1100" height="112" rx="12" fill="#ffffff" stroke="#c9d2d8" stroke-width="2"/>
<text x="76" y="142" class="small" text-anchor="start">更新式</text>
<text x="76" y="179" class="mono" text-anchor="start">[l&#x27;, r&#x27;) = [C[c] + rank_c(L,l),  C[c] + rank_c(L,r))</text>
<rect x="65" y="300" width="235" height="154" rx="12" fill="#ffffff" stroke="#24313a" stroke-width="2.5"/>
<text x="182.5" y="327" class="result" text-anchor="middle">空文字列</text>
<text x="182.5" y="371" class="number" text-anchor="middle">[0, 7)</text>
<text x="182.5" y="417" class="small" text-anchor="middle">全7行</text>
<line x1="304" y1="377" x2="334" y2="377" stroke="#24313a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="319" y="266" class="result" text-anchor="middle" fill="#d8612c">a</text>
<rect x="340" y="300" width="235" height="154" rx="12" fill="#dcecf7" stroke="#2463a6" stroke-width="2.5"/>
<text x="457.5" y="327" class="result" text-anchor="middle">a</text>
<text x="457.5" y="371" class="number" text-anchor="middle">[1, 4)</text>
<text x="457.5" y="417" class="small" text-anchor="middle">rank_a: 0 → 3</text>
<line x1="579" y1="377" x2="609" y2="377" stroke="#24313a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="594" y="266" class="result" text-anchor="middle" fill="#d8612c">n</text>
<rect x="615" y="300" width="235" height="154" rx="12" fill="#ebe4f5" stroke="#70539a" stroke-width="2.5"/>
<text x="732.5" y="327" class="result" text-anchor="middle">na</text>
<text x="732.5" y="371" class="number" text-anchor="middle">[5, 7)</text>
<text x="732.5" y="417" class="small" text-anchor="middle">rank_n: 0 → 2</text>
<line x1="854" y1="377" x2="884" y2="377" stroke="#24313a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="869" y="266" class="result" text-anchor="middle" fill="#d8612c">a</text>
<rect x="890" y="300" width="235" height="154" rx="12" fill="#dcefe9" stroke="#187c68" stroke-width="2.5"/>
<text x="1007.5" y="327" class="result" text-anchor="middle">ana</text>
<text x="1007.5" y="371" class="number" text-anchor="middle">[2, 4)</text>
<text x="1007.5" y="417" class="small" text-anchor="middle">rank_a: 1 → 3</text>
<text x="50" y="265" class="label" text-anchor="start" fill="#d8612c">右から読む</text>
<rect x="250" y="515" width="700" height="86" rx="12" fill="#dcefe9" stroke="#187c68" stroke-width="2.5"/>
<text x="600" y="544" class="label" text-anchor="middle">最後の区間幅が一致件数</text>
<text x="600" y="578" class="result" text-anchor="middle" fill="#187c68">4 − 2 = 2件（ana$, anana$）</text>
</svg>
