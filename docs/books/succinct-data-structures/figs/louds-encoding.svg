<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">LOUDSによる木の符号化</title>
  <desc id="desc">8ノードの住所木を幅優先順に番号付けし、各ノードの子の数dを1のd乗と0へ変換する。連結結果は15ビットになる。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#24313a"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; fill: #24313a; dominant-baseline: middle; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #60717d; }
      .label { font-size: 18px; }
      .small { font-size: 14px; fill: #60717d; }
      .tiny { font-size: 12px; fill: #60717d; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans JP", monospace; font-size: 18px; font-weight: 650; }
      .number { font-family: "SFMono-Regular", Consolas, "Liberation Mono", "Noto Sans JP", monospace; font-size: 22px; font-weight: 700; }
      .result { font-size: 22px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="690" fill="#fbfaf7"/>
<text x="50" y="46" class="title" text-anchor="start">LOUDS：幅優先番号の順に「子の数」を並べる</text>
<text x="50" y="80" class="subtitle" text-anchor="start">各ノードの次数 d を 1^d 0 に変換すると、ポインタ木が 2n−1 bit の列になる</text>
<rect x="35" y="105" width="420" height="430" rx="12" fill="#ffffff" stroke="#c9d2d8" stroke-width="2"/>
<text x="55" y="126" class="small" text-anchor="start">住所木（丸内は幅優先番号）</text>
<line x1="230" y1="162" x2="150" y2="223" stroke="#24313a" stroke-width="2.2"/>
<line x1="230" y1="162" x2="340" y2="223" stroke="#24313a" stroke-width="2.2"/>
<line x1="150" y1="267" x2="100" y2="328" stroke="#24313a" stroke-width="2.2"/>
<line x1="150" y1="267" x2="230" y2="328" stroke="#24313a" stroke-width="2.2"/>
<line x1="340" y1="267" x2="340" y2="328" stroke="#24313a" stroke-width="2.2"/>
<line x1="100" y1="372" x2="55" y2="438" stroke="#24313a" stroke-width="2.2"/>
<line x1="100" y1="372" x2="165" y2="438" stroke="#24313a" stroke-width="2.2"/>
<rect x="180" y="118" width="100" height="44" rx="18" fill="#dcecf7" stroke="#2463a6" stroke-width="2.2"/>
<text x="230" y="140" class="small" text-anchor="middle" fill="#24313a">0 日本</text>
<rect x="100" y="223" width="100" height="44" rx="18" fill="#fbe4d6" stroke="#d8612c" stroke-width="2.2"/>
<text x="150" y="245" class="small" text-anchor="middle" fill="#24313a">1 東京都</text>
<rect x="290" y="223" width="100" height="44" rx="18" fill="#dcecf7" stroke="#2463a6" stroke-width="2.2"/>
<text x="340" y="245" class="small" text-anchor="middle" fill="#24313a">2 大阪府</text>
<rect x="50" y="328" width="100" height="44" rx="18" fill="#fbe4d6" stroke="#d8612c" stroke-width="2.2"/>
<text x="100" y="350" class="small" text-anchor="middle" fill="#24313a">3 港区</text>
<rect x="180" y="328" width="100" height="44" rx="18" fill="#fbe4d6" stroke="#d8612c" stroke-width="2.2"/>
<text x="230" y="350" class="small" text-anchor="middle" fill="#24313a">4 新宿区</text>
<rect x="290" y="328" width="100" height="44" rx="18" fill="#dcecf7" stroke="#2463a6" stroke-width="2.2"/>
<text x="340" y="350" class="small" text-anchor="middle" fill="#24313a">5 大阪市</text>
<rect x="5" y="438" width="100" height="44" rx="18" fill="#dcecf7" stroke="#2463a6" stroke-width="2.2"/>
<text x="55" y="460" class="small" text-anchor="middle" fill="#24313a">6 六本木</text>
<rect x="115" y="438" width="100" height="44" rx="18" fill="#dcecf7" stroke="#2463a6" stroke-width="2.2"/>
<text x="165" y="460" class="small" text-anchor="middle" fill="#24313a">7 芝浦</text>
<rect x="485" y="105" width="680" height="430" rx="12" fill="#ffffff" stroke="#c9d2d8" stroke-width="2"/>
<text x="505" y="130" class="small" text-anchor="start">次数を単項符号へ</text>
<text x="575.0" y="172" class="tiny" text-anchor="middle">0</text>
<rect x="515" y="205" width="40" height="40" rx="3" fill="#dcecf7" stroke="#c9d2d8" stroke-width="1.2"/>
<text x="535.0" y="226.0" class="number" text-anchor="middle">1</text>
<rect x="555" y="205" width="40" height="40" rx="3" fill="#dcecf7" stroke="#c9d2d8" stroke-width="1.2"/>
<text x="575.0" y="226.0" class="number" text-anchor="middle">1</text>
<rect x="595" y="205" width="40" height="40" rx="3" fill="#dcecf7" stroke="#c9d2d8" stroke-width="1.2"/>
<text x="615.0" y="226.0" class="number" text-anchor="middle">0</text>
<text x="695.0" y="172" class="tiny" text-anchor="middle">1</text>
<rect x="635" y="205" width="40" height="40" rx="3" fill="#fbe4d6" stroke="#d8612c" stroke-width="2"/>
<text x="655.0" y="226.0" class="number" text-anchor="middle">1</text>
<rect x="675" y="205" width="40" height="40" rx="3" fill="#fbe4d6" stroke="#d8612c" stroke-width="2"/>
<text x="695.0" y="226.0" class="number" text-anchor="middle">1</text>
<rect x="715" y="205" width="40" height="40" rx="3" fill="#fbe4d6" stroke="#d8612c" stroke-width="2"/>
<text x="735.0" y="226.0" class="number" text-anchor="middle">0</text>
<text x="795.0" y="172" class="tiny" text-anchor="middle">2</text>
<rect x="755" y="205" width="40" height="40" rx="3" fill="#dcefe9" stroke="#c9d2d8" stroke-width="1.2"/>
<text x="775.0" y="226.0" class="number" text-anchor="middle">1</text>
<rect x="795" y="205" width="40" height="40" rx="3" fill="#dcefe9" stroke="#c9d2d8" stroke-width="1.2"/>
<text x="815.0" y="226.0" class="number" text-anchor="middle">0</text>
<text x="895.0" y="172" class="tiny" text-anchor="middle">3</text>
<rect x="835" y="205" width="40" height="40" rx="3" fill="#ebe4f5" stroke="#c9d2d8" stroke-width="1.2"/>
<text x="855.0" y="226.0" class="number" text-anchor="middle">1</text>
<rect x="875" y="205" width="40" height="40" rx="3" fill="#ebe4f5" stroke="#c9d2d8" stroke-width="1.2"/>
<text x="895.0" y="226.0" class="number" text-anchor="middle">1</text>
<rect x="915" y="205" width="40" height="40" rx="3" fill="#ebe4f5" stroke="#c9d2d8" stroke-width="1.2"/>
<text x="935.0" y="226.0" class="number" text-anchor="middle">0</text>
<text x="975.0" y="172" class="tiny" text-anchor="middle">4</text>
<rect x="955" y="205" width="40" height="40" rx="3" fill="#f1f3f4" stroke="#c9d2d8" stroke-width="1.2"/>
<text x="975.0" y="226.0" class="number" text-anchor="middle">0</text>
<text x="1015.0" y="172" class="tiny" text-anchor="middle">5</text>
<rect x="995" y="205" width="40" height="40" rx="3" fill="#f1f3f4" stroke="#c9d2d8" stroke-width="1.2"/>
<text x="1015.0" y="226.0" class="number" text-anchor="middle">0</text>
<text x="1055.0" y="172" class="tiny" text-anchor="middle">6</text>
<rect x="1035" y="205" width="40" height="40" rx="3" fill="#f1f3f4" stroke="#c9d2d8" stroke-width="1.2"/>
<text x="1055.0" y="226.0" class="number" text-anchor="middle">0</text>
<text x="1095.0" y="172" class="tiny" text-anchor="middle">7</text>
<rect x="1075" y="205" width="40" height="40" rx="3" fill="#f1f3f4" stroke="#c9d2d8" stroke-width="1.2"/>
<text x="1095.0" y="226.0" class="number" text-anchor="middle">0</text>
<text x="515" y="282" class="mono" text-anchor="start">110 | 110 | 10 | 110 | 0 | 0 | 0 | 0</text>
<rect x="515" y="326" width="610" height="90" rx="12" fill="#fbe4d6" stroke="#d8612c" stroke-width="2"/>
<text x="535" y="350" class="small" text-anchor="start">例：ノード1「東京都」</text>
<text x="535" y="384" class="label" text-anchor="start">子が2個 → 1^2 0 = 110 → 子は幅優先番号3・4</text>
<line x1="745" y1="416" x2="745" y2="470" stroke="#24313a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="610" y="472" width="270" height="50" rx="12" fill="#dcefe9" stroke="#187c68" stroke-width="2"/>
<text x="745" y="497" class="label" text-anchor="middle" fill="#187c68">1 が7個 + 0 が8個 = 15 bit</text>
<rect x="205" y="574" width="790" height="82" rx="12" fill="#ffffff" stroke="#24313a" stroke-width="2.5"/>
<text x="600" y="604" class="result" text-anchor="middle">ポインタを保存しない</text>
<text x="600" y="636" class="label" text-anchor="middle">親子関係は列中の rank / select で復元する</text>
</svg>
