  question: 安さ、安定供給、脱炭素、安全保障を同時に満たすエネルギーミックスは、市場と合意を含めてどう設計できるのか。
  plot: エネルギー政策の責任者になったやる夫が、S+3Eから単一目標と単一電源の全振り案を条件棄却で潰し、需要5点モデルでダックカーブを自力で導く。後半は託送料金の請求書と新電力の収支表を検算し、事業者・立地自治体・消費者の利害交渉を挟みながら、発送電分離、容量市場、FITの卒業まで、ミックスを動かす市場の失敗条件を設計し直す。
  revision_of: energy-policy
