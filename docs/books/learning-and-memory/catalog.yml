documents:
- id: learning-and-memory
  category: thought
  created: '2026-07-26T03:24:01+00:00'
  question: 学びたいことが次々に増えるとき、何を選び、学習の共通原理を自分の現在地へどう較正し、本当に効いたかをどう測るのか。
  plot: 積んだ六十一冊を前に全部覚える方法を求めたやる夫が、忘却、チャンク、熟達者の記憶、脳の可塑性、想起と間隔、対比による一般化をたどる。やがて「自分は視覚型」という説を壊し、事前知識と課題に合わせて学び方を測り直し、知識の隙間を全部追わず探索と活用を配分する学習設計書を組み立てる。
