documents:
- id: learning-and-memory
  category: thought
  created: '2026-07-26T03:24:01+00:00'
  question: 学習法のどこまでが万人に効き、どこからが自分の現在地の問題なのか。自分に合ったやり方は、どうやって見つければいいのか。
  plot: 積んだ六十一冊を前に全部覚える方法を求めたやる夫が、夢で研究者たちに出会い、忘却の機能、チャンク、専門家の記憶の領域固有性、脳の可塑性、対比が生む一般化、練習量の限界をたどる。やがて「自分は視覚型」という説を自分で壊し、実在する個人差が事前知識であることを見つけ、遅れて出る目盛りで自分を測り直す手順を組み立てる。
