documents:
- id: payroll-calculation-v2
  category: society
  created: '2026-08-23T20:43:11+09:00'
  question: 給料日の午前0時までに、12人の異なる事実・制度・時点をどこまで同期し、どこで止めるべきか。
  plot: 共同制作チームの給与データが、映画編集ソフトのような十二本のタイムラインへ誤変換される。映像編集者やる夫とライブ音響技師やらない夫は、同じ素材を別の時間軸で扱う対等な照合代表として、労働発生、承認、締め、支払、制度適用の五本の再生ヘッドを同期させる。午前0時、全トラックを緑にする誘惑に抗い、根拠不足の一本だけを止める。
