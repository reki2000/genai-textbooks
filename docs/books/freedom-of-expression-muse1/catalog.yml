documents:
- id: freedom-of-expression-muse1
  category: thought
  created: '2026-10-28T09:10:00+09:00'
  question: 見たくない表現を消す権利はどこまであるのか。自分の投稿が消されたとき、何が人を守るのか。
  plot: ニュースを読むだけでせり上がる漫画広告に怒ったやる夫が、不快度を点数化する公共表現クリーナーを作り、気になる表現を6枚のケースカードに写し取っていく。だが点数制は戦争を記録した写真と広告を区別できず、差別語の4文を並べ替える演習では、被害の報告こそ消してはいけないと気づく。第7幕、クリーナーはやる夫自身が受けた言葉の報告投稿を削除し、加害側の投稿を残す。異議申立ての不在を自分の身で知ったやる夫は、同じ風刺画の投稿に米国・ドイツ・欧州の物差しを当てる対照実験を経て、終幕で6枚のカードを全部並べ直す。表現の善悪を自動判定する機械は、誰が何を基準に止め、どう争えるかを見えるようにする機械へ作り替えられていく。
  revision_of: freedom-of-expression
  draft: true
  ratings:
    knowledge: 4.0
