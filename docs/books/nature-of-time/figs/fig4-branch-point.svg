<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">図4　点を除くと、直線は2成分・分岐点は3成分</title>
<desc id="desc">分岐点の近傍は開区間と同相でないため、通常の1次元多様体にはならない</desc>

<rect x="0.0" y="0.0" width="760.0" height="390.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図4　点を除くと、直線は2成分・分岐点は3成分</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">分岐点の近傍は開区間と同相でないため、通常の1次元多様体にはならない</text>
<rect x="28.0" y="82.0" width="340.0" height="242.0" rx="8" fill="#ffffff" stroke="#e2e4e3" stroke-width="1"/>
<text x="198.0" y="110.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">実数直線の内部点</text>
<line x1="83.0" y1="190.0" x2="186.0" y2="190.0" stroke="#2a78d6" stroke-width="4" stroke-linecap="round"/>
<line x1="210.0" y1="190.0" x2="313.0" y2="190.0" stroke="#1baf7a" stroke-width="4" stroke-linecap="round"/>
<circle cx="198.0" cy="190.0" r="10.0" fill="#ffffff" stroke="#e34948" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="198.0" y="194.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#e34948" text-anchor="middle">×</text>
<text x="198.0" y="286.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle">点を除く → 2成分</text>
<rect x="392.0" y="82.0" width="340.0" height="242.0" rx="8" fill="#ffffff" stroke="#e2e4e3" stroke-width="1"/>
<text x="562.0" y="110.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#eb6834" text-anchor="middle">樹の分岐点</text>
<line x1="447.0" y1="190.0" x2="550.0" y2="190.0" stroke="#2a78d6" stroke-width="4" stroke-linecap="round"/>
<line x1="574.0" y1="182.0" x2="677.0" y2="140.0" stroke="#eb6834" stroke-width="4" stroke-linecap="round"/>
<line x1="574.0" y1="198.0" x2="677.0" y2="240.0" stroke="#1baf7a" stroke-width="4" stroke-linecap="round"/>
<circle cx="562.0" cy="190.0" r="10.0" fill="#ffffff" stroke="#e34948" stroke-width="2.5" stroke-dasharray="3 3"/>
<text x="562.0" y="194.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#e34948" text-anchor="middle">×</text>
<text x="562.0" y="286.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="14" font-weight="700" fill="#e34948" text-anchor="middle">点を除く → 3成分</text>
<text x="380.0" y="359.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">成分数は同相写像で変わらない：3成分の近傍を開区間へ変形できない。</text>
</svg>
