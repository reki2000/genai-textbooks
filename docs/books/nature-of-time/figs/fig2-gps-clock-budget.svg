<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">図2　GPS時計のずれは、速度と重力の差し引き</title>
<desc id="desc">1日あたり：速度で −7.2 μs、弱い重力で +46 μs、合計は約 +38 μs</desc>

<rect x="0.0" y="0.0" width="760.0" height="390.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図2　GPS時計のずれは、速度と重力の差し引き</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">1日あたり：速度で −7.2 μs、弱い重力で +46 μs、合計は約 +38 μs</text>
<line x1="90.0" y1="220.0" x2="670.0" y2="220.0" stroke="#7b7a75" stroke-width="1.5" stroke-linecap="round"/>
<line x1="380.0" y1="126.0" x2="380.0" y2="308.0" stroke="#0b0b0b" stroke-width="1.8" stroke-linecap="round"/>
<text x="380.0" y="333.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle">地上時計との差 0</text>
<rect x="351.2" y="150.0" width="28.8" height="45.0" rx="5" fill="#eb6834" stroke="#eb6834" stroke-width="1" opacity="0.85"/>
<text x="341.2" y="178.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#eb6834" text-anchor="end">速度  −7.2 μs</text>
<rect x="380.0" y="225.0" width="184.0" height="45.0" rx="5" fill="#2a78d6" stroke="#2a78d6" stroke-width="1" opacity="0.85"/>
<text x="574.0" y="253.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="start">重力  +46 μs</text>
<line x1="532.0" y1="113.0" x2="532.0" y2="294.0" stroke="#1baf7a" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="532.0" y="103.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#1baf7a" text-anchor="middle">差し引き 約 +38 μs/日</text>
<rect x="205.0" y="344.0" width="350.0" height="36.0" rx="8" fill="#ffffff" stroke="#e34948" stroke-width="1.6"/>
<text x="380.0" y="366.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">未補正なら測位誤差は約11 km/日</text>
