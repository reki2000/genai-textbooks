<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">図3　記録できるのは、現在 P へ因果信号が届く側</title>
<desc id="desc">過去の出来事は P に痕跡を作れるが、未来の出来事から通常の信号は P へ戻れない</desc>
<defs><marker id="arw-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="arw-1baf7a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/></marker><marker id="arw-e34948" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e34948"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="430.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図3　記録できるのは、現在 P へ因果信号が届く側</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">過去の出来事は P に痕跡を作れるが、未来の出来事から通常の信号は P へ戻れない</text>
<path d="M380,236 L205,70 L555,70 Z" fill="#edf9f4" stroke="#1baf7a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
<path d="M380,236 L205,398 L555,398 Z" fill="#eef6ff" stroke="#2a78d6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
<circle cx="380.0" cy="236.0" r="8.0" fill="#0b0b0b" stroke="none" stroke-width="1"/>
<text x="394.0" y="241.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start">現在の出来事 P</text>
<text x="380.0" y="94.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#1baf7a" text-anchor="middle">未来光円錐</text>
<text x="380.0" y="386.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">過去光円錐</text>
<circle cx="300.0" cy="336.0" r="7.0" fill="#2a78d6" stroke="none" stroke-width="1"/>
<text x="288.0" y="341.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#2a78d6" text-anchor="end">過去の出来事</text>
<line x1="307.0" y1="329.0" x2="372.0" y2="244.0" stroke="#2a78d6" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arw-2a78d6)"/>
<text x="286.0" y="275.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#2a78d6" text-anchor="middle">信号 → 現在の痕跡</text>
<circle cx="470.0" cy="126.0" r="7.0" fill="#1baf7a" stroke="none" stroke-width="1"/>
<text x="482.0" y="131.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#1baf7a" text-anchor="start">未来の出来事</text>
<line x1="388.0" y1="228.0" x2="463.0" y2="133.0" stroke="#1baf7a" stroke-width="2.3" stroke-linecap="round" marker-end="url(#arw-1baf7a)"/>
<line x1="458.0" y1="138.0" x2="398.0" y2="218.0" stroke="#e34948" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arw-e34948)" stroke-dasharray="5 4"/>
<line x1="418.0" y1="177.0" x2="442.0" y2="201.0" stroke="#e34948" stroke-width="3" stroke-linecap="round"/>
<line x1="442.0" y1="177.0" x2="418.0" y2="201.0" stroke="#e34948" stroke-width="3" stroke-linecap="round"/>
<text x="534.0" y="195.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#e34948" text-anchor="middle">未来 → P は不可</text>
<text x="380.0" y="419.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">「未来が存在するか」と「未来から情報を読めるか」は別の問い。</text>
</svg>
