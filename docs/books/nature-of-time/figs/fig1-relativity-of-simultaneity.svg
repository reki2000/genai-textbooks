<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">図1　列車内の「同時」は、地上では同時でない</title>
<desc id="desc">同じ三つの出来事でも、列車系では両端へ同時到着、地上系では後端へ先に到着する</desc>
<defs><marker id="arw-eb6834" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="arw-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect x="0.0" y="0.0" width="760.0" height="430.0" rx="10" fill="#fcfcfb" stroke="#e2e4e3" stroke-width="1"/>
<text x="24.0" y="32.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="16" font-weight="700" fill="#0b0b0b" text-anchor="start">図1　列車内の「同時」は、地上では同時でない</text>
<text x="24.0" y="54.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">同じ三つの出来事でも、列車系では両端へ同時到着、地上系では後端へ先に到着する</text>
<rect x="24.0" y="82.0" width="344.0" height="284.0" rx="8" fill="#ffffff" stroke="#e2e4e3" stroke-width="1"/>
<text x="196.0" y="108.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">列車内の座標</text>
<rect x="89.0" y="175.0" width="214.0" height="90.0" rx="8" fill="#f3f8ff" stroke="#2a78d6" stroke-width="1.8"/>
<circle cx="196.0" cy="220.0" r="7.0" fill="#eb6834" stroke="none" stroke-width="1"/>
<line x1="188.0" y1="220.0" x2="93.0" y2="220.0" stroke="#eb6834" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arw-eb6834)"/>
<line x1="204.0" y1="220.0" x2="299.0" y2="220.0" stroke="#eb6834" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arw-eb6834)"/>
<circle cx="89.0" cy="220.0" r="6.0" fill="#1baf7a" stroke="none" stroke-width="1"/>
<circle cx="303.0" cy="220.0" r="6.0" fill="#1baf7a" stroke="none" stroke-width="1"/>
<text x="196.0" y="292.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#1baf7a" text-anchor="middle">両端：同時に到着</text>
<text x="89.0" y="247.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">後端</text>
<text x="303.0" y="247.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">前端</text>
<text x="196.0" y="202.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#eb6834" text-anchor="middle">発光</text>
<rect x="392.0" y="82.0" width="344.0" height="284.0" rx="8" fill="#ffffff" stroke="#e2e4e3" stroke-width="1"/>
<text x="564.0" y="108.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">地上の座標（列車は右へ）</text>
<rect x="480.0" y="175.0" width="214.0" height="90.0" rx="8" fill="#f3f8ff" stroke="#2a78d6" stroke-width="1.8"/>
<line x1="512.0" y1="142.0" x2="617.0" y2="142.0" stroke="#52514e" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arw-52514e)"/>
<text x="630.0" y="146.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="13" font-weight="700" fill="#52514e" text-anchor="start">v</text>
<circle cx="566.0" cy="220.0" r="7.0" fill="#eb6834" stroke="none" stroke-width="1"/>
<line x1="558.0" y1="220.0" x2="484.0" y2="220.0" stroke="#eb6834" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arw-eb6834)"/>
<line x1="574.0" y1="220.0" x2="666.0" y2="220.0" stroke="#eb6834" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arw-eb6834)"/>
<circle cx="480.0" cy="220.0" r="6.0" fill="#e34948" stroke="none" stroke-width="1"/>
<circle cx="694.0" cy="220.0" r="6.0" fill="#ffffff" stroke="#7b7a75" stroke-width="2"/>
<text x="480.0" y="292.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#e34948" text-anchor="middle">後端：先に到着</text>
<text x="694.0" y="292.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#52514e" text-anchor="middle">前端：後で到着</text>
<text x="480.0" y="247.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">後端</text>
<text x="694.0" y="247.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#52514e" text-anchor="middle">前端</text>
<text x="566.0" y="202.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#eb6834" text-anchor="middle">発光</text>
<text x="380.0" y="402.0" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',system-ui,sans-serif" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">光速はどちらの座標でも c。それでも離れた出来事の同時性は運動状態に依存する。</text>
</svg>
