<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" role="img" aria-labelledby="title"><title id="title">共通中心50%から同じ量を借りても、2台のAは0%から41.7%へ、100台のDは4.5%までしか動かない</title><rect x="0" y="0" width="540" height="440" fill="#ffffff"/><text x="140" y="44" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#1c1c1c">観測</text><text x="340" y="44" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#1c1c1c">借りた後</text><text x="240" y="110" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="13" text-anchor="middle" fill="#6b6b6b">B・C は 50% のまま（共通中心も 50%）</text><line x1="140" y1="370" x2="340" y2="161.7" stroke="#e07b1f" stroke-width="3" stroke-linecap="round"/><circle cx="140" cy="370" r="7" fill="#e07b1f" stroke="#ffffff" stroke-width="1.5"/><circle cx="340" cy="161.7" r="7" fill="#1f6fd0" stroke="#ffffff" stroke-width="1.5"/><text x="356" y="166.7" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#1c1c1c">A 0/2：41.7%</text><line x1="140" y1="120" x2="340" y2="120" stroke="#8d8d8d" stroke-width="1.4" stroke-linecap="round"/><circle cx="140" cy="120" r="7" fill="#8d8d8d" stroke="#ffffff" stroke-width="1.5"/><circle cx="340" cy="120" r="7" fill="#8d8d8d" stroke="#ffffff" stroke-width="1.5"/><line x1="140" y1="120" x2="340" y2="120" stroke="#8d8d8d" stroke-width="1.4" stroke-linecap="round"/><circle cx="140" cy="120" r="7" fill="#8d8d8d" stroke="#ffffff" stroke-width="1.5"/><circle cx="340" cy="120" r="7" fill="#8d8d8d" stroke="#ffffff" stroke-width="1.5"/><line x1="140" y1="370" x2="340" y2="347.3" stroke="#e07b1f" stroke-width="3" stroke-linecap="round"/><circle cx="140" cy="370" r="7" fill="#e07b1f" stroke="#ffffff" stroke-width="1.5"/><circle cx="340" cy="347.3" r="7" fill="#1f6fd0" stroke="#ffffff" stroke-width="1.5"/><text x="356" y="352.3" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#1c1c1c">D 0/100：4.5%</text><text x="128" y="375" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" font-weight="700" fill="#1c1c1c">A・D 0%</text><text x="128" y="125" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" fill="#6b6b6b">50%</text><text x="24" y="420" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="13" text-anchor="start" fill="#6b6b6b">太い2本が同じ0件。分母が小さいほど強く引き寄せられる</text></svg>
