<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" role="img" aria-labelledby="title desc"><title id="title">同じ0件でも、分母が違えば縮む量が違う</title><desc id="desc">同じ0件でも、分母が違えば縮む量が違う</desc><defs><marker id="ahf8d8d8d9_0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9.0" markerHeight="9.0" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8d8d8d"/></marker></defs><rect x="0" y="0" width="760" height="328" fill="#ffffff"/><text x="52" y="32" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700">小さい島ほど本土の灯台を頼り、大きい島は自前の地図を使う</text><text x="52" y="54" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">共通中心50%・強さ10の情報を、どの地域へも同じだけ貸す</text><line x1="571.67" y1="88" x2="571.67" y2="260" stroke="#8d8d8d" stroke-width="1.8" stroke-linecap="round" opacity="1" stroke-dasharray="6 4"/><text x="571.67" y="82" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">共通中心 50%</text><text x="222" y="120" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="end" font-weight="400">A地域　0/2</text><line x1="230.0" y1="116" x2="514.72" y2="116" stroke="#8d8d8d" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahf8d8d8d9_0)"/><circle cx="230.0" cy="116" r="6.5" fill="#e07b1f" stroke="#e07b1f" stroke-width="1.0" opacity="1"/><circle cx="514.72" cy="116" r="6.5" fill="#1f6fd0" stroke="#1f6fd0" stroke-width="1.0" opacity="1"/><text x="526.72" y="120" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1f6fd0" text-anchor="start" font-weight="700">41.7%</text><text x="576.72" y="120" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">二台だけなので大きく縮む</text><text x="222" y="156" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="end" font-weight="400">B地域　5/10</text><circle cx="571.67" cy="152" r="6.5" fill="#e07b1f" stroke="#e07b1f" stroke-width="1.0" opacity="1"/><circle cx="571.67" cy="152" r="6.5" fill="#1f6fd0" stroke="#1f6fd0" stroke-width="1.0" opacity="1"/><text x="583.67" y="156" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1f6fd0" text-anchor="start" font-weight="700">50.0%</text><text x="222" y="192" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="end" font-weight="400">C地域　50/100</text><circle cx="571.67" cy="188" r="6.5" fill="#e07b1f" stroke="#e07b1f" stroke-width="1.0" opacity="1"/><circle cx="571.67" cy="188" r="6.5" fill="#1f6fd0" stroke="#1f6fd0" stroke-width="1.0" opacity="1"/><text x="583.67" y="192" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1f6fd0" text-anchor="start" font-weight="700">50.0%</text><text x="633.67" y="192" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">百台あるので動かない</text><text x="222" y="228" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="end" font-weight="400">D地域　0/100</text><line x1="230.0" y1="224" x2="261.06" y2="224" stroke="#8d8d8d" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ahf8d8d8d9_0)"/><circle cx="230.0" cy="224" r="6.5" fill="#e07b1f" stroke="#e07b1f" stroke-width="1.0" opacity="1"/><circle cx="261.06" cy="224" r="6.5" fill="#1f6fd0" stroke="#1f6fd0" stroke-width="1.0" opacity="1"/><text x="273.06" y="228" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1f6fd0" text-anchor="start" font-weight="700">4.5%</text><text x="323.06" y="228" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">同じ0件でも百台ぶんの証拠がある</text><line x1="220" y1="268" x2="652" y2="268" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><line x1="230.0" y1="268" x2="230.0" y2="273" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="230.0" y="286" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">0</text><line x1="366.67" y1="268" x2="366.67" y2="273" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="366.67" y="286" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">20%</text><line x1="503.33" y1="268" x2="503.33" y2="273" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="503.33" y="286" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">40%</text><line x1="640.0" y1="268" x2="640.0" y2="273" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="butt" opacity="1"/><text x="640.0" y="286" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">60%</text><text x="436" y="296" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">故障率</text><text x="52" y="88" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#e07b1f" text-anchor="start" font-weight="700">橙＝観測した率</text><text x="52" y="104" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#1f6fd0" text-anchor="start" font-weight="700">青＝借りた後の率</text><text x="52" y="320" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400">縮む量は観測率の見た目でなく、分母と群間のばらつきで決まる</text></svg>
