<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" role="img" aria-labelledby="title"><title id="title">同じ点群でも、1,000円単位なら第一主成分は45度、円単位ならほぼ水平に倒れる</title><rect x="0" y="0" width="460" height="460" fill="#ffffff"/><line x1="70" y1="400" x2="434" y2="36" stroke="#1f6fd0" stroke-width="3" stroke-linecap="round"/><line x1="70" y1="218" x2="434" y2="218" stroke="#cf3b2d" stroke-width="3" stroke-dasharray="8 5" stroke-linecap="round"/><circle cx="112" cy="288" r="8" fill="#1c1c1c" stroke="#ffffff" stroke-width="1.5"/><circle cx="182" cy="358" r="8" fill="#1c1c1c" stroke="#ffffff" stroke-width="1.5"/><circle cx="182" cy="218" r="8" fill="#1c1c1c" stroke="#ffffff" stroke-width="1.5"/><circle cx="252" cy="288" r="8" fill="#1c1c1c" stroke="#ffffff" stroke-width="1.5"/><circle cx="252" cy="148" r="8" fill="#1c1c1c" stroke="#ffffff" stroke-width="1.5"/><circle cx="322" cy="218" r="8" fill="#1c1c1c" stroke="#ffffff" stroke-width="1.5"/><circle cx="322" cy="78" r="8" fill="#1c1c1c" stroke="#ffffff" stroke-width="1.5"/><circle cx="392" cy="148" r="8" fill="#1c1c1c" stroke="#ffffff" stroke-width="1.5"/><text x="430" y="58" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="end" font-weight="700" fill="#1f6fd0">1,000円単位：45度</text><text x="434" y="240" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="end" font-weight="700" fill="#cf3b2d">円単位：ほぼ0度</text><text x="252" y="440" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" fill="#6b6b6b">価格</text><text x="24" y="36" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="start" fill="#6b6b6b">満足度</text></svg>
