<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="title"><title id="title">揺れの大きい第一センサーの5.0度は軽く、手持ち計の0.5度は重く効き、更新後は0.6度</title><rect x="0" y="0" width="600" height="360" fill="#ffffff"/><line x1="210" y1="50" x2="210" y2="320" stroke="#8d8d8d" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round"/><text x="150" y="75" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="end" fill="#6b6b6b">予測</text><line x1="167.5" y1="70" x2="257.5" y2="70" stroke="#8d8d8d" stroke-width="5.388888888888889" stroke-linecap="round"/><circle cx="212.5" cy="70" r="6" fill="#8d8d8d" stroke="#ffffff" stroke-width="1.5"/><text x="265.5" y="75" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" fill="#6b6b6b">0.05度</text><text x="150" y="127" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="end" fill="#1c1c1c">第一センサー</text><line x1="365" y1="122" x2="555" y2="122" stroke="#1f6fd0" stroke-width="3.3421052631578947" stroke-linecap="round"/><circle cx="460" cy="122" r="6" fill="#1f6fd0" stroke="#ffffff" stroke-width="1.5"/><text x="563" y="127" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" fill="#6b6b6b">5度</text><text x="150" y="179" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="end" fill="#1c1c1c">第二センサー</text><line x1="195" y1="174" x2="265" y2="174" stroke="#1f6fd0" stroke-width="6.5" stroke-linecap="round"/><circle cx="230" cy="174" r="6" fill="#1f6fd0" stroke="#ffffff" stroke-width="1.5"/><text x="273" y="179" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" fill="#6b6b6b">0.4度</text><text x="150" y="231" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="end" fill="#1c1c1c">手持ち計</text><line x1="217.5" y1="226" x2="252.5" y2="226" stroke="#1f6fd0" stroke-width="11.5" stroke-linecap="round"/><circle cx="235" cy="226" r="6" fill="#1f6fd0" stroke="#ffffff" stroke-width="1.5"/><text x="260.5" y="231" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" fill="#6b6b6b">0.5度</text><text x="150" y="305" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="end" font-weight="700" fill="#e07b1f">更新後</text><line x1="217.5" y1="300" x2="262.5" y2="300" stroke="#e07b1f" stroke-width="4" stroke-linecap="round"/><circle cx="240" cy="300" r="8" fill="#e07b1f" stroke="#ffffff" stroke-width="2"/><text x="270.5" y="305" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#e07b1f">0.6度</text><line x1="160" y1="272" x2="580" y2="272" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><text x="370" y="346" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="13" text-anchor="middle" fill="#6b6b6b">横棒が細く長いほど揺れが大きい（重みが軽い）</text></svg>
