<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" role="img" aria-labelledby="title desc"><title id="title">層の中では更新が低いのに、合計では更新が高く見える</title><desc id="desc">層の中では更新が低いのに、合計では更新が高く見える</desc><rect x="0" y="0" width="760" height="336" fill="#ffffff"/><text x="52" y="32" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700">更新群へ故障しやすい旧型が多く入った構成差が、向きを反転させる</text><text x="52" y="54" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="start" font-weight="400">幅が台数、高さが故障率（面積が故障台数）</text><text x="130" y="78" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1c1c1c" text-anchor="start" font-weight="700">更新群（100台）</text><rect x="130" y="246.0" width="26.0" height="30.0" rx="0" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" opacity="1"/><text x="143.0" y="238.0" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#1f6fd0" text-anchor="middle" font-weight="700">10%</text><text x="143.0" y="292" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">新型 10台</text><rect x="156.0" y="156.0" width="234.0" height="120.0" rx="0" fill="#f2f2f2" stroke="#8d8d8d" stroke-width="1.8" opacity="1"/><text x="273.0" y="148.0" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle" font-weight="700">40%</text><text x="273.0" y="292" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" font-weight="400">旧型 90台</text><line x1="130" y1="165.0" x2="390" y2="165.0" stroke="#cf3b2d" stroke-width="2.4" stroke-linecap="round" opacity="1"/><text x="260" y="316" fon