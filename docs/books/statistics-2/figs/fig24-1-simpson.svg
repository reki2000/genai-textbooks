<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-labelledby="title"><title id="title">新型でも旧型でも更新群が10ポイント低いのに、合計では更新37%対未更新23%で逆転する</title><rect x="0" y="0" width="520" height="440" fill="#ffffff"/><text x="170" y="44" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#1c1c1c">更新群</text><line x1="170" y1="380" x2="170" y2="80" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><text x="370" y="44" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#1c1c1c">未更新群</text><line x1="370" y1="380" x2="370" y2="80" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><line x1="170" y1="330" x2="370" y2="280" stroke="#1f6fd0" stroke-width="2.4" stroke-linecap="round"/><circle cx="170" cy="330" r="7" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.6"/><text x="140" y="335" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" fill="#1f6fd0">10%（10台）</text><circle cx="370" cy="280" r="20.9" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.6"/><text x="400" y="285" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" fill="#1f6fd0">20%（90台）</text><text x="270" y="295" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">新型：上がる</text><text x="270" y="295" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#1f6fd0">新型：上がる</text><line x1="170" y1="180" x2="370" y2="130" stroke="#6b6b6b" stroke-width="2.4" stroke-linecap="round"/><circle cx="170" cy="180" r="20.9" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.6"/><text x="140" y="185" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" fill="#6b6b6b">40%（90台）</text><circle cx="370" cy="130" r="7" fill="#f2f2f2" stroke="#6b6b6b" stroke-width="1.6"/><text x="400" y="135" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" fill="#6b6b6b">50%（10台）</text><text x="270" y="145" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">旧型：上がる</text><text x="270" y="145" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#6b6b6b">旧型：上がる</text><line x1="170" y1="195" x2="370" y2="265" stroke="#cf3b2d" stroke-width="3.5" stroke-dasharray="8 5" stroke-linecap="round"/><text x="270" y="256" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">合計：下がる</text><text x="270" y="256" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#cf3b2d">合計：下がる</text><text x="140" y="219" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="end" font-weight="700" fill="#cf3b2d">37%</text><text x="382" y="270" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#cf3b2d">23%</text><text x="470" y="385" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="13" text-anchor="end" fill="#6b6b6b">0%</text><text x="470" y="235" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="13" text-anchor="end" fill="#6b6b6b">30%</text><text x="470" y="85" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="13" text-anchor="end" fill="#6b6b6b">60%</text><text x="24" y="424" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="13" text-anchor="start" fill="#6b6b6b">縦：故障率　丸の大きさ：台数</text></svg>
