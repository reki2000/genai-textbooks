  question: 周辺の数字が同じ二店舗、空欄の混じる停止ログ、偏って届いた更新。作られ方の込み入ったデータから、どこまで言えるのか。
  plot: 発売準備から段階発売へ進む恐竜ロボットを舞台に、やる夫は同時分布・収束・推定と検定の理論から、多変量・時系列・欠測と生存時間・模型選択と予測、ベイズや因果ダイアグラムまで含む「全部入りの鞄」を組み立てる。後半はやらない夫がわざと地雷を置き、やる夫が止める側に回る。
