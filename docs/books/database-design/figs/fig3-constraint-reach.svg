<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">宣言的制約は1回の検査で見る範囲が広がるほど強く、行またぎ・経路またぎには届かない</title><desc id="desc">宣言的制約は1回の検査で見る範囲が広がるほど強く、行またぎ・経路またぎには届かない</desc><defs><marker id="ah6b6b6b9_0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9.0" markerHeight="9.0" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/></marker></defs><rect x="0" y="0" width="760" height="380" fill="#ffffff"/><text x="318.0" y="44" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400">1行の中</text><line x1="318.0" y1="70" x2="318.0" y2="76" stroke="#6b6b6b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="406.0" y="62" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400">同じ表の行どうし</text><line x1="406.0" y1="70" x2="406.0" y2="76" stroke="#6b6b6b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="494.0" y="44" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400">行の組（期間の重なり）</text><line x1="494.0" y1="70" x2="494.0" y2="76" stroke="#6b6b6b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="582.0" y="62" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400">2つの表のあいだ</text><line x1="582.0" y1="70" x2="582.0" y2="76" stroke="#6b6b6b" stroke-width="1" stroke-linecap="round" opacity="1"/><text x="670.0" y="44" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle" font-weight="400">表全体・経路全体</text><line x1="670.0" y1="70" x2="670.0" y2="76" stroke="#6b6b6b" stroke-width="1" stroke-linecap="round" opacity="1"/><line x1="230" y1="76" x2="706" y2="76" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ah6b6b6b9_0)"/><rect x="230" y="87" width="88.0" height="26" rx="0" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.6" opacity="1"/><text x="222" y="105" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#1c1c1c" text-anchor="end" font-weight="400">CHECK・NOT NULL</text><rect x="230" y="123" width="176.0" height="26" rx="0" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.6" opacity="1"/><text x="222" y="141" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#1c1c1c" text-anchor="end" font-weight="400">主キー・UNIQUE</text><rect x="230" y="159" width="176.0" height="26" rx="0" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.6" opacity="1"/><text x="222" y="177" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#1c1c1c" text-anchor="end" font-weight="400">部分一意インデックス</text><text x="416.0" y="177" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400">条件を満たす行だけ</text><rect x="230" y="195" width="264.0" height="26" rx="0" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.6" opacity="1"/><text x="222" y="213" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#1c1c1c" text-anchor="end" font-weight="400">排他制約</text><rect x="230" y="231" width="352.0" height="26" rx="0" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.6" opacity="1"/><text x="222" y="249" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#1c1c1c" text-anchor="end" font-weight="400">外部キー</text><rect x="230" y="269" width="440.0" height="26" rx="0" fill="#f2f2f2" stroke="#8d8d8d" stroke-width="1.4" opacity="1" stroke-dasharray="5 4"/>