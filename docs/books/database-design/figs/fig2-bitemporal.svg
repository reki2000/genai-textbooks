<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" role="img" aria-labelledby="title"><title id="title">6月25日より前に聞くと5月分は250,000円、後に聞くと265,000円</title><rect x="0" y="0" width="520" height="500" fill="#ffffff"/><rect x="90" y="70" width="390" height="330" fill="#f2f2f2" stroke="none" stroke-width="1.2"/><rect x="220" y="70" width="260" height="132" fill="#e6eefb" stroke="none" stroke-width="1.2"/><line x1="220" y1="70" x2="220" y2="202" stroke="#1f6fd0" stroke-width="1.6" stroke-linecap="round"/><line x1="220" y1="202" x2="480" y2="202" stroke="#1f6fd0" stroke-width="2.4" stroke-linecap="round"/><text x="408.5" y="114" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#1f6fd0">265,000円</text><text x="408.5" y="356" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#6b6b6b">250,000円</text><text x="148.5" y="114" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="18" text-anchor="middle" font-weight="700" fill="#6b6b6b">250,000円</text><text x="476" y="192" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" fill="#1f6fd0">6月25日：遡及を知る</text><line x1="90" y1="400" x2="480" y2="400" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><line x1="90" y1="400" x2="90" y2="70" stroke="#8d8d8d" stroke-width="1.2" stroke-linecap="round"/><text x="90" y="422" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">2月</text><text x="155" y="422" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">3月</text><text x="220" y="422" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">4月</text><text x="285" y="422" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">5月</text><text x="350" y="422" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">6月</text><text x="415" y="422" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">7月</text><text x="480" y="422" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="middle" fill="#6b6b6b">8月</text><text x="82" y="405" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" fill="#6b6b6b">5月</text><text x="82" y="295" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" fill="#6b6b6b">6月</text><text x="82" y="185" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" fill="#6b6b6b">7月</text><text x="82" y="75" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="end" fill="#6b6b6b">8月</text><text x="285" y="466" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" fill="#6b6b6b">有効時間（現実にいつ真実か）</text><text x="24" y="40" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="start" fill="#6b6b6b">システム時間（DBがいつそう信じたか）</text><line x1="317.5" y1="400" x2="317.5" y2="70" stroke="#e07b1f" stroke-width="2.4" stroke-dasharray="6 4" stroke-linecap="round"/><circle cx="317.5" cy="312" r="8" fill="#e07b1f" stroke="#ffffff" stroke-width="2"/><circle cx="291.5" cy="312" r="13" fill="#e07b1f" stroke="#ffffff" stroke-width="2"/><text x="291.5" y="317.5" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff">1</text><circle cx="317.5" cy="147" r="8" fill="#e07b1f" stroke="#ffffff" stroke-width="2"/><circle cx="291.5" cy="147" r="13" fill="#e07b1f" stroke="#ffffff" stroke-width="2"/><text x="291.5" y="152.5" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="15" text-anchor="middle" font-weight="700" fill="#ffffff">2</text><text x="331.5" y="317" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#e07b1f">5月25日に聞く</text><text x="331.5" y="152" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#e07b1f">いま聞く</text><rect x="102" y="224" width="4" height="42.8" fill="#e07b1f" stroke="none" stroke-width="1.2"/><text x="114" y="240" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">同じ5月分でも</text><text x="114" y="262" font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="16" text-anchor="start" font-weight="700" fill="#1c1c1c">聞いた時点で答えが違う</text></svg>
