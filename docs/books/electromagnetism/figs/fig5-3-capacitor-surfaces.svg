ill="#1f6fd0" text-anchor="end" font-weight="400">電場が増える</text><rect x="250" y="70" width="360" height="230" rx="0" fill="none" stroke="#1c1c1c" stroke-width="1.6" opacity="1" stroke-dasharray="7 5"/><text x="250" y="52" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700">閉曲線 C</text><line x1="430" y1="70" x2="500" y2="70" stroke="#1c1c1c" stroke-width="2.0" stroke-linecap="round" marker-end="url(#ahf1c1c1c9_0)"/><path d="M 314 185 A 16 95 0 1 0 346 185 A 16 95 0 1 0 314 185" fill="#e6eefb" stroke="#1f6fd0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/><text x="330" y="316" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#1f6fd0" text-anchor="middle" font-weight="700">面1：伝導電流 I が貫く</text><path d="M 430 78 C 560 84, 596 130, 596 185 C 596 244, 552 288, 470 294" fill="none" stroke="#e07b1f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="6 4"/><text x="596" y="316" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#e07b1f" text-anchor="end" font-weight="700">面2：変位電流が貫く</text><text x="120" y="160" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400">導線</text><text x="120" y="340" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#1c1c1c" text-anchor="start" font-weight="700">どちらの面でも磁場の循環は同じ</text></svg>
