<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">磁場中の正電荷への力は、速度と磁場の両方に垂直で、速さは変えない</title><desc id="desc">磁場中の正電荷への力は、速度と磁場の両方に垂直で、速さは変えない</desc><defs><marker id="ahf1f6fd07_69" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.69" markerHeight="7.69" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6fd0"/></marker><marker id="ahfe07b1f7_69" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.69" markerHeight="7.69" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e07b1f"/></marker><marker id="ahf1c1c1c5_88" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.88" markerHeight="5.88" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1c1c1c"/></marker></defs><rect x="0" y="0" width="760" height="330" fill="#ffffff"/><line x1="530" y1="245" x2="630" y2="95" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><line x1="350" y1="95" x2="630" y2="95" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="round" opacity="1" stroke-dasharray="5 4"/><line x1="250" y1="245" x2="530" y2="245" stroke="#1f6fd0" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ahf1f6fd07_69)"/><line x1="250" y1="245" x2="350" y2="95" stroke="#e07b1f" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ahfe07b1f7_69)"/><line x1="250" y1="245" x2="250" y2="50" stroke="#1c1c1c" stroke-width="3.4" stroke-linecap="round" marker-end="url(#ahf1c1c1c5_88)"/><path d="M 268 245 V 227 H 250" fill="none" stroke="#1c1c1c" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><circle cx="250" cy="245" r="15" fill="#ffffff" stroke="#e07b1f" stroke-width="1.8" opacity="1"/><text x="250" y="250" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#1c1c1c" text-anchor="middle" font-weight="700">q</text><text x="542" y="250" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1f6fd0" text-anchor="start" font-weight="700">v 速度</text><text x="358" y="79" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#e07b1f" text-anchor="start" font-weight="700">B 磁場</text><text x="262" y="63" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700">F 力</text><text x="400" y="49" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#1c1c1c" text-anchor="start" font-weight="700">F は v と B の両方に垂直</text><text x="400" y="73" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400">力と速度も垂直なので、速さは変わらない</text><text x="250" y="297" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400">正電荷の場合。負電荷では力は逆向き</text></svg>
