acity="1"/><line x1="371" y1="307" x2="389" y2="307" stroke="#1c1c1c" stroke-width="2.0" stroke-linecap="round" marker-end="url(#ahf1c1c1c9_0)"/><circle cx="268" cy="195" r="15" fill="#ffffff" stroke="#1c1c1c" stroke-width="1.3" opacity="1"/><line x1="268" y1="186" x2="268" y2="204" stroke="#1c1c1c" stroke-width="2.0" stroke-linecap="round" marker-end="url(#ahf1c1c1c9_0)"/><circle cx="380" cy="195" r="24" fill="#e6eefb" stroke="#1f6fd0" stroke-width="2.0" opacity="1"/><circle cx="380" cy="195" r="5" fill="#1f6fd0" stroke="#1f6fd0" stroke-width="0" opacity="1"/><text x="120" y="60" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="14" fill="#e07b1f" text-anchor="start" font-weight="700">磁場 B は同心円</text><text x="120" y="84" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400">丸は方位磁針の向き</text><text x="560" y="330" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#1c1c1c" text-anchor="start" font-weight="700">導線の断面</text><text x="560" y="352" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#6b6b6b" text-anchor="start" font-weight="400">点は電流が手前向き</text></svg>
