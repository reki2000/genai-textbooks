u Gothic, sans-serif" font-size="12" fill="#e07b1f" text-anchor="start" font-weight="400">輪の前側では</text><text x="620" y="182" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="12" fill="#e07b1f" text-anchor="start" font-weight="400">電流は下向き</text><text x="380" y="322" font-family="Noto Sans CJK JP, Hiragino Sans, Noto Sans JP, Yu Gothic, sans-serif" font-size="13" fill="#1c1c1c" text-anchor="middle" font-weight="700">変化を強める向きなら、エネルギーが無から増えてしまう</text></svg>
