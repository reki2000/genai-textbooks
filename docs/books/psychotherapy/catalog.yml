- id: psychotherapy
  category: thought
  created: '2026-08-04T14:14:37+09:00'
  question: 心の不調は、正しい相談先を一つ選べば解決するのか。
  plot: 八号店の開店を前に眠れなくなった焼肉チェーン社長・できる夫を、幼馴染のやる夫が助けようとして「分かったつもり」で拒まれる。精神科医やらない夫、公認心理師できる子、支援AIココロとともに、観察と推測を分け、精神科・心療内科・心理職・福祉職・一般相談の役割と限界を割り振り、治療目標、施設差、エビデンス、支援上の害を検証する。本人と会社の維持ループを変えながら、支援とは正解を当てることではなく、関係と仮説を選び直せる経路を作ることだと再発見する。
