  question: 汚れを落とす力と素材・人体を守る力を、限られた処方と現場条件の中でどう両立させるのか。現代の洗剤に入る各成分は何を担当しているのか。
  plot: 町の百周年祭の前夜、屋台村の廃油と灰で煮た石鹸液で洗濯所を泡の雪崩に沈めたやる夫が、シロクマ着ぐるみと七枚の試験布を手掛かりに、洗濯所を営むやらない夫と一晩で界面・硬水・けん化・助剤・酵素・漂白・皮膚・保存を検証し、一本の万能液ではなく、用途別の三本と判断カードで失敗を予測できる洗浄の仕組みを作る。
