documents:
- id: local-government
  category: society
  created: '2026-07-05T10:35:11+09:00'
  question: 政令指定都市の市長はどこまで都市を動かせるのか、大都市の権限・財政・議会はどのように噛み合うのか。
  plot: 人口150万人の政令指定都市に当選した新人市長やる夫が、給食費無償化の公約を執行しようとして二元代表制に阻まれ、政令市だけが背負う権限と、市の金が市の自由にならない財政の仕組みを知る。財政指標の道具箱を組み立てて新市庁舎と給食費を両立できる形へ導き、夕張の破綻と未完成の大都市制度へ行き着く。
