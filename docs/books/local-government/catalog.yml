- id: local-government
  category: society
  created: '2026-07-05T10:35:11+09:00'
  question: 政令指定都市の新人市長は、公約をどこまで、どんな形なら実行できるのか。権限・財政・議会はどこで噛み合うのか。
  plot: 人口150万人の中原市で当選したやる夫は、「100日で公約を形にする」と宣言して就任初日に市長印を押す。だが予算は議会が決め、来年度予算は前市長のもとで夏から組まれていた。深夜の地震で古い庁舎と市が管理する県道が傷み、児童相談所の一時保護所は定員を超えている。やる夫は前副市長やらない夫と財政の道具を組み立て、給食費・庁舎・保護所を、議会が検算できる段階案へ作り直す。年度末、税収の下振れと夕張の完済が重なる夜に、自分の約束の扱いを選ぶ。
