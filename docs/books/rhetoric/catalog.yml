documents:
- id: rhetoric
  category: thought
  created: '2026-07-30T00:00:00+00:00'
  question: 正しいことを言ったのに議論で負けるのはなぜか。弁論術は何を得るために使う技術なのか。
  plot: 深夜の討論配信で812対88の惨敗を喫したやる夫が、隣室の男から制圧・防御・誘導・協働という四つの勝ち方を教わる。だがその四つは「意見の対立」しか扱えないと崩され、交渉と数字を足した技と、六つある対話の型を学び直す。予告なく仕掛けられる技を見破りながら、判定者・関係・争点・何が残っていてほしいかの四つの問いで、その場ごとの勝ち方を選べるようになる。
