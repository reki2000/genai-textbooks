documents:
- id: rhetoric
  category: thought
  created: '2026-07-30T00:00:00+00:00'
  draft: true
  question: 正しいことを言ったのに、議論で負けるのはなぜか。言葉で人を動かす技は、何を得るために、どこまで使ってよいのか。
  plot: 深夜の討論配信で812対88の惨敗を喫したやる夫が、隣室の男から制圧・防御・誘導・協働という四つの勝ち方を教わる。気持ちよく勝った夜の15秒は切り抜かれて市の資料に載り、取引先への詫び状には覚えたての答弁が紛れ込む。交渉と数字、謝罪と訂正、並べ方を学び直しながら、予告なく仕掛けられる技を見破り、判定者・関係・争点・何が残っていてほしいかの四つの問いで、その場ごとの勝ち方と、使ってはいけない技を選べるようになる。
