documents:
- id: tokyo-roads-v3
  category: engineering
  draft: true
  created: '2026-09-08T12:00:00+09:00'
  question: 東京の道路を固有名詞の暗記でなく、中心・放射・環状・川・地形・階層・時刻の重なりとしてどう読むか。
  plot: 日の出までに東京七地点の10秒を生中継する個人配信者やる夫が、全高3.35mの放送車で高さ3.2mのガードに止められるところから始まる。助手席には20年東京の夜を走った運転手やらない夫が座り、答えを言わずに数字だけ渡す。やる夫は「区間の真ん中だけ数えて出入りを落とす」を五度くり返しながら、実行可能集合、一般化費用、放射と方向、位相、環状の半径、橋のボトルネック、逐次更新、階層ネットワーク、地図の版、待ち行列、信頼性、誘発交通を自分で組み立て、最後は通れない道を選ばずに車と自転車を無線でつなぐ。
