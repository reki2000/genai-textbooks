deviations:
  - "初期案の第1〜4幕をユーザー合意により第1幕の総支給計算と第2幕の控除計算へ統合し、固定給・変動給は補助概念へ変更した。"
  - "特殊計算、制度史、国際比較の追加により標準4.8万字案からサーベイ15.9万字案へ拡張した。"
  - "全幕執筆後の本文対応検査で薄い節へ具体的反例・逆算・独立照合を追加し、各幕プロットの目標分量と往復数へ同期した。"
  - "参考文献定義が終幕の概算分量へ混入しないよう、本文冒頭の節外へ移動した。"
