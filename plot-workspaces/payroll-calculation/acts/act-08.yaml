schema_version: 1
book_slug: payroll-calculation
act_id: act-08
purpose_detail: "2社給与を単純合算する案を壊し、源泉徴収の主従区分と社会保険の複数事業所調整を別経路で理解する。"
sections:
  - id: act-08-sec-01
    title: "8-1　同じ名前の明細が2枚"
    function: opening
    core_concept_id: null
    supporting_concept_ids: [tax-return-boundary, table-driven-deduction]
    entry_thread_ids: [thread-missing-money, thread-authority, thread-many-jurisdictions]
    drama: {type: comedy, turn: "2社分を足して計算手数料を取る夢が、各社の情報範囲で止まる。"}
    setup_ids: []
    payoff_ids: []
    callback_ids: [clue-two-employers, clue-old-ledger]
    exit_thread_ids: [thread-missing-money, thread-authority, thread-many-jurisdictions]
    closing_realization: "本人の全体と各会社が計算できる範囲を分ける必要があると見抜く。"
    target_chars: 2400
    target_dialogue_rounds: 8
  - id: act-08-sec-02
    title: "8-2　2社とも甲欄にはできない ── 主従区分"
    function: rediscovery
    core_concept_id: multiple-workplaces
    supporting_concept_ids: [table-driven-deduction, tax-return-boundary, withholding-not-final]
    entry_thread_ids: [thread-authority, thread-many-jurisdictions]
    rediscovery:
      problem: "2社とも扶養情報を使う同じ低い源泉欄で計算する。"
      naive_attempt: "本人条件は同じだから各社が同じ欄を使えば公平だと考える。"
      failure_direction: "主たる給与と従たる給与の区分、申告書の提出先、最終精算を無視する。"
      counterexample: "2社が同じ控除を重複利用する研修例で年間の仮徴収不足を出す。"
      cause_to_verbalize: "各支払者は自社の区分で源泉し、本人全体は別の精算へつなぐと説明させる。"
      correction_direction: "申告書提出先、主従区分、各社の表、本人の確定申告要否を並べる。"
      verification: "A社甲欄・B社乙欄の研修表で源泉額を求める。"
    drama: {type: tension, turn: "両社で控除を二重取りする得策が、精算不足の反例で崩れる。"}
    setup_ids: []
    payoff_ids: [clue-two-employers]
    callback_ids: []
    exit_thread_ids: [thread-authority, thread-many-jurisdictions]
    closing_realization: "同じ人でも支払者ごとに役割が違い、全体の最終答案は別に束ねるとまとめる。"
    target_chars: 2400
    target_dialogue_rounds: 8
  - id: act-08-sec-03
    title: "8-3　保険料も2社で勝手に割らない ── 複数事業所勤務"
    function: rediscovery
    core_concept_id: multi-office-insurance
    supporting_concept_ids: [assessment-bases, rule-source-boundary]
    entry_thread_ids: [thread-authority, thread-many-jurisdictions]
    rediscovery:
      problem: "2社が自社給与だけで標準報酬と保険料を独立計算する。"
      naive_attempt: "各社が自社分だけ見れば重複せず簡単だと考える。"
      failure_direction: "制度上の合算・按分・選択事業所・届出という調整経路を無視する。"
      counterexample: "A社200,000円、B社150,000円を別々の等級へ入れる場合と合算後按分する研修例を比べる。"
      cause_to_verbalize: "税の主従区分と保険の事業所間調整は似て見えて別制度だと説明させる。"
      correction_direction: "各社報酬、合算標準額、按分通知、各社控除額の順で追う。"
      verification: "公的通知を受けた後の研修用按分額を2社合計で検算する。"
    drama: {type: conflict, turn: "保険料を半分ずつ割る即席案が通知額との不一致で崩れる。"}
    setup_ids: []
    payoff_ids: []
    callback_ids: []
    exit_thread_ids: [thread-authority, thread-many-jurisdictions]
    closing_realization: "複数勤務先では自社だけで完結させず、調整機関の通知へつなぐとまとめる。"
    target_chars: 2400
    target_dialogue_rounds: 8
  - id: act-08-sec-04
    title: "8-4　本人全体と会社の明細を分ける"
    function: verification
    core_concept_id: null
    supporting_concept_ids: [multiple-workplaces, multi-office-insurance, reconciliation]
    entry_thread_ids: [thread-missing-money, thread-authority, thread-many-jurisdictions]
    drama: {type: relief, turn: "自社明細、調整通知、本人の年間精算を3枚に分けて混乱がほどける。"}
    setup_ids: []
    payoff_ids: []
    callback_ids: []
    exit_thread_ids: [thread-missing-money, thread-authority, thread-many-jurisdictions]
    closing_realization: "1人の全体像を意識しつつ、自社が確定できる欄だけを正しく作るとまとめる。"
    target_chars: 2400
    target_dialogue_rounds: 8
  - id: act-08-sec-05
    title: "8-5　赤鉛筆で2社をつなぐ ── 複数勤務先の検算"
