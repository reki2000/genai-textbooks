  - id: act-04-sec-02
    title: "4-2　前月給与を見る理由 ── 賞与計算"
    function: rediscovery
    core_concept_id: bonus-calculation
    supporting_concept_ids: [assessment-bases, table-driven-deduction, payroll-timeline]
    entry_thread_ids: [thread-missing-money, thread-authority]
    rediscovery:
      problem: "賞与500,000円へ月例の源泉税額表と標準報酬月額をそのまま使う。"
      naive_attempt: "金額が大きい月給として賞与を処理する。"
      failure_direction: "賞与固有の保険対象額と源泉税算定経路を無視する。"
      counterexample: "同額賞与でも前月給与と扶養条件で源泉率が変わる研修表を比べる。"
      cause_to_verbalize: "賞与は支給・保険・源泉税の各入口を月例と分けると説明させる。"
      correction_direction: "賞与額、標準賞与額、前月社会保険料控除後給与、扶養条件を順に置く。"
      verification: "研修用賞与500,000円を専用表で計算し月額表の誤答と比べる。"
    drama: {type: wonder, turn: "大ボーナスで富豪になる夢が、別経路を組む面白さへ変わる。"}
    setup_ids: []
    payoff_ids: []
    callback_ids: []
    exit_thread_ids: [thread-missing-money, thread-authority]
    closing_realization: "賞与は月例の倍率でなく、専用の対象額と表で独立に計算するとまとめる。"
    target_chars: 2600
    target_dialogue_rounds: 8
  - id: act-04-sec-03
    title: "4-3　現金でなくても給与か ── 現物給与"
    function: rediscovery
    core_concept_id: in-kind-pay
    supporting_concept_ids: [rule-source-boundary, assessment-bases]
    entry_thread_ids: [thread-authority]
    rediscovery:
      problem: "社宅や食事は振込額でないから給与計算の外だと捨てる。"
      naive_attempt: "口座へ入った現金だけが給与だと考える。"
      failure_direction: "労働の対価として得る経済的利益と制度上の評価額を見落とす。"
      counterexample: "同じ手取りでも無料社宅がある社員とない社員の利益を比べる。"
      cause_to_verbalize: "現金以外でも対象になり得るが、時価を勝手に決めず評価基準が要ると説明させる。"
      correction_direction: "現物の種類、本人負担、評価額、各制度への算入可否を分ける。"
      verification: "研修用社宅評価30,000円・本人負担10,000円の差額を対象欄へ置く。"
    drama: {type: conflict, turn: "社宅を無料おまけにして人気会社を作る夢が評価額で崩れる。"}
    setup_ids: []
    payoff_ids: []
    callback_ids: []
    exit_thread_ids: [thread-authority]
    closing_realization: "現金かどうかで切らず、利益の性質と公的評価基準を確認するとまとめる。"
    target_chars: 2600
    target_dialogue_rounds: 8
  - id: act-04-sec-04
    title: "4-4　現金手取りと課税対象を分ける"
    function: verification
    core_concept_id: null
    supporting_concept_ids: [bonus-calculation, in-kind-pay, assessment-bases]
    entry_thread_ids: [thread-missing-money, thread-authority]
    drama: {type: tension, turn: "現物評価額をそのまま振込へ足す誤りを、現金流と算定基礎の2列で修正する。"}
    setup_ids: []
    payoff_ids: []
    callback_ids: []
    exit_thread_ids: [thread-missing-money, thread-authority, thread-annual-settlement]
    closing_realization: "現金支給額と制度上の対象額は同じ表へ押し込まず並行して追うとまとめる。"
    target_chars: 2600
    target_dialogue_rounds: 8
  - id: act-04-sec-05
