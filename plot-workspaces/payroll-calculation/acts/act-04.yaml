sections:
  - id: act-04-sec-01
    title: "4-1　ボーナスも月給と同じか ── 支払種別"
    function: bridge
    core_concept_id: null
    supporting_concept_ids: [payroll-equation, table-driven-deduction]
    entry_thread_ids: [thread-missing-money, thread-authority]
    drama: {type: comedy, turn: "月例給与を極めた万能感が、賞与用の別資料で空振りする。"}
    setup_ids: []
    payoff_ids: []
    callback_ids: []
    exit_thread_ids: [thread-missing-money, thread-authority]
    closing_realization: "同じ会社からの支払でも月給と賞与は入口を分ける必要があると見抜く。"
    target_chars: 2600
