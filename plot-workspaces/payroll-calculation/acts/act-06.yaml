    entry_thread_ids: [thread-missing-money, thread-authority, thread-many-jurisdictions]
    drama: {type: reflection, turn: "全欄を埋める達成感から、正しい相手へ渡す達成感へ変わる。"}
    setup_ids: []
    payoff_ids: []
    callback_ids: [clue-passport]
    exit_thread_ids: [thread-missing-money, thread-authority, thread-many-jurisdictions]
    closing_realization: "給与担当の責任は自社計算の外側を消すことではなく境界を示すことだとまとめる。"
    target_chars: 2400
    target_dialogue_rounds: 8
