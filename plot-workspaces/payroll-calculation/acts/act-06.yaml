purpose_detail: "退職金を最終給与へ混ぜる案を壊し、会社で完結する年末調整と本人が行う確定申告の境界を見つける。"
sections:
  - id: act-06-sec-01
    title: "6-1　最後の給与に全部載せるな"
    function: bridge
    core_concept_id: null
    supporting_concept_ids: [payroll-equation, year-end-reconciliation]
    entry_thread_ids: [thread-missing-money, thread-authority, thread-annual-settlement]
    drama: {type: tension, turn: "退職者へ全部まとめて払う親切が、支払種別の混同を起こす。"}
    setup_ids: [clue-passport]
    payoff_ids: []
    callback_ids: [clue-folded-payslip]
    exit_thread_ids: [thread-missing-money, thread-authority, thread-annual-settlement]
    closing_realization: "最終給与と退職金は同じ退職日に払っても別経路だと見抜く。"
    target_chars: 2400
    target_dialogue_rounds: 8
  - id: act-06-sec-02
    title: "6-2　長年分を月給と分ける ── 退職所得"
    function: rediscovery
    core_concept_id: retirement-income-separation
    supporting_concept_ids: [payroll-equation, table-driven-deduction]
    entry_thread_ids: [thread-missing-money, thread-authority]
    rediscovery:
      problem: "退職金5,000,000円を最終月給へ足して月額表を引く。"
      naive_attempt: "会社からの現金はすべて当月給与として合算する。"
      failure_direction: "長年の勤務に対応する一時金を通常給与と同じ期間へ押し込む。"
      counterexample: "同じ5,000,000円でも勤続年数で研修用控除額が変わる例を比べる。"
      cause_to_verbalize: "退職金は支給額、退職所得控除、課税対象、源泉税を別経路で求めると説明させる。"
      correction_direction: "勤続年数と申告書の有無を確認し、研修用退職所得表へ入れる。"
      verification: "最終給与との単純合算誤答と分離計算の差を確かめる。"
    drama: {type: wonder, turn: "巨額月給に興奮する夢が、期間対応の考えへ変わる。"}
    setup_ids: []
    payoff_ids: []
    callback_ids: []
    exit_thread_ids: [thread-missing-money, thread-authority]
    closing_realization: "支払者が同じでも、何年分の何の対価かで計算経路を分けるとまとめる。"
    target_chars: 2400
    target_dialogue_rounds: 8
  - id: act-06-sec-03
    title: "6-3　会社が最後まで計算しないもの ── 確定申告との境界"
    function: rediscovery
    core_concept_id: tax-return-boundary
    supporting_concept_ids: [rule-source-boundary, withholding-not-final, year-end-reconciliation]
    entry_thread_ids: [thread-authority, thread-annual-settlement]
    rediscovery:
      problem: "副業所得や医療費まで会社の年末調整へ全部入れようとする。"
      naive_attempt: "社員の税は会社が一括して最終確定すれば便利だと考える。"
      failure_direction: "会社が持つ給与情報と本人だけが持つ他所得・控除情報の境界を無視する。"
      counterexample: "自社給与だけ、2社給与、医療費、事業所得の4カードを年末調整へ入れて破綻させる。"
      cause_to_verbalize: "給与計算、年末調整、確定申告は情報主体と精算範囲が違うと説明させる。"
      correction_direction: "会社処理、本人申告、専門確認の3経路へ分類する。"
      verification: "4カードの最終処理主体を判定する。"
    drama: {type: conflict, turn: "社員全員の税務王になる夢が情報境界で崩れる。"}
    setup_ids: []
    payoff_ids: []
    callback_ids: []
    exit_thread_ids: [thread-authority, thread-many-jurisdictions]
    closing_realization: "会社で見えない事情を推測せず、本人の確定申告へつなぐとまとめる。"
    target_chars: 2400
    target_dialogue_rounds: 8
  - id: act-06-sec-04
    title: "6-4　計算結果を次の人へ渡す ── 引継ぎ資料"
    function: verification
    core_concept_id: null
    supporting_concept_ids: [retirement-income-separation, tax-return-boundary, reconciliation]
    entry_thread_ids: [thread-missing-money, thread-authority, thread-many-jurisdictions]
    drama: {type: relief, turn: "自社で終わらない処理も、金額・根拠・期限を添えれば安全につながる。"}
    setup_ids: []
    payoff_ids: []
    callback_ids: []
    exit_thread_ids: [thread-missing-money, thread-authority, thread-many-jurisdictions]
    closing_realization: "分からないと投げるのでなく、自社の確定範囲と次の手続きを明示して渡すとまとめる。"
    target_chars: 2400
    target_dialogue_rounds: 8
  - id: act-06-sec-05
    title: "6-5　赤鉛筆で精算先まで追う ── 境界の検算"
    function: recurring-corner
    core_concept_id: null
