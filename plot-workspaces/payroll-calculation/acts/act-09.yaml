  - id: act-09-sec-02
    title: "9-2　一人の設計者はいなかった ── 制度の積層"
    function: rediscovery
    core_concept_id: historical-layering
    supporting_concept_ids: [rule-source-boundary, payroll-timeline]
    entry_thread_ids: [thread-why-this-shape]
    rediscovery:
      problem: "現代の給与明細を一人の官僚が最初から設計したと想像する。"
      naive_attempt: "全欄は同じ目的で同時に追加されたと考える。"
      failure_direction: "賃金保護、所得税徴収、社会保険、住民税が別時代・別目的で成立したことを無視する。"
      counterexample: "各制度の導入順を入れ替えるカード問題で、存在しない制度を古い台帳へ載せてしまう。"
      cause_to_verbalize: "給与明細は単一設計でなく制度が支払点へ積み重なった接続面だと説明させる。"
      correction_direction: "制度ごとに開始時期、目的、徴収主体、対象、精算先を時間軸へ置く。"
      verification: "古い台帳から現代明細へ欄を年代順に追加し、その目的を対応させる。"
    drama: {type: wonder, turn: "無能な設計者探しが、制度の地層を読む探検へ変わる。"}
    setup_ids: []
    payoff_ids: []
    callback_ids: []
    exit_thread_ids: [thread-why-this-shape]
    closing_realization: "複雑さの理由を一つへ還元せず、各欄が何を解決するため増えたかを追うとまとめる。"
    target_chars: 2400
    target_dialogue_rounds: 8
  - id: act-09-sec-03
    title: "9-3　なぜ会社が集めるのか ── 支払者による徴収"
    function: rediscovery
    core_concept_id: employer-as-collector
    supporting_concept_ids: [rule-source-boundary, withholding-not-final]
    entry_thread_ids: [thread-authority, thread-why-this-shape]
    rediscovery:
      problem: "税・保険は本人が毎月別々に払い、会社は総額だけ渡せばよい制度を無条件に最善とする。"
      naive_attempt: "会社が介在しなければ明細も事務も単純になると考える。"
      failure_direction: "徴収の確実性、納付回数、本人事務、会社負担、プライバシーのトレードオフを見ない。"
      counterexample: "100人が個別納付する案と会社が支払時にまとめる案を件数・未納リスク・事務量で比べる。"
      cause_to_verbalize: "雇用主は定期的な支払点だから徴収窓口に選ばれやすいが費用と責任も負うと説明させる。"
      correction_direction: "徴収主体、情報主体、精算主体、負担者を分けて制度を評価する。"
      verification: "本人納付案と源泉徴収案を4軸で比較し、単純な勝者を作らない。"
    drama: {type: conflict, turn: "会社天引き全廃で英雄になる夢が未納と事務負担の反例で揺れる。"}
    setup_ids: []
    payoff_ids: []
    callback_ids: []
    exit_thread_ids: [thread-authority, thread-why-this-shape]
    closing_realization: "会社徴収は自然法則でなく、確実性と事務負担を配分する制度選択だとまとめる。"
    target_chars: 2400
    target_dialogue_rounds: 8
  - id: act-09-sec-04
    title: "9-4　年末調整と住民税が残した形"
    function: verification
    core_concept_id: null
    supporting_concept_ids: [year-end-reconciliation, employer-as-collector, payroll-timeline]
    entry_thread_ids: [thread-why-this-shape]
    drama: {type: tension, turn: "税は一種類という理解が、国税の源泉・年末精算と地方税通知の時間差でほどける。"}
    setup_ids: []
