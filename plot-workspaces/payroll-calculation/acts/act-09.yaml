    core_concept_id: null
    supporting_concept_ids: [payroll-equation, payroll-timeline]
    entry_thread_ids: [thread-missing-money, thread-authority, thread-why-this-shape]
    drama: {type: wonder, turn: "昔は単純で優秀だったという決めつけが、保障と徴収の欠落という問いへ変わる。"}
    setup_ids: []
    payoff_ids: [clue-old-ledger]
    callback_ids: [clue-folded-payslip]
    exit_thread_ids: [thread-missing-money, thread-authority, thread-why-this-shape]
