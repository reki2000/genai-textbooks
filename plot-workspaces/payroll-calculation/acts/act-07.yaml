    entry_thread_ids: [thread-missing-money, thread-authority, thread-many-jurisdictions]
    drama: {type: tension, turn: "会社負担分と本人受取額を混ぜた二重計上を六層の検算票で発見する。"}
    setup_ids: []
    payoff_ids: []
    callback_ids: []
    exit_thread_ids: [thread-missing-money, thread-authority, thread-many-jurisdictions]
    closing_realization: "国ごとの支給を合算する前に同じ利益を別名で数えていないか確認するとまとめる。"
