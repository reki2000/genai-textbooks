# 新規教材の提案（200件）
#
# docs/catalog.yaml と同じスキーマ（id / title / path / category / order /
# question / plot）で記述した案のリスト。採用するものを docs/catalog.yaml の
# documents に移し、対応する docs/books/<id>/README.md を用意する。
#
# 設計方針:
#   - 出発点は「分野の名前」ではなく、日常で観測できる異常・逆説・割に合わない現実。
#   - question は、常識的な予想が外れる一点に絞る（「〜のはずなのに、なぜ〜」）。
#   - 答えが一つの学問に収まらず、物理・制度・経済・認知のいずれかを跨ぐものを選ぶ。
#   - order は各カテゴリの既存最大値の続きから10刻み。
#
# 内訳: society 50 / engineering 40 / math-information 35 /
#       natural-science 40 / thought 35

documents:
  # ---- society（社会と制度）: 既存の最大 order は 90 ----
  - id: queue-vs-price
    title: やる夫の行列に値段をつけていいものか
    path: /books/queue-vs-price
    category: society
    order: 100
    question: 行列、抽選、先着、審査、値上げ──同じ足りないものを配るのに、なぜ方法によって不公平と感じたり感じなかったりするのか。
    plot: 人気店の値上げを提案して炎上したやる夫が、災害時の水、保育園の入園、臓器移植、混雑した道路を同じ配分問題として並べ、価格・くじ・待ち時間・優先順位がそれぞれ何を測り、費用を誰に押しつけているのかを設計しなおす。
  - id: unclaimed-benefits
    title: やる夫の作った制度は誰にも使われないようです
    path: /books/unclaimed-benefits
    category: society
    order: 110
    question: 最も助けが必要な人ほど申請しないのはなぜか、制度の中身は条文ではなくどこで決まっているのか。
    plot: 完璧なはずの支援制度の利用率が2割で止まり、やる夫が申請書、添付書類、窓口の待ち時間、スティグマ、情報の届き方をたどって、給付の実質を決めているのが要件ではなく手続コストと発見可能性であることに突き当たる。
  - id: uninsurable-risks
    title: やる夫の保険は地震で潰れるようです
    path: /books/uninsurable-risks
    category: society
    order: 120
    question: 自動車事故には保険が売れるのに、地震・失業・大流行には民間保険が成立しないのはなぜか。
    plot: 大数の法則を信じて安く売ったやる夫の保険会社が一度の災害で吹き飛び、独立でないリスク、逆選択、裾の厚い分布、再保険と資本、そして最後の引受人としての国家という順に、保険が引ける線を引き直す。
  - id: regulation-after-accident
    title: やる夫のルールは誰かが死んでからできるようです
    path: /books/regulation-after-accident
    category: society
    order: 130
    question: 危険が事前に分かっていても、なぜ規制は事故のあとにしか作られないのか。先回りした規制はなぜ嫌われるのか。
    plot: 新素材の安全基準を作る側に回ったやる夫が、費用は今・便益は将来という非対称、立証責任の置き場所、業界の情報優位、規制の虜、予防原則の暴走を経て、事故を待たずに書ける条文の形を探す。
  - id: authoritarian-elections
    title: やる夫は勝つと決まっている選挙をやるようです
    path: /books/authoritarian-elections
    category: society
    order: 140
    question: 結果が動かないのなら、独裁者はなぜわざわざ選挙や議会や統計を用意するのか。
    plot: 架空の権威主義国家の顧問になったやる夫が、茶番だと切り捨てた選挙が、動員力の可視化、地方幹部の忠誠審査、不満のガス抜き、統治に必要な情報収集として機能していることを知り、制度が正統性ではなく技術として使われる論理をたどる。
  - id: corruption-equilibrium
    title: やる夫はどこからが賄賂か分からないようです
    path: /books/corruption-equilibrium
    category: society
    order: 150
    question: 同じ人間なのに、袖の下が当たり前の社会と異常な社会に分かれるのはなぜか。
    plot: 海外拠点で手数料を求められて固まるやる夫が、贈与と対価の境界、多数が従うから従うという均衡、摘発確率の閾値効果、給与水準と内部通報を通じて、腐敗が個人の道徳ではなく均衡の選択であることを見る。
  - id: same-job-different-pay
    title: やる夫の給料は仕事ではなく会社で決まっているようです
    path: /books/same-job-different-pay
    category: society
    order: 160
    question: 同じ仕事、同じ能力なのに、勤め先が違うだけで賃金が倍違うのはなぜか。
    plot: 転職した友人の年収が跳ね上がった理由を能力に求めたやる夫が、限界生産力の説明では合わない現実から、企業レントの分け前、探索と摩擦、内部労働市場、買い手独占、最低賃金の実験結果へ進む。
  - id: drug-pricing
    title: やる夫の薬は国境を越えると値段が変わるようです
    path: /books/drug-pricing
    category: society
    order: 170
    question: 同じ一錠が国によって10倍違う値段で売られ、それでも製薬会社も患者も引き下がらないのはなぜか。
    plot: 難病薬の価格交渉に立ち会うやる夫が、巨額の開発費とほぼゼロの製造原価という構造、特許による期間限定の独占、国別価格差別、参照価格制、費用対効果評価という一年の命の値段の計算に向き合う。
  - id: poverty-trap
    title: やる夫は貧しいほど高い買い物をしているようです
    path: /books/poverty-trap
    category: society
    order: 180
    question: 余裕のない人ほど割高な支払いを重ねるのはなぜか。それは判断の誤りなのか、環境の帰結なのか。
    plot: 家計が回らない理由を意志の弱さに求めたやる夫が、まとめ買いできない現金制約、少額多頻度の割高、欠乏が奪う認知資源、信用へのアクセス、マイクロファイナンスの成果と限界を確かめ、自分の説教が的を外していたことを知る。
  - id: shrinking-city-costs
    title: やる夫の町は人が減るほど高くつくようです
    path: /books/shrinking-city-costs
    category: society
    order: 190
    question: 人口が減れば一人当たりの取り分は増えるはずなのに、暮らしがむしろ苦しくなるのはなぜか。
    plot: 人口半減の推計を渡された自治体のやる夫が、密度で決まるインフラ単価、家が余っても家賃が下がらない市場の分断、撤退に伴う補償、そして拡げるより難しい畳む計画の合意形成を組み立てる。
  - id: standards-war
    title: やる夫の規格は誰も選んでいないのに決まったようです
    path: /books/standards-war
    category: society
    order: 200
    question: より優れた方式が負け、誰が決めたわけでもない規格が世界を縛るのはなぜか。
    plot: 自社方式を業界標準にしたいやる夫が、性能表を握りしめて敗北し、ネットワーク外部性、キーボード配列や電源形状の経路依存、標準化団体と特許プール、オープンとクローズドの綱引きを通じて、勝敗が期待の調整で決まる場を歩く。
  - id: immigration-backlash
    title: やる夫の町は人手が足りないのに人を入れたくないようです
    path: /books/immigration-backlash
    category: society
    order: 210
    question: 移民が経済全体を潤すという計算が正しいとして、なぜ受け入れ社会はそれを歓迎しないのか。
    plot: 人手不足の解消策として受け入れ拡大を提案したやる夫が、集計の利益と局所の費用、賃金への影響をめぐる実証の食い違い、財政収支の世代差、言語と信頼、そして選挙で誰の票になるのかまでを突き合わせる。
  - id: relative-inequality
    title: やる夫は豊かになったのに不満が増えたようです
    path: /books/relative-inequality
    category: society
    order: 220
    question: 全員の暮らしが昔より良くなったのに、なぜ不公平感はかえって強まったのか。
    plot: 統計は改善を示すのに世論が荒れる理由を探すやる夫が、絶対水準と相対順位、参照集団の入れ替わり、ジニ係数が捉え損ねるもの、上位層の可視化、そして格差の何が実際に人を傷つけるのかを切り分ける。
  - id: inheritance-tax
    title: やる夫の相続税は理屈で勝って世論で負けるようです
    path: /books/inheritance-tax
    category: society
    order: 230
    question: 機会の平等を重んじる人ほど支持しそうな相続課税が、なぜ最も嫌われる税なのか。
    plot: 相続税強化の説明役になったやる夫が、二重課税という直観、家業と農地の流動性、生前贈与への逃避、資産形成の動機、そして家族という単位を国家がどう扱うのかという線引きに向き合う。
  - id: credential-inflation
    title: やる夫の学位は中身より入口で値段がつくようです
    path: /books/credential-inflation
    category: society
    order: 240
    question: 学んだ内容が同じでも学校名で待遇が変わるなら、教育は能力を高めているのか、それとも並べ替えているだけなのか。
    plot: 学歴不問を掲げた採用で失敗したやる夫が、人的資本とシグナリングの見分け方、卒業直前で価値が跳ねる羊皮紙効果、全員が学歴を積むと起きる軍拡競争、資格の増殖を通じて、教育投資の何が私的で何が社会的かを分ける。
  - id: hiring-interview
    title: やる夫の面接は当たらないと分かっているようです
    path: /books/hiring-interview
    category: society
    order: 250
    question: 面接の予測力が低いことは繰り返し示されているのに、なぜどの会社も面接をやめないのか。
    plot: 採用の当たり外れに悩むやる夫が、非構造化面接の妥当性研究、構造化と作業サンプル、面接官の自信と的中率の乖離、応募者側の納得感と儀式性、そして失敗の責任を誰が負うのかという組織の力学に行き着く。
  - id: performance-review
    title: やる夫の評価制度は誰も幸せにしないようです
    path: /books/performance-review
    category: society
    order: 260
    question: 公正に測ろうとするほど不満が増え、測った途端に測りたかったものが壊れるのはなぜか。
    plot: 人事評価の刷新を任されたやる夫が、相対評価の分布縛り、目標のゲーム化、指標が目的に化けるグッドハートの法則、報酬が内発的動機を押しのける現象を経て、測らずに報いる方法の可能性まで検討する。
  - id: red-tape
    title: やる夫の無駄な手続きは誰にも消せないようです
    path: /books/red-tape
    category: society
    order: 270
    question: 全員が無駄だと言う手続きが、なぜ何十年も生き残るのか。
    plot: 業務改革でハンコと三重チェックを廃止したやる夫が、一件の事故で全部復活させられ、説明責任、監査証跡、失敗の非対称な罰、前例と免責、そして手続が誰のリスクを吸収しているのかを解剖する。
  - id: concentrated-benefits
    title: やる夫は正しい政策を通せないようです
    path: /books/concentrated-benefits
    category: society
    order: 280
    question: 大多数が少し得をする改革が、ごく少数が大きく損をする改革に負け続けるのはなぜか。
    plot: 万人向けの合理的な改革案を潰され続けるやる夫が、集中する利益と分散する費用、組織化コスト、選挙のタイミングと便益の遅れ、補償の設計を通じて、正しさではなく通し方の技術を身につける。
  - id: polling-failure
    title: やる夫の調査は当たらなくなったようです
    path: /books/polling-failure
    category: society
    order: 290
    question: 統計理論は変わっていないのに、なぜ世論調査は昔より外れるようになったのか。
    plot: 選挙予測を外したやる夫が、固定電話からの離脱、回答してくれる人の偏り、答えを偽る動機、確率標本と非確率標本、加重と補正がかえって誤差を増やす場面を追い、当たらない予測を使う方法を考える。
  - id: news-values
    title: やる夫は大事なことほどニュースで見ないようです
    path: /books/news-values
    category: society
    order: 300
    question: 影響が大きい出来事ほど報じられず、珍しい事件が大量に流れるのはなぜか。
    plot: 交通事故と感染症と統計的な貧困の扱いの差に苛立つやる夫が、ニュース価値の条件、注意という有限資源の市場、締切と取材コスト、視聴数の指標化、そして報道されない害をどう可視化するかを考える。
  - id: conspiracy-belief
    title: やる夫の周りで頭のいい人ほど陰謀論を信じるようです
    path: /books/conspiracy-belief
    category: society
    order: 310
    question: 知識も分析力もある人が、なぜ荒唐無稽な説を精緻に擁護するようになるのか。
    plot: 論破すれば済むと考えたやる夫が失敗を重ね、反証を吸収する構造、所属と自己像の防衛、不確実性と無力感、知識が動員される方向、そして関係を切らずに問い直す会話のやり方を探す。
  - id: crime-decline
    title: やる夫の町は安全になったのに怖くなったようです
    path: /books/crime-decline
    category: society
    order: 320
    question: 犯罪は長期的に減り続けているのに、なぜ体感治安は悪化し、厳罰化の要求が強まるのか。
    plot: 防犯対策の予算を組むやる夫が、認知件数と実数の差、検挙率と刑の重さのどちらが抑止に効くか、人口動態や環境要因の寄与、割れ窓理論の再検証、報道量と不安の関係を突き合わせる。
  - id: fertility-policy
    title: やる夫の少子化対策は効かないようです
    path: /books/fertility-policy
    category: society
    order: 330
    question: 現金給付も保育所も充実させた国で出生率が戻らないのはなぜか。
    plot: 各国の政策と出生率のグラフを並べたやる夫が、単純な相関の崩れ方から、機会費用としての育児、住宅と雇用の安定、パートナー形成の段階、規範の変化、そして出生率を政策目標にすること自体の問題まで踏み込む。
  - id: marriage-institution
    title: やる夫は国家に結婚を管理される理由が分からないようです
    path: /books/marriage-institution
    category: society
    order: 340
    question: 二人の関係は当人の問題のはずなのに、なぜ国家が登録し、税や相続や在留資格を紐づけるのか。
    plot: 婚姻届の様式に疑問を持ったやる夫が、家族が担ってきた扶養と相続と親子の推定、税と社会保険の単位、同性婚と別姓の論点、契約で代替できる部分とできない部分を切り分ける。
  - id: eldercare-cost
    title: やる夫が親を介護すると社会が高くつくようです
    path: /books/eldercare-cost
    category: society
    order: 350
    question: 家族が無償で介護する方が安いはずなのに、社会全体では損になることがあるのはなぜか。
    plot: 介護離職を決めかけたやる夫が、失われる賃金と税、復職の困難、在宅と施設の費用比較、保険給付の設計、そして誰の時間を安く見積もってきたのかという計算の前提に向き合う。
  - id: end-of-life-care
    title: やる夫の医療費は最後の一ヶ月に集まるようです
    path: /books/end-of-life-care
    category: society
    order: 360
    question: 終末期に医療費が集中すると分かっていて、なぜそれを無駄と呼べないのか。
    plot: 高齢医療の適正化を任されたやる夫が、亡くなった後からしか終末期と分からないこと、助かる可能性の見積もり、本人の意思と家族の希望のずれ、事前指示の限界、そして撤退の決断を誰が担うのかを扱う。
  - id: organ-allocation
    title: やる夫の善意だけでは臓器が足りないようです
    path: /books/organ-allocation
    category: society
    order: 370
    question: 善意に頼る制度が慢性的に足りないのなら、対価を認めればよいのか、それでも認められない理由は何か。
    plot: 移植を待つ友人のためにやる夫が制度を調べ、意思表示の初期設定で提供率が変わる事実、売買を禁じる根拠、家族同意の運用、待機リストの優先順位、そして交換ドナーという市場でも贈与でもない仕組みに出会う。
  - id: crowding-out-incentives
    title: やる夫が謝礼を出したら献血が減ったようです
    path: /books/crowding-out-incentives
    category: society
    order: 380
    question: 報酬を増やせば行動は増えるはずなのに、金銭を持ち込むとかえって人が離れるのはなぜか。
    plot: 献血や保育の延長やごみ出しに謝礼と罰金を導入して失敗したやる夫が、内発的動機の押し出し、規範を金銭に置き換えたときの意味の変化、罰金が免罪符になる仕組み、そして制度が発するメッセージを設計対象として扱い始める。
  - id: rent-control
    title: やる夫の家賃規制は借りたい人を追い出すようです
    path: /books/rent-control
    category: society
    order: 390
    question: 家賃の上限を決めると、なぜすでに住んでいる人だけが得をして、これから借りる人が住めなくなるのか。
    plot: 高騰する家賃に上限を課したやる夫が、供給の縮小、質の低下、賃貸から分譲への転換、既存借家人の固定化、そして供給を増やす政策との効果比較を、実際に規制を導入した都市の記録で確かめる。
  - id: regional-revitalization
    title: やる夫の地方創生は東京を止められないようです
    path: /books/regional-revitalization
    category: society
    order: 400
    question: 補助金も移住支援も投じているのに、なぜ人と仕事は大都市へ集まり続けるのか。
    plot: 交付金の使い道を考えるやる夫が、集積が生む生産性、企業と人材の相互待ち、補助金が地価と既得権者に吸われる帰着、若年女性の転出理由、そして集中を前提にした地域設計という選択肢に行き着く。
  - id: farm-protection
    title: やる夫が農業を守るほど農業が弱るようです
    path: /books/farm-protection
    category: society
    order: 410
    question: 手厚い保護を続けてきた分野ほど担い手が減っているのはなぜか。
    plot: 農政の現場に立つやる夫が、価格支持と所得補償の違い、規模拡大を妨げる農地制度、兼業と補助金の関係、輸出で伸びた品目との比較を通じて、守る対象が産業なのか集落なのか景観なのかを明確にする。
  - id: fishery-commons
    title: やる夫の海は誰のものでもないから枯れるようです
    path: /books/fishery-commons
    category: society
    order: 420
    question: 全員が魚を残したいと願っているのに、なぜ獲り尽くしてしまうのか。
    plot: 不漁を嘆く港でやる夫が、早い者勝ちの構造、資源評価の不確かさ、漁獲枠の割り当てと譲渡、監視と罰則の費用、そして共有地が悲劇にならずに済んだ地域の共通点を調べ上げる。
  - id: public-debt
