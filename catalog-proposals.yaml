    plot: 配送の最短経路が即座に出たのに、車両と時間枠の割り当てで計算が終わらないやる夫が、多項式時間と組合せ爆発、帰着とNP完全、緩和と分枝限定、近似保証を通じて、厳密解を諦める判断の根拠を手に入れる。
  - id: quantum-not-fast
