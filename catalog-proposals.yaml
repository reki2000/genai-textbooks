# 新規教材の提案（50件）
#
# docs/catalog.yaml と同じスキーマ（id / title / path / category / order /
# question / plot）で記述した案のリスト。採用するものを docs/catalog.yaml の
# documents に移し、対応する docs/books/<id>/README.md を用意する。
#
# 設計方針:
#   - 出発点は「分野の名前」ではなく、日常で観測できる異常・逆説・割に合わない現実。
#   - question は、常識的な予想が外れる一点に絞る（「〜のはずなのに、なぜ〜」）。
#   - 答えが一つの学問に収まらず、物理・制度・経済・認知のいずれかを跨ぐものを選ぶ。
#   - order は各カテゴリの既存最大値の続きから10刻み。

documents:
  # ---- society（社会と制度）: 既存の最大 order は 90 ----
  - id: queue-vs-price
    title: やる夫の行列に値段をつけていいものか
    path: /books/queue-vs-price
    category: society
    order: 100
    question: 行列、抽選、先着、審査、値上げ──同じ足りないものを配るのに、なぜ方法によって不公平と感じたり感じなかったりするのか。
    plot: 人気店の値上げを提案して炎上したやる夫が、災害時の水、保育園の入園、臓器移植、ワクチン、混雑した道路を同じ配分問題として並べ、価格・くじ・待ち時間・優先順位がそれぞれ何を測り、費用を誰に押しつけているのかを設計しなおす。
  - id: unclaimed-benefits
    title: やる夫の作った制度は誰にも使われないようです
    path: /books/unclaimed-benefits
    category: society
    order: 110
    question: 最も助けが必要な人ほど申請しないのはなぜか、制度の中身は条文ではなくどこで決まっているのか。
    plot: 完璧なはずの支援制度の利用率が2割で止まり、やる夫が申請書、添付書類、窓口の待ち時間、スティグマ、情報の届き方をたどって、給付の実質を決めているのが要件ではなく手続コストと発見可能性であることに突き当たる。
  - id: uninsurable-risks
    title: やる夫の保険は地震で潰れるようです
    path: /books/uninsurable-risks
    category: society
    order: 120
    question: 自動車事故には保険が売れるのに、地震・失業・大流行には民間保険が成立しないのはなぜか。
    plot: 大数の法則を信じて安く売ったやる夫の保険会社が一度の災害で吹き飛び、独立でないリスク、逆選択、裾の厚い分布、再保険と資本、そして最後の引受人としての国家という順に、保険が引ける線を引き直す。
  - id: regulation-after-accident
    title: やる夫のルールは誰かが死んでからできるようです
    path: /books/regulation-after-accident
    category: society
    order: 130
    question: 危険が事前に分かっていても、なぜ規制は事故のあとにしか作られないのか。先回りした規制はなぜ嫌われるのか。
    plot: 新素材の安全基準を作る側に回ったやる夫が、費用は今・便益は将来という非対称、立証責任の置き場所、業界の情報優位、規制の虜、予防原則の暴走を経て、事故を待たずに書ける条文の形を探す。
  - id: authoritarian-elections
    title: やる夫は勝つと決まっている選挙をやるようです
    path: /books/authoritarian-elections
    category: society
    order: 140
    question: 結果が動かないのなら、独裁者はなぜわざわざ選挙や議会や統計を用意するのか。
    plot: 架空の権威主義国家の顧問になったやる夫が、茶番だと切り捨てた選挙が、動員力の可視化、地方幹部の忠誠審査、不満のガス抜き、統治に必要な情報収集として機能していることを知り、制度が正統性ではなく技術として使われる論理をたどる。
  - id: corruption-equilibrium
    title: やる夫はどこからが賄賂か分からないようです
    path: /books/corruption-equilibrium
    category: society
    order: 150
    question: 同じ人間なのに、袖の下が当たり前の社会と異常な社会に分かれるのはなぜか。
    plot: 海外拠点で「手数料」を求められて固まるやる夫が、贈与と対価の境界、多数が従うから従うという均衡、摘発確率の閾値効果、給与水準と内部通報を通じて、腐敗が個人の道徳ではなく均衡の選択であることを見る。
  - id: same-job-different-pay
    title: やる夫の給料は仕事ではなく会社で決まっているようです
    path: /books/same-job-different-pay
    category: society
    order: 160
    question: 同じ仕事、同じ能力なのに、勤め先が違うだけで賃金が倍違うのはなぜか。
    plot: 転職した友人の年収が跳ね上がった理由を能力に求めたやる夫が、限界生産力の説明では合わない現実から、企業レントの分け前、探索と摩擦、内部労働市場、買い手独占、最低賃金の実験結果へ進む。
  - id: drug-pricing
    title: やる夫の薬は国境を越えると値段が変わるようです
    path: /books/drug-pricing
    category: society
    order: 170
    question: 同じ一錠が国によって10倍違う値段で売られ、それでも製薬会社も患者も引き下がらないのはなぜか。
    plot: 難病薬の価格交渉に立ち会うやる夫が、巨額の開発費とほぼゼロの製造原価という構造、特許による期間限定の独占、国別価格差別、参照価格制、費用対効果評価という「一年の命の値段」の計算に向き合う。
  - id: poverty-trap
    title: やる夫は貧しいほど高い買い物をしているようです
    path: /books/poverty-trap
    category: society
    order: 180
    question: 余裕のない人ほど割高な支払いを重ねるのはなぜか。それは判断の誤りなのか、環境の帰結なのか。
    plot: 家計が回らない理由を意志の弱さに求めたやる夫が、まとめ買いできない現金制約、少額多頻度の割高、欠乏が奪う認知資源、信用へのアクセス、マイクロファイナンスの成果と限界を確かめ、自分の説教が的を外していたことを知る。
  - id: shrinking-city-costs
    title: やる夫の町は人が減るほど高くつくようです
    path: /books/shrinking-city-costs
    category: society
    order: 190
    question: 人口が減れば一人当たりの取り分は増えるはずなのに、暮らしがむしろ苦しくなるのはなぜか。
    plot: 人口半減の推計を渡された自治体のやる夫が、密度で決まるインフラ単価、家が余っても家賃が下がらない市場の分断、撤退に伴う補償、そして拡げるより難しい「畳む計画」の合意形成を組み立てる。
  - id: standards-war
    title: やる夫の規格は誰も選んでいないのに決まったようです
    path: /books/standards-war
    category: society
    order: 200
    question: より優れた方式が負け、誰が決めたわけでもない規格が世界を縛るのはなぜか。
    plot: 自社方式を業界標準にしたいやる夫が、性能表を握りしめて敗北し、ネットワーク外部性、キーボード配列や電源形状の経路依存、標準化団体と特許プール、オープンとクローズドの綱引きを通じて、勝敗が技術ではなく期待の調整で決まる場を歩く。

  # ---- engineering（工学と産業）: 既存の最大 order は 120 ----
  - id: elevator-dispatch
    title: やる夫のビルはエレベーターが足りないようです
    path: /books/elevator-dispatch
    category: engineering
    order: 130
    question: かごを増やさずに待ち時間を短くできるのはなぜか。そもそも人が感じる待ち時間は何で決まっているのか。
    plot: 苦情の絶えないビルの管理を任されたやる夫が、増設案を予算で潰され、群管理制御、行き先階予約、朝夕で反転する需要、待ちのばらつき、鏡と残り時間表示という知覚側の設計まで、物理と心理の両方から待ちを削る。
  - id: induced-demand-roads
    title: やる夫が道を広げたら渋滞がひどくなったようです
    path: /books/induced-demand-roads
    category: engineering
    order: 140
    question: 車線を倍にしたのに渋滞が悪化するのはなぜか。混雑は本当に容量の不足なのか。
    plot: 幹線道路の拡幅を実現させたやる夫が、数年で元の混雑に戻る現実に直面し、誘発需要、経路選択の均衡、道を足すと全員が遅くなるブライスの逆説、移動するボトルネック、そして課金と時差通勤という需要側の操作へ回り込む。
  - id: automation-irony
    title: やる夫が自動化した現場から人が減らないようです
    path: /books/automation-irony
    category: engineering
    order: 150
    question: 自動化すれば人手は減るはずなのに、なぜ監視と例外対応の人員が増え、事故はかえって難しくなるのか。
    plot: 完全自動化を掲げたやる夫のラインが稀な例外で長時間止まり、自動化の皮肉、監視という人間に向かない作業、腕の落ちた運転員、権限をどちらが握るか、そして人を残す工程をあえて設計する考え方に行き着く。
  - id: safety-paradox
    title: やる夫は安全装置を足すほど怖くなったようです
    path: /books/safety-paradox
    category: engineering
    order: 160
    question: 守りを重ねたはずのシステムが、なぜ守りそのもののせいで壊れるのか。
    plot: 事故のたびにインターロックを追加してきたやる夫が、危険が減ると人が踏み込むリスク補償、鳴りやまない警報、共通原因故障、密結合が生む「正常な事故」を知り、故障を足で止めるのではなく壊れ方を選ぶ設計へ切り替える。
  - id: quality-not-inspection
    title: やる夫の検査では不良が減らないようです
    path: /books/quality-not-inspection
    category: engineering
    order: 170
    question: 全数検査をしているのに市場クレームが止まらないのはなぜか。品質は測れば上がるのか。
    plot: 検査員を増やして赤字を出したやる夫が、見逃しと過検出、ばらつきと工程能力、条件を振って鈍感な設定を探すパラメータ設計、抜取り検査の統計を通じて、品質は検査ではなく工程に作り込むしかないという結論に追い込まれる。
  - id: project-always-late
    title: やる夫の工期は必ず延びるようです
    path: /books/project-always-late
    category: engineering
    order: 180
    question: 一つ一つは間に合う見積もりなのに、全体は必ず遅れるのはなぜか。
    plot: 何度目かの納期遅延を出したやる夫が、作業時間の分布の裾、早く終わっても前倒しされない仕組み、合流点で遅れだけが残る性質、バッファの置き場所、計画錯誤と参照クラス予測を通じて、期限ではなく分布で約束する方法を組む。
  - id: building-lifespan
    title: やる夫のビルは壊れる前に壊されるようです
    path: /books/building-lifespan
    category: engineering
    order: 190
    question: 百年前の建物が現役なのに、三十年のビルが解体されるのはなぜか。寿命を決めているのは何か。
    plot: まだ使える自社ビルの建替え提案に納得できないやる夫が、躯体・設備・法規・用途・帳簿という別々に進む五つの寿命を並べ、改修可能性を左右する設計、更新と解体の費用比較を通じて、寿命が物理ではなく制度と経済で決まる仕組みを見る。
  - id: overpackaging
    title: やる夫は包装を減らして怒られたようです
    path: /books/overpackaging
    category: engineering
    order: 200
    question: 過剰に見える包装を減らすと、なぜ環境負荷がかえって増えることがあるのか。
    plot: 環境のためにパッケージを薄くしたやる夫が、輸送中の破損と返品の山を作り、衝撃と振動、酸素と水分の遮断、賞味期限、捨てられた中身の環境負荷との比較を通じて、包装の最適点が製品ごとに違う理由を計算で確かめる。
  - id: electricity-bill
    title: やる夫の電気代は使った分だけではないようです
    path: /books/electricity-bill
    category: engineering
    order: 210
    question: 同じ量を使っても、いつ使うかで費用が変わるのはなぜか。電気の値段は何を反映しているのか。
    plot: 節電したのに請求が下がらないやる夫が、キロワットとキロワット時の違い、契約電力とデマンド、託送料金、時間帯で桁が変わる限界費用、再エネの出力抑制、蓄電と需要応答までを一枚の明細から逆算する。
  - id: phone-slows-down
    title: やる夫のスマホは三年で遅くなるようです
    path: /books/phone-slows-down
    category: engineering
    order: 220
    question: 部品が摩耗するわけでもない端末が、なぜ数年で遅くなるのか。誰かがわざと遅くしているのか。
    plot: 買い替えを仕向けられていると疑うやる夫が、電池の内部抵抗による性能制限、熱設計とスロットリング、ストレージの空き容量、肥大するソフトウェア、更新が止まるセキュリティ寿命を切り分け、寿命の正体を一つずつ特定していく。
  - id: infrastructure-aging
    title: やる夫は作る側から看取る側になったようです
    path: /books/infrastructure-aging
    category: engineering
    order: 230
    question: 一斉に古びる橋やトンネルを、必要額の三分の一の予算でどう選び、どれを諦めるのか。
    plot: 点検台帳を渡されたやる夫が、劣化曲線と点検で見える範囲の限界、予防保全と事後保全の損得、集約と通行止めの判断、住民説明を通じて、「落ちないように直す」から「落ちる前に閉じる」への設計転換を経験する。
  - id: repairability
    title: やる夫の製品は直せなくなったようです
    path: /books/repairability
    category: engineering
    order: 240
    question: 直して使う方が得なはずなのに、修理できない製品ばかりになったのはなぜか。
    plot: 分解できない家電に怒るやる夫が、接着と一体成型が生む薄さと防水、部品点数と故障率、保守部品を十年抱える費用、修理工数と製造原価の逆転、修理する権利の議論を経て、直せる設計の代償を見積もる。

  # ---- math-information（数学と情報）: 既存の最大 order は 40 ----
  - id: incompressible
    title: やる夫の圧縮ファイルはもう縮まないようです
    path: /books/incompressible
    category: math-information
    order: 50
    question: どんなデータも縮める万能圧縮が作れないのはなぜか。「もう縮まない」とは何が起きている状態なのか。
    plot: 二重に圧縮して容量が増えたやる夫が、鳩の巣論法による不可能性証明から出発し、情報量とエントロピー、乱数と圧縮不能性、コルモゴロフ複雑性を経て、「意味のあるデータほど縮む」という直観の正体に辿り着く。
  - id: no-random
    title: やる夫は本物の乱数が作れないようです
    path: /books/no-random
    category: math-information
    order: 60
    question: 決まった手順しか実行できない機械が、なぜ予測できない数を出せるのか。出せていないとしたら何が困るのか。
    plot: ゲームの抽選が偏っていると苦情を受けたやる夫が、線形合同法の周期、統計検定を通ってしまう偽の乱数、暗号論的疑似乱数、物理エントロピー源、シード流出で全部当てられた事故を通じて、乱数の品質が何のためにあるのかを知る。
  - id: floating-point
    title: やる夫は同じ計算で違う答えを得たようです
    path: /books/floating-point
    category: math-information
    order: 70
    question: 同じプログラムに同じ入力を与えたのに、動かす場所を変えると答えが変わるのはなぜか。
    plot: 集計値が数円ずれる原因を追うやる夫が、二進小数の表現誤差、桁落ちと丸め、足す順番で結果が変わる非結合性、並列化と再現性、金額計算に浮動小数点を使わない理由を経て、誤差を設計する数値計算へ進む。
  - id: consensus-clock
    title: やる夫のサーバは同じ時刻を持てないようです
    path: /books/consensus-clock
    category: math-information
    order: 80
    question: 正確な時計を全台に配ってもなお「どちらが先か」を決められないのはなぜか。
    plot: 二台構成にした途端に二重登録を出したやる夫が、通信遅延と時計のずれ、因果を数える論理時計、うるう秒で世界が止まった日、CAP定理、二相コミットとRaftを通じて、分散システムの順序が観測ではなく合意で作られることを知る。
  - id: search-vs-find
    title: やる夫は検索できるのに見つけられないようです
    path: /books/search-vs-find
    category: math-information
    order: 90
    question: 数十億件を一瞬で検索できる時代に、社内の一枚の資料が見つからないのはなぜか。
    plot: 「あるのに見つからない」問題の解決を任されたやる夫が、転置索引の速さ、語の一致と意味の一致の隔たり、ランキングと評価指標、クエリに現れない前提、埋め込み検索の得手不得手を通じて、失敗の在処が索引ではなく問いの側にあることを掴む。
  - id: big-data-wrong
    title: やる夫はデータを増やして間違えたようです
    path: /books/big-data-wrong
    category: math-information
    order: 100
    question: データが増えるほど結論は確かになるはずなのに、なぜ大量データほど誤った発見が量産されるのか。
    plot: 十万件のログから有意な法則を大量に見つけたやる夫が、多重比較、探索と検証の混同、集め方が生む選択バイアス、標本が大きいほど小さな偏りが有意になる仕組みを知り、事前登録と外部検証で自分の発見を潰しにかかる。
  - id: nobody-understands-it
    title: やる夫の会社のシステムは誰も全体を知らないようです
    path: /books/nobody-understands-it
    category: math-information
    order: 110
    question: 全体を理解している人間が一人もいないソフトウェアが、なぜ動き続けられるのか。
    plot: 二十年物の基幹システムの改修を任されたやる夫が、全部読むという方針を三日で捨て、境界と契約、局所の理解で安全に変えるための不変条件、組織構造がそのまま現れるコンウェイの法則、資料より信用できるテストを武器にしていく。
  - id: bugs-grow
    title: やる夫はバグを直すほど増やしているようです
    path: /books/bugs-grow
    category: math-information
    order: 120
    question: 修正は品質を上げるはずなのに、直すほど壊れるのはなぜか。テストはどこまでを保証しているのか。
    plot: 修正のたびに別の障害を出すやる夫が、結合度と回帰、テストが示せるのは欠陥の存在であって不在ではないこと、カバレッジの錯覚、契約と表明、形式手法が現実に引き合う範囲を切り分けていく。
  - id: unrecoverable-backup
    title: やる夫のバックアップは復旧できなかったようです
    path: /books/unrecoverable-backup
    category: math-information
    order: 130
    question: 毎日欠かさず取っていたバックアップが、肝心なときに使えないのはなぜか。
    plot: 障害から戻せずに一晩を溶かしたやる夫が、書き込みが止まらない世界での静止点、気づかれない破損、暗号化被害まで伝播する複製、RPOとRTO、復旧訓練を通じて、設計すべきものが「取ること」ではなく「戻せること」だと知る。
  - id: assignment-hard
    title: やる夫は最短経路は解けるのに割り当てが解けないようです
    path: /books/assignment-hard
