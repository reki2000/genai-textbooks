<!DOCTYPE html>
<html lang="ja">

<head>
  <script>
    (function () {
      var loc = window.location;
      // Normalize an explicit .../index.html to its clean directory URL.
      if (/\/index\.html$/.test(loc.pathname)) {
        loc.replace(loc.pathname.replace(/index\.html$/, '') + loc.search + loc.hash);
        return;
      }
      // Redirect legacy hash-mode URLs (e.g. #/books/foo, from before the
      // history-mode migration) to their history-mode equivalent.
      var hash = loc.hash;
      if (hash.charAt(0) === '#' && hash.charAt(1) === '/') {
        var newPath = '@@BASE_PATH@@' + hash.slice(1);
        if (newPath.charAt(newPath.length - 1) !== '/') {
          newPath += '/';
        }
        loc.replace(newPath + loc.search);
      }
    })();
  </script>
  <meta charset="UTF-8">
  <title>@@TITLE@@</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="@@DESCRIPTION@@">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="@@BASE_PATH@@/assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3.2.0/dist/style.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css">
@@EXTRA_HEAD@@  <style>
    /* Site chrome. Every control lives in one fixed top bar that is the same
       on every device: the table-of-contents button and site name on the
       left, the book title in the middle, and the book-level controls
       (本文/要約, draft mode, theme) on the right. Only the sidebar changes
       with width: docked beside the text on wide screens, a drawer over it
       on narrower ones. docsify's own toggle and `body.close` are not used;
       `nav-hidden` (docked) and `nav-open` (drawer) replace them. */
    :root {
      --bar-height: 52px;
      --chrome-accent: var(--accent, #42b983);
    }

    .sidebar-toggle,
    .sidebar > h1.app-name {
      display: none !important;
    }

    #app-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      height: var(--bar-height);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      box-sizing: border-box;
      background: var(--background, #fff);
      border-bottom: 1px solid var(--borderColor, #eee);
      color: var(--textColor, #34495e);
      font-size: 14px;
    }

    #app-bar button,
    #app-bar a {
      font: inherit;
      color: inherit;
      text-decoration: none;
    }

    .bar-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      white-space: nowrap;
      flex: none;
    }

    .bar-button:hover {
      background-color: rgba(127, 127, 127, 0.12);
    }

    .bar-button svg {
      width: 20px;
      height: 20px;
      flex: none;
    }

    body.nav-open #nav-button,
    body:not(.nav-hidden) #nav-button.docked {
      color: var(--chrome-accent);
    }

    #bar-home img {
      width: 26px;
      height: 26px;
      opacity: 0.85;
    }

    #bar-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
      padding-left: 4px;
    }

    #view-switch {
      display: inline-flex;
      flex: none;
      padding: 2px;
      border: 1px solid var(--borderColor, #ddd);
      border-radius: 9px;
    }

    #view-switch[hidden] {
      display: none;
    }

    #view-switch button {
      height: 30px;
      padding: 0 12px;
      border: none;
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
    }

    #view-switch button[aria-pressed="true"] {
      background: var(--chrome-accent);
      color: #fff;
    }

    #draft-chip {
      color: #b95c42;
      border-color: #b95c42;
      height: 30px;
      font-size: 13px;
    }

    #theme-button {
      width: 36px;
      padding: 0;
      background: var(--toogleImage) center / 22px no-repeat;
    }

    .content #docsify-darklight-theme {
      display: none;
    }

    #read-progress {
      position: absolute;
      left: 0;
      bottom: -1px;
      height: 2px;
      width: 0;
      background: var(--chrome-accent);
    }

    /* Sidebar: always below the bar, positioned by the rules below rather
       than by docsify's own transforms. */
    .sidebar {
      position: fixed !important;
      top: var(--bar-height) !important;
      bottom: 0;
      left: 0 !important;
      padding-top: 0 !important;
      width: var(--sidebar-width, 300px);
      transition: transform 0.25s ease-out;
    }

    .content {
      padding-top: calc(var(--bar-height) + 12px) !important;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      scroll-margin-top: calc(var(--bar-height) + 12px);
    }

    #nav-scrim {
      display: none;
    }

    #sidebar-resizer {
      display: none;
    }

    /* Wide screens (desktop, landscape tablets): the sidebar is docked and
       open by default; the 目次 button hides it. */
    @media (min-width: 1024px) {
      .content {
        left: var(--sidebar-width, 300px) !important;
        transform: none !important;
      }

      body.nav-hidden .sidebar {
        transform: translateX(-100%) !important;
      }

      body.nav-hidden .content {
        left: 0 !important;
      }

      #sidebar-resizer {
        display: block;
        position: fixed;
        top: var(--bar-height);
        bottom: 0;
        left: calc(var(--sidebar-width, 300px) - 3px);
        width: 6px;
        z-index: 25;
        cursor: col-resize;
        touch-action: none;
      }

      #sidebar-resizer:hover,
      body.resizing #sidebar-resizer {
        background-color: var(--chrome-accent);
        opacity: 0.35;
      }

      body.nav-hidden #sidebar-resizer {
        display: none;
      }

      body.resizing {
        cursor: col-resize;
        user-select: none;
      }

      body.resizing .sidebar,
      body.resizing .content {
        transition: none;
      }
    }

    /* Narrow screens (portrait tablets, phones): the sidebar is a drawer
       over the text, closed by default, with a scrim that closes it. */
    @media (max-width: 1023px) {
      .sidebar {
        width: min(86vw, 360px);
        transform: translateX(-100%) !important;
        z-index: 45;
      }

      body.nav-open .sidebar {
        transform: none !important;
        box-shadow: 0 0 24px rgba(0, 0, 0, 0.18);
      }

      .content {
        left: 0 !important;
        transform: none !important;
      }

      body.nav-open #nav-scrim {
        display: block;
        position: fixed;
        inset: var(--bar-height) 0 0 0;
        z-index: 44;
        background: rgba(0, 0, 0, 0.35);
      }
    }

    @media (max-width: 768px) {
      .markdown-section {
        max-width: 95%;
      }
    }

    /* Phones: drop the text labels that fit on wider bars. */
    @media (max-width: 600px) {
      #app-bar {
        gap: 4px;
        padding: 0 4px;
      }

      #bar-home .bar-label,
      #draft-chip .bar-label,
      #bar-title {
        display: none;
      }

      #bar-home {
        padding: 0 4px;
        margin-right: auto;
      }

      #view-switch button {
        padding: 0 9px;
      }
    }

    #slide-frame {
      display: none;
      position: fixed;
      top: var(--bar-height);
      bottom: 0;
      left: 0;
      z-index: 15;
      border: none;
      background: #fff;
      width: 100%;
      height: calc(100% - var(--bar-height));
    }

    @media (min-width: 1024px) {
      #slide-frame {
        left: var(--sidebar-width, 300px);
        /* iframe is a replaced element: percentage width resolves against
           the fixed-position containing block (the viewport), not against
           the space remaining after `left`, so it must be computed here
           explicitly or the right edge overflows off-screen. */
        width: calc(100% - var(--sidebar-width, 300px));
      }

      body.nav-hidden #slide-frame {
        left: 0;
        width: 100%;
      }
    }

    body.slide-mode .content {
      display: none;
    }

    body.slide-mode #slide-frame {
      display: block;
    }

  </style>
</head>

<body>
  <div id="app"></div>
  <script>

    // Draft mode. Books flagged `draft: true` in catalog.yml are built and
    // reachable by URL like any other, but scripts/generate_site.py keeps them
    // out of README.md, _sidebar.md and sitemap.xml, listing them only in the
    // README.draft.md / _sidebar.draft.md variants loaded below.
    //
    // ?draft=1 turns the mode on and ?draft=0 turns it off, but the choice has
    // to be remembered: history-mode navigation drops the query string, so a
    // query alone would fall back to the public listings on the first click.
    // Reading it here, before docsify is configured, also means the listings
    // are never rendered twice.
    var draftMode = false
    try {
      var draftParam = new URLSearchParams(window.location.search).get('draft')
      if (draftParam !== null) {
        window.localStorage.setItem('draft-mode', draftParam === '0' ? '' : '1')
      }
      draftMode = window.localStorage.getItem('draft-mode') === '1'
    } catch (e) {
      // Private-mode browsers can throw on localStorage; the public site is
      // the safe fallback.
    }

    window.$docsify = {
      name: '<span style="display:flex; align-items:center; margin-left:12px;"><img src="@@BASE_PATH@@/assets/favicon.png" alt="@@SITE_TITLE@@" width="36" height="36" style="opacity:0.85;"> @@SITE_TITLE@@</span>',
      nameLink: '@@BASE_PATH@@/',
      routerMode: 'history',
      relativePath: true,
      // The top page is swapped through `alias`, not through `homepage`:
      // docsify only applies `homepage` when the route resolves to exactly
      // "/README.md", and with basePath left empty (see nav_href in
      // generate_site.py) this site's root route is "/genai-textbooks/",
      // so `homepage` would never fire. `alias` matches the raw route path
      // and does. The sidebar takes a plain filename, which docsify then
      // looks up per directory and walks up on 404, exactly as it does for
      // the default _sidebar.md.
      alias: draftMode
        ? { '@@BASE_PATH@@/?': '@@BASE_PATH@@/README.draft.md' }
        : {},
      loadSidebar: draftMode ? '_sidebar.draft.md' : true,
      loadFooter: "_footer.md",
      subMaxLevel: 2,
      auto2top: true,
      markdown: {
        breaks: true,
      },
      plugins: [],
    };

    // Aozora-style ruby (｜基底《よみ》, see AGENTS.md) is converted to <ruby>
    // HTML by scripts/generate_site.py before the page ever reaches the
    // browser, so no docsify plugin is needed here.

    // Site chrome: the top bar, the sidebar drawer, the in-book table of
    // contents and the 本文/要約 switch. See the CSS block at the top for the
    // layout; this wires up the behavior and refreshes it on every docsify
    // route change, since the shell markup is shared across all pages.
    (function () {
      var basePath = '@@BASE_PATH@@'
      var slideDocIds = @@SLIDE_DOC_IDS@@
      var DOCK_QUERY = window.matchMedia('(min-width: 1024px)')
      var body = document.body

      var ICON_TOC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>'

      var bar = document.createElement('header')
      bar.id = 'app-bar'
      bar.innerHTML =
        '<button type="button" id="nav-button" class="bar-button" aria-controls="app-sidebar">' +
        ICON_TOC + '<span>目次</span></button>' +
        '<a id="bar-home" class="bar-button" href="' + basePath + '/">' +
        '<img src="' + basePath + '/assets/favicon.png" alt=""><span class="bar-label">@@SITE_TITLE@@</span></a>' +
        '<span id="bar-title"></span>' +
        '<span id="view-switch" role="group" aria-label="表示" hidden>' +
        '<button type="button" data-view="text">本文</button>' +
        '<button type="button" data-view="slide">要約</button></span>' +
        '<button type="button" id="theme-button" class="bar-button" title="明るさを切り替える" aria-label="明るさを切り替える"></button>' +
        '<div id="read-progress"></div>'
      body.insertBefore(bar, body.firstChild)

      var scrim = document.createElement('div')
      scrim.id = 'nav-scrim'
      body.appendChild(scrim)

      // Draft mode is shown as a chip in the bar, so the mode is never on
      // without saying so. Leaving it drops the stored flag and reloads the
      // current page on the public listings; a draft page stays readable,
      // it just goes back to being unlisted.
      if (draftMode) {
        var chip = document.createElement('button')
        chip.id = 'draft-chip'
        chip.type = 'button'
        chip.className = 'bar-button'
        chip.title = '下書きを一覧から隠す'
        chip.innerHTML = '下書き<span class="bar-label">表示中</span> ✕'
        chip.addEventListener('click', function () {
          try {
            window.localStorage.removeItem('draft-mode')
          } catch (e) {}
          window.location.href = window.location.pathname
        })
        bar.insertBefore(chip, document.getElementById('theme-button'))
      }

      // Sidebar open/closed. Docked (wide) screens remember the choice;
      // the drawer always starts closed.
      var navButton = document.getElementById('nav-button')
      try {
        if (window.localStorage.getItem('nav-hidden') === '1') {
          body.classList.add('nav-hidden')
        }
      } catch (e) {}

      function toggleNav() {
        if (DOCK_QUERY.matches) {
          var hidden = body.classList.toggle('nav-hidden')
          try {
            window.localStorage.setItem('nav-hidden', hidden ? '1' : '')
          } catch (e) {}
        } else {
          body.classList.toggle('nav-open')
        }
        syncNavButton()
      }

      function syncNavButton() {
        var open = DOCK_QUERY.matches
          ? !body.classList.contains('nav-hidden')
          : body.classList.contains('nav-open')
        navButton.setAttribute('aria-expanded', open ? 'true' : 'false')
        navButton.classList.toggle('docked', DOCK_QUERY.matches)
      }

      navButton.addEventListener('click', toggleNav)

      // docsify-darklight-theme renders its toggle into the article on every
      // route and binds it there; the bar button forwards to it.
      document.getElementById('theme-button').addEventListener('click', function () {
        var toggle = document.querySelector('.content #docsify-darklight-theme')
        if (toggle) toggle.click()
      })
      scrim.addEventListener('click', function () {
        body.classList.remove('nav-open')
        syncNavButton()
      })
      DOCK_QUERY.addEventListener('change', function () {
        body.classList.remove('nav-open')
        syncNavButton()
      })
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && body.classList.contains('nav-open')) {
          body.classList.remove('nav-open')
          syncNavButton()
        }
      })
      // Picking an entry in the drawer closes it.
      document.addEventListener('click', function (event) {
        var target = event.target
        if (!DOCK_QUERY.matches && target && target.closest &&
            target.closest('.sidebar a')) {
          body.classList.remove('nav-open')
          syncNavButton()
        }
      })
      syncNavButton()

      // Reading position: progress line under the bar.
      var ticking = false
      function onScroll() {
        if (ticking) return
        ticking = true
        window.requestAnimationFrame(function () {
          ticking = false
          var doc = document.documentElement
          var max = doc.scrollHeight - window.innerHeight
          var ratio = max > 0 ? Math.min(1, window.scrollY / max) : 0
          document.getElementById('read-progress').style.width =
            body.classList.contains('on-book') ? (ratio * 100) + '%' : '0'
        })
      }
      window.addEventListener('scroll', onScroll, { passive: true })

      // 本文 / 要約 switch: swaps the article body for the marp slide deck
      // (books/<id>/slide.html) on books that have one.
      var viewSwitch = document.getElementById('view-switch')
      var frame = null

      function syncViewSwitch() {
        var slide = body.classList.contains('slide-mode')
        viewSwitch.querySelectorAll('button').forEach(function (button) {
          var on = (button.getAttribute('data-view') === 'slide') === slide
          button.setAttribute('aria-pressed', on ? 'true' : 'false')
        })
      }
      viewSwitch.addEventListener('click', function (event) {
        var button = event.target.closest('button')
        if (!button) return
        body.classList.toggle('slide-mode', button.getAttribute('data-view') === 'slide')
        syncViewSwitch()
      })

      function currentBookId() {
        var path = window.location.pathname
        if (path.indexOf(basePath) === 0) path = path.slice(basePath.length)
        var match = path.match(/^\/books\/([^/]+)\//)
        return match ? match[1] : null
      }

      function update() {
        var bookId = currentBookId()
        body.classList.toggle('on-book', !!bookId)
        var h1 = document.querySelector('.markdown-section h1')
        document.getElementById('bar-title').textContent = bookId && h1 ? h1.textContent : ''

        // The catalog is long; bring the current book (and the headings
        // docsify expands under it) into view in the sidebar.
        var sidebar = document.querySelector('.sidebar')
        if (sidebar) {
          sidebar.id = 'app-sidebar'
          var active = sidebar.querySelector('.sidebar-nav li.active')
          if (active) {
            var top = active.getBoundingClientRect().top - sidebar.getBoundingClientRect().top
            sidebar.scrollTop += top - 12
          }
        }

        var hasSlide = !!bookId && slideDocIds.indexOf(bookId) !== -1
        viewSwitch.hidden = !hasSlide
        if (hasSlide) {
          if (!frame) {
            frame = document.createElement('iframe')
            frame.id = 'slide-frame'
            frame.title = '要約スライド'
            body.appendChild(frame)
          }
          if (frame.getAttribute('data-doc-id') !== bookId) {
            frame.src = basePath + '/books/' + bookId + '/slide.html'
            frame.setAttribute('data-doc-id', bookId)
          }
        } else if (frame) {
          frame.remove()
          frame = null
        }
        // Each navigation lands on the article; the reader opts into the
        // slide view explicitly.
        body.classList.remove('slide-mode')
        syncViewSwitch()

        onScroll()
      }

      window.$docsify.plugins.push(function (hook) {
        hook.doneEach(update)
      })
    })()
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3.2.0/dist/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-footnote@1.0.8/dist/docsify-footnote.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@alertbox/docsify-footer/dist/docsify-footer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script>
    // Drag the border between the sidebar and the content to resize it.
    // The width lives in --sidebar-width and is remembered per browser.
    (function () {
      const MIN_WIDTH = 180
      const MAX_WIDTH = 640
      const STORAGE_KEY = 'sidebarWidth'

      function setWidth(width) {
        document.documentElement.style.setProperty('--sidebar-width', width + 'px')
      }

      let width = 300
      try {
        const stored = parseInt(localStorage.getItem(STORAGE_KEY), 10)
        if (stored >= MIN_WIDTH && stored <= MAX_WIDTH) {
          width = stored
          setWidth(width)
        }
      } catch (error) {
        // localStorage can be unavailable (private mode); fall back to default.
      }

      const resizer = document.createElement('div')
      resizer.id = 'sidebar-resizer'
      document.body.appendChild(resizer)

      let dragging = false

      resizer.addEventListener('pointerdown', function (event) {
        dragging = true
        resizer.setPointerCapture(event.pointerId)
        document.body.classList.add('resizing')
        event.preventDefault()
      })

      resizer.addEventListener('pointermove', function (event) {
        if (!dragging) {
          return
        }
        width = Math.min(MAX_WIDTH, Math.max(MIN_WIDTH, Math.round(event.clientX)))
        setWidth(width)
      })

      function stopDragging() {
        if (!dragging) {
          return
        }
        dragging = false
        document.body.classList.remove('resizing')
        try {
          localStorage.setItem(STORAGE_KEY, String(width))
        } catch (error) {
          // Ignore storage failures; the width still applies for this session.
        }
      }

      resizer.addEventListener('pointerup', stopDragging)
      resizer.addEventListener('pointercancel', stopDragging)
    })()
  </script>
</body>

</html>
