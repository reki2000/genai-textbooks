<!DOCTYPE html>
<html lang="ja">

<head>
  <script>
    (function () {
      var loc = window.location;
      // Normalize an explicit .../index.html to its clean directory URL.
      if (/\/index\.html$/.test(loc.pathname)) {
        loc.replace(loc.pathname.replace(/index\.html$/, '') + loc.search + loc.hash);
        return;
      }
      // Redirect legacy hash-mode URLs (e.g. #/books/foo, from before the
      // history-mode migration) to their history-mode equivalent.
      var hash = loc.hash;
      if (hash.charAt(0) === '#' && hash.charAt(1) === '/') {
        var newPath = '@@BASE_PATH@@' + hash.slice(1);
        if (newPath.charAt(newPath.length - 1) !== '/') {
          newPath += '/';
        }
        loc.replace(newPath + loc.search);
      }
    })();
  </script>
  <meta charset="UTF-8">
  <title>@@TITLE@@</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="@@DESCRIPTION@@">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="@@BASE_PATH@@/assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3.2.0/dist/style.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css">
@@EXTRA_HEAD@@  <style>
    /* Move docsify's sidebar toggle from the bottom-left to the top-left, push
       the sidebar content down so the site name clears it, and render it as a
       compact button with white bars on a theme-colored background. */
    .sidebar-toggle,
    body.close .sidebar-toggle {
      top: 0;
      bottom: auto;
      width: auto;
      padding: 14px 16px 14px 14px;
      background-color: var(--theme-color, #42b983);
      border-bottom-right-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .sidebar-toggle span {
      background-color: #fff;
    }

    .sidebar {
      padding-top: 76px;
    }

    /* Drag handle between the sidebar and the content (desktop only). */
    #sidebar-resizer {
      display: none;
    }

    @media (min-width: 769px) {
      .sidebar {
        width: var(--sidebar-width, 300px);
      }

      .content {
        left: var(--sidebar-width, 300px);
      }

      body.close .sidebar {
        transform: translateX(calc(-1 * var(--sidebar-width, 300px)));
      }

      #sidebar-resizer {
        display: block;
        position: fixed;
        top: 0;
        bottom: 0;
        left: calc(var(--sidebar-width, 300px) - 3px);
        width: 6px;
        z-index: 25;
        cursor: col-resize;
        touch-action: none;
      }

      #sidebar-resizer:hover,
      body.resizing #sidebar-resizer {
        background-color: var(--theme-color, #42b983);
        opacity: 0.35;
      }

      body.close #sidebar-resizer {
        display: none;
      }

      body.resizing {
        cursor: col-resize;
        user-select: none;
      }

      body.resizing .sidebar,
      body.resizing .content {
        transition: none;
      }
    }

    @media (max-width: 768px) {
      .markdown-section {
        max-width: 95%;
      }
    }

    /* Toggle button for the marp slide summary, shown top-right on books that
       have one. Pressed (ON) swaps the article body for the slide iframe. */
    #slide-summary-toggle {
      position: fixed;
      top: 10px;
      right: 16px;
      z-index: 30;
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      background-color: var(--theme-color, #42b983);
      color: #fff;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    #slide-summary-toggle:hover {
      opacity: 0.85;
    }

    #slide-summary-toggle[aria-pressed="true"] {
      background-color: #333;
    }

    #slide-frame {
      display: none;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 15;
      border: none;
      background: #fff;
      width: 100%;
      height: 100%;
    }

    @media (min-width: 769px) {
      #slide-frame {
        left: var(--sidebar-width, 300px);
        /* iframe is a replaced element: percentage width resolves against
           the fixed-position containing block (the viewport), not against
           the space remaining after `left`, so it must be computed here
           explicitly or the right edge overflows off-screen. */
        width: calc(100% - var(--sidebar-width, 300px));
      }
    }

    body.slide-mode .content {
      display: none;
    }

    body.slide-mode #slide-frame {
      display: block;
    }

  </style>
</head>

<body>
  <div id="app"></div>
  <script>

    window.$docsify = {
      name: '<span style="display:flex; align-items:center; margin-left:12px;"><img src="@@BASE_PATH@@/assets/favicon.png" alt="@@SITE_TITLE@@" width="36" height="36" style="opacity:0.85;"> @@SITE_TITLE@@</span>',
      nameLink: '@@BASE_PATH@@/',
      routerMode: 'history',
      relativePath: true,
      loadSidebar: true,
      loadFooter: "_footer.md",
      subMaxLevel: 2,
      auto2top: true,
      markdown: {
        breaks: true,
      },
      plugins: [],
    };

    // Aozora-style ruby (｜基底《よみ》, see AGENTS.md) is converted to <ruby>
    // HTML by scripts/generate_site.py before the page ever reaches the
    // browser, so no docsify plugin is needed here.

    // Toggle button that swaps the article body for the marp slide deck
    // (books/<id>/slide.html) on book pages that have one, and back again.
    // Runs on every docsify route change since the shell markup is shared
    // across all pages.
    (function () {
      var slideDocIds = @@SLIDE_DOC_IDS@@
      if (!slideDocIds.length) {
        return
      }
      var basePath = '@@BASE_PATH@@'
      var buttonId = 'slide-summary-toggle'
      var frameId = 'slide-frame'

      function setSlideMode(on) {
        document.body.classList.toggle('slide-mode', on)
        var button = document.getElementById(buttonId)
        if (button) {
          button.setAttribute('aria-pressed', on ? 'true' : 'false')
          button.textContent = on ? '本文' : '要約'
        }
      }

      function updateSlideToggle() {
        var path = window.location.pathname
        if (path.indexOf(basePath) === 0) {
          path = path.slice(basePath.length)
        }
        var match = path.match(/^\/books\/([^/]+)\//)
        var docId = match && slideDocIds.indexOf(match[1]) !== -1 ? match[1] : null
        var button = document.getElementById(buttonId)
        var frame = document.getElementById(frameId)

        if (!docId) {
          if (button) button.remove()
          if (frame) frame.remove()
          document.body.classList.remove('slide-mode')
          return
        }

        if (!button) {
          button = document.createElement('button')
          button.id = buttonId
          button.type = 'button'
          button.addEventListener('click', function () {
            setSlideMode(!document.body.classList.contains('slide-mode'))
          })
          document.body.appendChild(button)
        }

        if (!frame) {
          frame = document.createElement('iframe')
          frame.id = frameId
          document.body.appendChild(frame)
        }

        if (frame.getAttribute('data-doc-id') !== docId) {
          frame.src = basePath + '/books/' + docId + '/slide.html'
          frame.setAttribute('data-doc-id', docId)
        }

        // Each navigation lands on the article; the reader opts into the
        // slide view explicitly via the toggle.
        setSlideMode(false)
      }

      window.$docsify.plugins.push(function (hook) {
        hook.doneEach(updateSlideToggle)
      })
    })()
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@3.2.0/dist/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-footnote@1.0.8/dist/docsify-footnote.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@alertbox/docsify-footer/dist/docsify-footer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script>
    // Drag the border between the sidebar and the content to resize it.
    // The width lives in --sidebar-width and is remembered per browser.
    (function () {
      const MIN_WIDTH = 180
      const MAX_WIDTH = 640
      const STORAGE_KEY = 'sidebarWidth'

      function setWidth(width) {
        document.documentElement.style.setProperty('--sidebar-width', width + 'px')
      }

      let width = 300
      try {
        const stored = parseInt(localStorage.getItem(STORAGE_KEY), 10)
        if (stored >= MIN_WIDTH && stored <= MAX_WIDTH) {
          width = stored
          setWidth(width)
        }
      } catch (error) {
        // localStorage can be unavailable (private mode); fall back to default.
      }

      const resizer = document.createElement('div')
      resizer.id = 'sidebar-resizer'
      document.body.appendChild(resizer)

      let dragging = false

      resizer.addEventListener('pointerdown', function (event) {
        dragging = true
        resizer.setPointerCapture(event.pointerId)
        document.body.classList.add('resizing')
        event.preventDefault()
      })

      resizer.addEventListener('pointermove', function (event) {
        if (!dragging) {
          return
        }
        width = Math.min(MAX_WIDTH, Math.max(MIN_WIDTH, Math.round(event.clientX)))
        setWidth(width)
      })

      function stopDragging() {
        if (!dragging) {
          return
        }
        dragging = false
        document.body.classList.remove('resizing')
        try {
          localStorage.setItem(STORAGE_KEY, String(width))
        } catch (error) {
          // Ignore storage failures; the width still applies for this session.
        }
      }

      resizer.addEventListener('pointerup', stopDragging)
      resizer.addEventListener('pointercancel', stopDragging)
    })()
  </script>
  <script>
    // On mobile the sidebar is shown by `body.close`; close it after picking an
    // entry. docsify only does this by itself below 600px, but our layout keeps
    // the mobile sidebar up to 768px.
    document.addEventListener('click', function (event) {
      if (window.innerWidth > 768) {
        return
      }
      const target = event.target
      if (!target || !target.closest || !target.closest('.sidebar a')) {
        return
      }
      document.body.classList.remove('close')
    })
  </script>
</body>

</html>
